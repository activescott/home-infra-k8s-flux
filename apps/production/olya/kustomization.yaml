apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - olya-rbac.yaml
  - olya-pv.yaml
  - olya-pvc.yaml
  - olya-statefulset.yaml
  - olya-service.yaml
  - olya-ingress.yaml
  - olya-networkpolicy.yaml
  - olya-memory-sync-cronjob.yaml
  # Image is private on GHCR, same as the other first-party images in this repo.
  - ../../../infrastructure/prod/configs/ghcr-pull-secret/
namespace: olya
configMapGenerator:
  # The gateway plugin list. seed-workspace copies the gateway config from the workspace
  # repo into /state/config after cloning, so this ConfigMap no longer carries it. OpenClaw
  # refuses to start on an invalid config, so validate before committing, from a checkout
  # of activescott/activeassistant:
  #   docker run --rm -v $PWD/openclaw.json:/cfg/openclaw.json:ro \
  #     -e OPENCLAW_CONFIG_PATH=/cfg/openclaw.json \
  #     -e OPENCLAW_GATEWAY_TOKEN=dummy \
  #     ghcr.io/activescott/olya:v0.1.0 openclaw config validate
  - name: olya-config
    files:
      - managed-plugins.txt
  - name: olya-scripts
    files:
      - scripts/seed-workspace.mts
      - scripts/instruction-sync.mts
      - scripts/memory-sync.mts
      - scripts/install-plugins.mts
      - scripts/check-memory-mounts.mts
      - scripts/reconcile-automations.mts
      - scripts/ssh-proxy-connect.mts
      # Imported by the three above. Not a program, but it ships in the same ConfigMap because
      # all three resolve it as ./volume-layout.mts from /scripts.
      - scripts/volume-layout.mts
  # Sends her HTTP(S) through the logging proxy in browser-chaperone-prod
  # (activescott/activeassistant#316). Loaded with envFrom by every container that goes online.
  #
  # Both cases, because curl reads only the lower-case http_proxy and OpenClaw lets lower case
  # shadow upper case. NODE_USE_ENV_PROXY makes Node's own fetch and http use them, which covers
  # the gateway, the ACP adapters and the MCP servers it starts.
  #
  # NO_PROXY is everything reached inside the cluster or on loopback: the gateway on
  # 127.0.0.1:18789, dev servers on *.localhost, every Service by its .svc or .svc.cluster.local
  # name (Loki, Grafana, Prometheus, the browser, kubernetes.default), and the pod and Service
  # ranges for anything addressed by IP (kubectl uses 172.17.0.1). The proxy refuses private
  # addresses, so anything in-cluster missing from this list gets a 403 from Squid.
  - name: olya-proxy-env
    literals:
      - HTTP_PROXY=http://olya-egress-proxy.browser-chaperone-prod.svc.cluster.local:3128
      - HTTPS_PROXY=http://olya-egress-proxy.browser-chaperone-prod.svc.cluster.local:3128
      - http_proxy=http://olya-egress-proxy.browser-chaperone-prod.svc.cluster.local:3128
      - https_proxy=http://olya-egress-proxy.browser-chaperone-prod.svc.cluster.local:3128
      - NO_PROXY=localhost,.localhost,127.0.0.1,::1,.svc,.cluster.local,172.16.0.0/12
      - no_proxy=localhost,.localhost,127.0.0.1,::1,.svc,.cluster.local,172.16.0.0/12
      - NODE_USE_ENV_PROXY=1
secretGenerator:
  # Keys: tinkerbell_api_token, openclaw_gateway_token, anthropic_api_key, openrouter_api_key,
  # and relay_bot_token and relay_app_token, which are the Slack relay's credentials and not Slack tokens
  # (activescott/activeassistant#315). Both must match the relay's Secret, in
  # ../browser-chaperone/.env.secret.slack-relay.encrypted.
  # The statefulset names the ones openclaw.json substitutes individually; see the comment there.
  - name: olya-env
    envs:
      - .env.secret.olya.encrypted
  # PAT for the memory-sync CronJob. Scott's, not Olya's, scoped to activeassistant only.
  - name: olya-memory-sync
    envs:
      - .env.secret.olya-memory-sync.encrypted
  # Her ssh private key, for git transport and commit signing. Binary rather than dotenv: a PEM
  # is multi-line. Note the generator KEY, not the filename, is what selects the SOPS input
  # format, so this must stay `id_ed25519=`.
  - name: olya-ssh
    files:
      - id_ed25519=olya-ssh.secret.encrypted
  # Key: openclaw_hooks_token, the bearer token Alertmanager presents to the gateway's /hooks
  # endpoint. Same value as
  # monitoring/prometheus/.env.secret.alertmanager-olya-hook.public-key-encrypted.encrypted;
  # rotate both together. The `public-key-encrypted` part of the name marks a secret that was
  # encrypted straight to the age recipient and has no plaintext anywhere; see README.md.
  - name: olya-hooks
    envs:
      - .env.secret.olya-hooks.public-key-encrypted.encrypted
  # Key: mcp_gateway_token, what she presents to the MCP gateway (browser-chaperone#39). Same
  # value as gateway_client_token in
  # ../browser-chaperone/.env.secret.mcp-gateway-token.public-key-encrypted.encrypted; rotate
  # both together.
  - name: olya-mcp-gateway
    envs:
      - .env.secret.olya-mcp-gateway.public-key-encrypted.encrypted
images:
  - name: olya-image
    newName: ghcr.io/activescott/olya # {"$imagepolicy": "flux-system:policy-olya:name"}
    newTag: main-1790309606 # {"$imagepolicy": "flux-system:policy-olya:tag"}
