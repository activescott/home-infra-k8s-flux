# The assistant. Single replica, and it must stay that way: OpenClaw keeps all state in local
# SQLite on one volume and documents no leader election or multi-replica support.
#
# `replicas` here is also the kill switch: set it to 0, commit, and Flux applies within seconds
# of the webhook. `kubectl scale` is NOT the mechanism: Flux reverts it inside 10 minutes, which
# looks like the assistant restarting itself.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: olya
  namespace: olya
spec:
  replicas: 1
  serviceName: olya
  selector:
    matchLabels:
      app: olya
  template:
    metadata:
      labels:
        # Alloy promotes this to the Loki `app` label and builds service_name as
        # namespace/app, so logs are queryable as {app="olya"} with no extra config.
        app: olya
    spec:
      serviceAccountName: olya
      imagePullSecrets:
        - name: github-container-registry-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Has no effect on a hostPath volume, which is why the PV comment insists the directory
        # is chowned to 1000:1000 on the NAS by hand. Kept because it does apply to the
        # emptyDir volumes below.
        fsGroup: 1000

      # Both initContainers repeat the container securityContext below. Pod-level settings do
      # NOT include the container-level ones, so without this an initContainer runs with
      # allowPrivilegeEscalation defaulting to true, no dropped capabilities, and a writable
      # root filesystem. seed-workspace in particular executes code it cloned from a git repo,
      # with the ssh key mounted, so it is the last place to leave at the defaults.
      initContainers:
        # Credentials and workspace. Clones activeassistant to /state/workspace, forces it to
        # origin/main, seeds the gateway config to /state/config, and relocates the memory files
        # to /state/memory, which the olya container bind-mounts back over workspace root.
        #
        # The split is what makes the read-only mounts on the olya container below possible:
        # everything declarative ends up under /state/workspace and /state/config, everything
        # she writes ends up under /state/memory, /state/repos, /state/home and /state/openclaw.
        # See scripts/seed-workspace.mts.
        - name: seed-workspace
          image: olya-image
          command: ["/scripts/seed-workspace.mts"]
          env:
            - name: HOME
              value: /state/home
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            # The persistent volume. This writes $HOME (/state/home: .ssh, dotfiles, the gh
            # OAuth profile) and the agent workspace checkout (/state/workspace).
            - name: state
              mountPath: /state
            # The olya-scripts ConfigMap: seed-workspace.mts itself, plus the volume-layout.mts
            # it imports. The scripts live as files in this directory so they are reviewable in
            # a diff instead of being a YAML heredoc.
            - name: scripts
              mountPath: /scripts
              readOnly: true
            # Her ed25519 private key, from the olya-ssh Secret. Needed here because the first
            # clone of the private dotfiles repo happens in this initContainer, over SSH.
            # ~/.ssh/config points IdentityFile at this path rather than copying the key.
            - name: ssh-key
              mountPath: /etc/olya-ssh
              readOnly: true
            # Scratch. readOnlyRootFilesystem means git, node and npm have nowhere else to
            # write; this is also where the known_hosts pin is fetched to.
            - name: tmp
              mountPath: /tmp

        # Installs managed plugins from /cfg/managed-plugins.txt via
        # scripts/install-plugins.mts. Idempotent: skips plugins whose trust record already
        # exists. See managed-plugins.txt for the plugin list and pinning notes. Runs after
        # seed-workspace because plugin commands need the seeded config in place.
        - name: install-plugins
          image: olya-image
          command: ["/scripts/install-plugins.mts"]
          env:
            - name: HOME
              value: /state/home
            - name: OPENCLAW_STATE_DIR
              value: /state/openclaw
            # /state/config, not /state/openclaw. Read-only in the olya container and nowhere
            # else, which is why this initContainer can still write plugin entries to it.
            - name: OPENCLAW_CONFIG_PATH
              value: /state/config/openclaw.json
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # 2Gi is load-bearing, not headroom. The skip path (`openclaw plugins inspect`)
          # finishes in ~1s well under 256Mi, so the limit looks oversized until an OpenClaw
          # upgrade invalidates the trust record on the PVC and this container takes the
          # install path instead: `openclaw plugins install` runs a real npm install, which
          # OOMKills at both 256Mi and 512Mi and completes in ~29s at 1Gi (measured against
          # olya:main-1790035615 / OpenClaw 2026.9.5). The `--force` reinstall path (version
          # mismatch, not just missing record) is heavier still: it OOMKilled at 1Gi after
          # running ~5min before the kill, so it's bumped to 2Gi. Every OpenClaw major re-runs
          # one of these paths, so do not size this back down to what a steady-state boot uses.
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /state
            - name: config
              mountPath: /cfg
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
        # Copies the Google Workspace credential JSON from the read-only Secret
        # volume to a writable emptyDir so the MCP server can persist refreshed
        # OAuth tokens. Secret volumes are always read-only in Kubernetes.
        - name: copy-workspace-creds
          image: olya-image
          command: ["sh", "-c", "cp /secret/credentials.json /data/credentials.json && chmod 0600 /data/credentials.json"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: 16Mi
            limits:
              cpu: "100m"
              memory: 32Mi
          volumeMounts:
            - name: google-workspace-creds
              mountPath: /secret
              readOnly: true
            - name: google-workspace-data
              mountPath: /data

      containers:
        - name: olya
          image: olya-image
          env:
            # $HOME cannot stay at the image's /home/node because the root filesystem is
            # read-only. This is the per-user config tree, so it holds her credential set.
            - name: HOME
              value: /state/home
            # Kept separate from $HOME so "wipe OpenClaw state" and "lose her credentials" are
            # different operations.
            - name: OPENCLAW_STATE_DIR
              value: /state/openclaw
            # The live gateway config sits in its OWN directory rather than inside the state
            # dir, and that is the whole point: /state/config can then be mounted read-only
            # below, while /state/openclaw stays writable for the SQLite databases.
            #
            # Both writers (seed-workspace.mts, instruction-sync.mts) overwrite this file IN
            # PLACE rather than replacing it, so the gateway's inotify watch on it survives an
            # update. Do not change either of them to unlink-and-recreate.
            - name: OPENCLAW_CONFIG_PATH
              value: /state/config/openclaw.json
            # Second layer, deliberately NOT the control. The control is the read-only mount of
            # /state/config below, which a write cannot get past whatever OpenClaw does. This
            # turns `openclaw config set` and the Control UI into an explicit "config is
            # externally managed" message instead of a bare EACCES, and it is upstream behavior
            # that could change; the mount is not.
            - name: OPENCLAW_CONFIG_READONLY
              value: "1"
            # REQUIRED for any git-over-ssh, not a preference. OpenSSH finds ~/.ssh from the
            # passwd entry, not from $HOME: uid 1000 here is `node`, whose passwd home is
            # /home/node on the read-only root filesystem. Without -F, ssh ignores the config
            # and known_hosts that seed-workspace wrote under $HOME and every clone fails with
            # "Host key verification failed". Inherited by the ACP adapters and by every shell
            # command they run, which is the point -- she clones work repos at runtime.
            - name: GIT_SSH_COMMAND
              value: ssh -F $(HOME)/.ssh/config
            # The two keys openclaw.json substitutes, plus provider API keys, named
            # individually rather than
            # with `envFrom: secretRef`. envFrom would pull in every key of olya-env, including
            # telegram_bot_token, which the `items` projection further down exists to keep OUT
            # of the environment: env is inherited by npx, the ACP adapters, and every shell
            # command they run, and shows up in /proc/<pid>/environ.
            #
            # Keep substituted keys in sync with `grep -o '\${[A-Z_]*}' openclaw.json`.
            # A missing substituted key is a startup failure, not a silent default.
            # Provider API keys (OPENROUTER_API_KEY) are read from the
            # environment by OpenClaw's provider plugins, not substituted in the config.
            #
            # olya-env also holds telegram_bot_token, which is NOT delivered as an env
            # var: it is a file (see the `items` projection below).
            # grafana_service_account_token and tinkerbell_api_token ARE delivered
            # below, for the mcp-grafana and tinkerbell MCP servers configured in
            # openclaw.json.
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: olya-env
                  key: openclaw_gateway_token
            - name: TELEGRAM_ALLOW_FROM
              valueFrom:
                secretKeyRef:
                  name: olya-env
                  key: telegram_allow_from
            # Where alert triage delivers, deliberately separate from the allowlist above.
            - name: TELEGRAM_ALERT_CHAT_ID
              value: "510755639"
            # OpenRouter API key for the fallback model chain.
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: olya-env
                  key: openrouter_api_key
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: olya-env
                  key: grafana_service_account_token
            - name: TINKERBELL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: olya-env
                  key: tinkerbell_api_token
            - name: WORKSPACE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: olya-google-workspace
                  key: google_workspace_client_id
            - name: WORKSPACE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: olya-google-workspace
                  key: google_workspace_client_secret
            - name: WORKSPACE_CREDENTIALS_PATH
              value: /etc/olya-google-workspace/credentials.json
            # hooks.token in openclaw.json. Has to be deployed before the config references it:
            # an unresolved ${OPENCLAW_HOOKS_TOKEN} stays a literal string.
            - name: OPENCLAW_HOOKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: olya-hooks
                  key: openclaw_hooks_token
          # Proves the memory bind mounts above are actually in place, and kills the container if
          # they are not. This is the ONLY place that check can run: the mounts exist in this
          # container's mount namespace and nowhere else, so seed-workspace cannot see them, and
          # seed-workspace creates the very files it would be asserting on.
          #
          # Exiting non-zero here crashloops the pod. That is the intended trade: a memory path
          # that is silently not writable loses her memory with no symptom, and this deployment
          # already prefers refusing to start (OpenClaw on an invalid config, memory-sync on a
          # missing directory, seed-workspace on an unreadable ssh key).
          lifecycle:
            postStart:
              exec:
                command: ["/scripts/check-memory-mounts.mts"]
          ports:
            - name: http
              containerPort: 18789
          # /startupz rather than /readyz for admission. /readyz additionally requires every
          # configured channel to pass a deep health check, so a Telegram hiccup would pull the
          # pod out of service for a problem that has nothing to do with serving traffic.
          # exec + loopback, NOT httpGet. A kubelet httpGet probe dials the pod IP from an
          # address inside the cluster pod CIDR -- which is exactly what gateway.trustedProxies
          # lists. The gateway therefore treats the probe as a proxied request, finds no
          # forwarded client headers, and answers 403. The pod then fails its startup probe and
          # is killed mid-turn, in a loop. Requests from 127.0.0.1 are exempt from that check,
          # so probing from inside the container avoids it entirely.
          #
          # timeoutSeconds is explicit on all three: the default is 1s, and a single-threaded
          # Node process busy with a compaction or a large model response can plausibly miss
          # that. On the liveness probe a missed response restarts the pod mid-task.
          startupProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:18789/startupz"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:18789/startupz"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:18789/health"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # 12Gi / 2Gi request: activescott/activeassistant#248 measured olya-0's working set
          # peaking at 7.93Gi (8,511,156,224 bytes) against the prior 8Gi limit, OOMKilling the
          # container mid-turn with three heavy agent sessions overlapping (install/build/test
          # work, not gh-only or review sessions). Backing out the ~1.1Gi idle baseline puts each
          # heavy session at roughly 2-2.5Gi. 12Gi covers three heavy sessions plus the idle
          # baseline with about 3.5Gi of margin, versus zero margin at 8Gi.
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 12Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
            # THE enforcement boundary. Same PVC as the mount above, mounted a second time over
            # each declarative subdirectory with readOnly: true.
            #
            # readOnly is per CONTAINER and per MOUNT ENTRY, so seed-workspace, install-plugins
            # and instruction-sync keep writing these paths through their own read-write /state
            # mount while nothing in THIS container can: not her tools, not the gateway, not a
            # shell command she runs. A write here fails with EROFS, and that failure is the
            # correct outcome rather than a bug to route around.
            #
            # This exists because the rule was previously enforced only by a boot-time
            # `git checkout --force` plus prose in AGENTS.md, which stops nothing between boots.
            # On 2026-09-15 the live openclaw.json was hand-edited from inside this container
            # and the gateway's file-watcher crashed the pod. See
            # docs/specs/olya-readonly-instructions/plan.md and activescott/activeassistant#71.
            #
            # DO NOT drop these two entries or their readOnly flags to make something work. If a
            # write needs to happen here, it belongs in a PR against activescott/activeassistant.
            - name: state
              mountPath: /state/workspace
              subPath: workspace
              readOnly: true
            - name: state
              mountPath: /state/config
              subPath: config
              readOnly: true
            # The memory files, mounted back over the read-only workspace so they stay writable.
            #
            # BIND MOUNTS, NOT SYMLINKS, and that is the whole point. OpenClaw resolves workspace
            # bootstrap files with rejectSymlinks, and memory-core additionally requires
            # stat.isFile() before writing DREAMS.md. The symlinks these replace made IDENTITY.md,
            # USER.md and MEMORY.md unreadable to the gateway and broke the dreaming sweep, with
            # no symptom beyond a warning nobody was grepping for.
            #
            # Three things have to line up for each entry, across two repos:
            #   1. the path is tracked in activescott/activeassistant, because the checkout is
            #      what provides the mountpoint and a bind mount cannot create its destination
            #      underneath a read-only parent;
            #   2. it is in MEMORY_PATHS in scripts/volume-layout.mts, so seed-workspace creates
            #      the SOURCE before this container starts -- kubelet makes a root-owned
            #      directory for a subPath source that does not exist, which fsGroup will not fix
            #      on a hostPath volume;
            #   3. it is listed here.
            # Miss 3 and nothing fails: the gateway reads the read-only checkout copy while the
            # hourly sync pushes an untouched file. The postStart hook below exists to catch that.
            #
            # USER.md is deliberately NOT here. It is a reviewed instruction file now
            # (activescott/activeassistant#84), so the gateway reads the read-only checkout
            # copy and changes to it arrive by PR like any other instruction file.
            #
            # THESE FILES MUST ONLY EVER BE EDITED IN PLACE. A bind mount is tied to the inode
            # that existed when the container started, so anything that REPLACES a file under
            # /state/memory rather than writing to it -- `mv`, `rm` and recreate, `sed -i`,
            # rsync without --inplace, an editor that saves via a temp file and renames, a
            # snapshot rollback of a running pod -- splits the two paths in half: the gateway
            # keeps using the orphaned inode while the hourly sync commits the new file, with no
            # error on either side. The agent has shell tools and can do this by accident, which
            # is why AGENTS.md section 6 states the same rule in her own instructions. The
            # `memory` directory mount is immune; renames inside a bind-mounted directory are
            # visible. Restarting the pod re-establishes a correct view.
            #
            # See docs/specs/olya-readonly-instructions/plan-memory-bind-mounts.md.
            - name: state
              mountPath: /state/workspace/MEMORY.md
              subPath: memory/MEMORY.md
            - name: state
              mountPath: /state/workspace/DREAMS.md
              subPath: memory/DREAMS.md
            - name: state
              mountPath: /state/workspace/IDENTITY.md
              subPath: memory/IDENTITY.md
            - name: state
              mountPath: /state/workspace/memory
              subPath: memory/memory
            # Image staging for the claude-cli backend, which builds its path as
            # <workspace>/.openclaw-cli-images with imagePathScope hardcoded to "workspace" and no
            # config key anywhere in `openclaw config schema`. The mountpoint is a tracked
            # .gitkeep in activeassistant for the reason in point 1 above.
            - name: state
              mountPath: /state/workspace/.openclaw-cli-images
              subPath: openclaw/cli-images
            - name: ssh-key
              mountPath: /etc/olya-ssh
              readOnly: true
            # subPath is REQUIRED, not tidiness. Mounting the volume at a directory gives the
            # usual Kubernetes symlink chain (token -> ..data/token), and OpenClaw's secret
            # loader will not follow it: the channel fails with "credential file is
            # unavailable" while the file is plainly readable from a shell. subPath bind-mounts
            # it as a regular file. The trade is that subPath mounts do not update in place
            # when the Secret changes, which is fine here -- the generator's name hash changes
            # on every edit, so the pod is replaced anyway.
            - name: telegram-token
              mountPath: /etc/olya-telegram/token
              subPath: token
              readOnly: true
            - name: google-workspace-data
              mountPath: /etc/olya-google-workspace
            # For the postStart hook only. She has no reason to run these, but the ConfigMap is
            # read-only here and holds nothing sensitive.
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp

        # Pulls instruction files from origin/main every 15 minutes so merged PRs take effect
        # without a pod restart. The update must never replace the memory files' inodes:
        # unlinking the checkout copy detaches the bind mounts on those paths in the olya
        # container's mount namespace (activescott/activeassistant#109). So it updates
        # everything except the memory files and moves the branch ref without touching them;
        # see syncCheckoutToOrigin in scripts/volume-layout.mts. There is nothing for it to
        # rebuild afterwards.
        #
        # Mounts /state read-write with no read-only overlay, which is what lets it write the
        # paths the olya container cannot. That asymmetry is the design, not an oversight.
        - name: instruction-sync
          image: olya-image
          command: ["/scripts/instruction-sync.mts"]
          env:
            - name: HOME
              value: /state/home
            - name: GIT_SSH_COMMAND
              value: ssh -F $(HOME)/.ssh/config
            # For reconcile-automations.mts, which calls the gateway on loopback as an operator.
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: olya-env
                  key: openclaw_gateway_token
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # The automation reconcile runs the openclaw CLI once per job file. The git loop alone
          # fits in 256Mi; the reconcile peaked at 365MiB RSS across its process tree (OpenClaw
          # 2026.9.5, one job file). 1Gi leaves headroom above that measured peak.
          resources:
            requests:
              cpu: "50m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 1Gi
          volumeMounts:
            - name: state
              mountPath: /state
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: ssh-key
              mountPath: /etc/olya-ssh
              readOnly: true
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: olya-state
        - name: config
          configMap:
            name: olya-config
        - name: scripts
          configMap:
            name: olya-scripts
            defaultMode: 0555
        - name: ssh-key
          secret:
            secretName: olya-ssh
            defaultMode: 0400
        # Projects just the bot token out of olya-env, renamed to `token`, because
        # channels.telegram.tokenFile wants a path to a regular file rather than an env var.
        # `items` keeps the rest of that Secret from also appearing on disk.
        - name: telegram-token
          secret:
            secretName: olya-env
            items:
              - key: telegram_bot_token
                path: token
            defaultMode: 0400
        # Google Workspace MCP credentials (read-only source). The initContainer
        # copies this to the writable google-workspace-data emptyDir so the MCP
        # server can persist refreshed OAuth tokens.
        - name: google-workspace-creds
          secret:
            secretName: olya-google-workspace
            items:
              - key: google_workspace_credentials_json
                path: credentials.json
            defaultMode: 0600
        - name: google-workspace-data
          emptyDir: {}
        # readOnlyRootFilesystem means node, npm, and git all need somewhere to write.
        - name: tmp
          emptyDir: {}
