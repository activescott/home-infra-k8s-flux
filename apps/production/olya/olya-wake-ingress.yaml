# The approval app's route to the chaperone-wake plugin (activescott/activeassistant#543).
# After each decision the app posts to
# http://traefik-internal.kube-system.svc:8001/chaperone/decision, and Traefik forwards that one
# path to the gateway on 18789.
#
# Through Traefik rather than straight to the pod because the app's pod IP is inside
# gateway.trustedProxies in openclaw.json. A direct connection could send any X-Forwarded-For it
# liked and lock remote token logins out through the gateway's auth limiter. Traefik trusts no
# forwarded headers (nothing sets forwardedHeaders.trustedIPs), so it replaces the app's
# X-Forwarded-For with the app's real address before the gateway sees it.
#
# `internal` is the ClusterIP-only entrypoint in infrastructure/prod/configs/traefik-config.yaml:
# plain HTTP, no redirect, and not on the LoadBalancer Service, so nothing outside the cluster can
# open a connection to it. The host is the Service name the app dials. Traefik matches on the Host
# header, not on DNS, which is why this must never move to web or websecure: anyone could send
# that Host to the WAN address.
#
# The allowlist is a second layer. Only in-cluster callers reach the entrypoint at all, and an
# in-cluster request to a ClusterIP arrives with the caller's pod IP as its source.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: chaperone-wake-pods-only
  namespace: olya
spec:
  # see https://doc.traefik.io/traefik/middlewares/http/ipallowlist/
  ipAllowList:
    sourceRange:
      - 172.16.0.0/16 # pod CIDR
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: olya-chaperone-wake
  namespace: olya
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: internal
    # namespace-name@kubernetescrd. Nothing validates the string: a typo drops the middleware
    # silently rather than erroring.
    traefik.ingress.kubernetes.io/router.middlewares: olya-chaperone-wake-pods-only@kubernetescrd
spec:
  rules:
    - host: traefik-internal.kube-system.svc
      http:
        paths:
          - path: /chaperone/decision
            pathType: Exact
            backend:
              service:
                name: olya
                port:
                  name: http
