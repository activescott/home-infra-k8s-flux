# Garage Door Integration
# Glues the Zooz ZEN17 relay (switch.garage_relay) and the Ecolink tilt sensor
# into a single cover entity.
#
# Migrated from the legacy `cover: - platform: template` / `covers:` schema,
# which Home Assistant removed in 2026.6. `default_entity_id` keeps the
# entity_id at cover.garage_door so the automations in automations.yaml and the
# dashboard cards keep working unchanged.
# See https://www.home-assistant.io/integrations/template/#cover
- cover:
    - name: "Garage Door"
      default_entity_id: cover.garage_door
      unique_id: garage_door_template_cover
      device_class: garage
      position: >-
        {% if states('binary_sensor.ecolink_garage_tilt_sensor_window_door_is_open') == "off" %}
          0
        {% else %}
          100
        {% endif %}
      open_cover:
        - condition: state
          entity_id: binary_sensor.ecolink_garage_tilt_sensor_window_door_is_open
          state: "off"
        - action: switch.toggle
          target:
            entity_id: switch.garage_relay
      close_cover:
        - condition: state
          entity_id: binary_sensor.ecolink_garage_tilt_sensor_window_door_is_open
          state: "on"
        - action: switch.toggle
          target:
            entity_id: switch.garage_relay
      stop_cover:
        - action: switch.toggle
          target:
            entity_id: switch.garage_relay
      icon: >-
        {% if states('binary_sensor.ecolink_garage_tilt_sensor_window_door_is_open') == "off" %}
          mdi:garage
        {% else %}
          mdi:garage-open
        {% endif %}
