apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot-docker
  namespace: zot-oci-registry
spec:
  interval: 10m
  chart:
    spec:
      chart: zot
      # See "Upgrading" in README.md.
      version: "0.1.122" # appVersion v2.1.18
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: zot-oci-registry
      interval: 24h
  values:
    replicaCount: 1

    # See zot-writable-helmrelease.yaml for why persistence/pvc are set this
    # way and why no chown step is needed.
    persistence: true
    pvc:
      create: false
      name: zot-docker-storage-pvc

    serviceHeadless:
      enabled: true
      port: 5000

    service:
      type: ClusterIP
      port: 5000

    ingress:
      enabled: true
      className: traefik
      pathtype: Prefix
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      hosts:
        - host: docker.oci-registry.activescott.com
          paths:
            - path: /
      tls:
        - hosts:
            - docker.oci-registry.activescott.com
          secretName: docker-oci-registry-activescott-com-tls

    mountConfig: true
    configFiles:
      # Dedicated mirror-only instance for docker.io, addressed at its own
      # hostname with NO path prefix (destination "/"), so it's a drop-in
      # target for standard container-runtime "registry mirror" config
      # (Docker daemon.json registry-mirrors, containerd hosts.toml) -
      # those mechanisms preserve the original /v2/<repo>/... path and
      # cannot be told to route under a shared prefix. See
      # docs/specs/zot-registry/plan.md for why the original single-instance
      # path-prefixed design (/docker.io/...) didn't work for this.
      #
      # "mirror" is read-only here - CI/kind pulls through this instance,
      # nothing pushes to it. No adminPolicy: nothing needs write access.
      config.json: |-
        {
          "distSpecVersion": "1.1.1",
          "storage": {
            "rootDirectory": "/var/lib/registry",
            "dedupe": true,
            "gc": true,
            "gcDelay": "1h",
            "gcInterval": "24h",
            "retention": {
              "dryRun": false,
              "delay": "24h",
              "policies": [
                {
                  "repositories": ["**"],
                  "deleteReferrers": true,
                  "deleteUntagged": true,
                  "keepTags": [{ "pulledWithin": "720h" }]
                }
              ]
            }
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000",
            "realm": "zot",
            "compat": ["docker2s2"],
            "auth": {
              "htpasswd": { "path": "/secrets/auth/htpasswd" }
            },
            "accessControl": {
              "repositories": {
                "**": {
                  "policies": [{ "users": ["mirror"], "actions": ["read"] }],
                  "defaultPolicy": []
                }
              },
              "metrics": {
                "anonymousPolicy": ["read"]
              }
            }
          },
          "log": { "level": "info" },
          "extensions": {
            "metrics": {
              "enable": true,
              "prometheus": { "path": "/metrics" }
            },
            "sync": {
              "enable": true,
              "credentialsFile": "/secrets/sync/credentials.json",
              "registries": [
                {
                  "urls": ["https://index.docker.io"],
                  "onDemand": true,
                  "tlsVerify": true,
                  "preserveDigest": true,
                  "maxRetries": 3,
                  "retryDelay": "5s",
                  "syncTimeout": "15m",
                  "content": [{ "prefix": "**", "destination": "/" }]
                }
              ]
            }
          }
        }

    # See zot-writable-helmrelease.yaml for why externalSecrets, not
    # mountSecret/secretFiles. zot-sync-credentials holds the Docker Hub
    # token (this is the only mirror instance that needs it - anonymous
    # pulls are fine for the other 3 upstreams).
    externalSecrets:
      - secretName: zot-sync-credentials
        mountPath: /secrets/sync # -> /secrets/sync/credentials.json
      - secretName: zot-htpasswd
        mountPath: /secrets/auth # -> /secrets/auth/htpasswd

    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "5000"
      prometheus.io/path: "/metrics"

    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
