apiVersion: v1
kind: PersistentVolume
metadata:
  name: zot-writable-storage-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    # no-backup: registry blobs are large, ephemeral, and always reproducible
    # by re-pulling/rebuilding - same tier as loki's cache.
    path: /mnt/thedatapool/no-backup/app-data/zot-writable
    type: DirectoryOrCreate
  claimRef:
    name: zot-writable-storage-pvc
    namespace: zot-oci-registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-writable-storage-pvc
  namespace: zot-oci-registry
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 20Gi
  volumeName: zot-writable-storage-pv
