# Only the app and the worker may reach Postgres. Without this the db Service
# answers anyone in the cluster who has the password
# (activescott/home-infra-k8s-flux#178).
#
# Nothing else connects over the network. inference-service is the third pod in
# the namespace and holds no database credential on purpose (see the comment in
# inference-service-deployment.yaml); the worker does hold one, through
# `envFrom: app-creds`. There is no db-backup CronJob here and no Postgres
# exporter, the db's own probes are `exec pg_isready`, and the fernfiles_app and
# fernfiles_worker Prometheus jobs scrape 3300 and 3401 rather than the db.
# `kubectl exec db-0 -- psql` runs inside the pod, so this does not affect it
# either. Anything added later that talks to 5432, a backup job included, needs
# a rule here, or it times out with nothing logged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-app-worker
  namespace: fernfiles-prod
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: app
        - podSelector:
            matchLabels:
              app: worker
      ports:
        - port: 5432
          protocol: TCP
