resources:
  - namespace.yaml
  - db-pv.yaml
  - app-pv.yaml
  - ../../base/fernfiles/
  - app-ingress-certificate.yaml
  # /ops/* (kubelet probes, Prometheus metrics) denied at the ingress; those
  # clients reach the app through the Service instead.
  - app-ops-middleware.yaml
  - app-ops-ingress.yaml
  - image-scanning/
  - ../shared/ghcr-pull-secret/
patches:
  - path: patch-app-deployment.yaml
    target:
      kind: Deployment
      name: app
  # Both ghcr.io/activescott/fernfiles packages are private, so every
  # Deployment pulling one needs the pull secret. Prod-only: dev and e2e run
  # images loaded straight into kind.
  - path: patch-worker-deployment.yaml
    target:
      kind: Deployment
      name: worker
  - path: patch-app-ingress.yaml
    target:
      kind: Ingress
      name: app-ingress
  - path: patch-db-statefulset.yaml
    target:
      kind: StatefulSet
      name: db
  - path: patch-app-data-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: app-data
namespace: fernfiles-prod
secretGenerator:
  # db
  - name: db-creds
    envs:
      - .env.secret.db.encrypted
  # app
  - name: app-creds
    envs:
      - .env.secret.app.encrypted
# the images tag: https://kubectl.docs.kubernetes.io/references/kustomize/builtins/#_imagetagtransformer_
images:
  - name: fernfiles-image-app
    newName: ghcr.io/activescott/fernfiles/app # {"$imagepolicy": "fernfiles-prod:policy-fernfiles-app:name"}
    newTag: v0.51.0 # {"$imagepolicy": "fernfiles-prod:policy-fernfiles-app:tag"}
  # Transcode worker (activescott/fernfiles issue #140), built and tagged from
  # the same release as the app image, so the two tags move together. v0.41.0
  # is the release that introduced it — no earlier tag of this image exists.
  - name: fernfiles-image-worker
    newName: ghcr.io/activescott/fernfiles/worker # {"$imagepolicy": "fernfiles-prod:policy-fernfiles-worker:name"}
    newTag: v0.50.2 # {"$imagepolicy": "fernfiles-prod:policy-fernfiles-worker:tag"}
