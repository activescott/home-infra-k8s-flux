resources:
  - namespace.yaml
  - db-pv.yaml
  - app-pv.yaml
  - ../../base/fernfiles/
  - app-ingress-certificate.yaml
  - image-scanning/
  - ../shared/ghcr-pull-secret/
patches:
  - path: patch-app-deployment.yaml
    target:
      kind: Deployment
      name: app
  - path: patch-app-ingress.yaml
    target:
      kind: Ingress
      name: app-ingress
  - path: patch-db-statefulset.yaml
    target:
      kind: StatefulSet
      name: db
  - path: patch-app-data-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: app-data
namespace: fernfiles-prod
secretGenerator:
  # db
  - name: db-creds
    envs:
      - .env.secret.db.encrypted
  # app
  - name: app-creds
    envs:
      - .env.secret.app.encrypted
# the images tag: https://kubectl.docs.kubernetes.io/references/kustomize/builtins/#_imagetagtransformer_
images:
  - name: fernfiles-image-app
    newName: ghcr.io/activescott/fernfiles/app # {"$imagepolicy": "fernfiles-prod:policy-fernfiles-app:name"}
    newTag: v0.38.1 # {"$imagepolicy": "fernfiles-prod:policy-fernfiles-app:tag"}
  # Transcode worker (activescott/fernfiles issue #140), built and tagged from
  # the same release as the app image, so the two tags move together. The
  # starting tag below is a placeholder that image automation replaces on its
  # first scan; the worker image does not exist for any release before the one
  # that introduces it, and until it does this Deployment will not pull.
  - name: fernfiles-image-worker
    newName: ghcr.io/activescott/fernfiles/worker # {"$imagepolicy": "fernfiles-prod:policy-fernfiles-worker:name"}
    newTag: v0.38.1 # {"$imagepolicy": "fernfiles-prod:policy-fernfiles-worker:tag"}
