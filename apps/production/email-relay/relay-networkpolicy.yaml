# Only the app namespaces may reach the relay. SASL already stops an unauthorised client
# from relaying, and sender_login_maps stops an authorised one from using another app's
# domain; this removes the ability to reach the port at all, so a credential leak still
# needs a foothold in one of these namespaces to be useful.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-allow-apps
  namespace: email-relay
spec:
  podSelector:
    matchLabels:
      app: relay
  policyTypes:
    - Ingress
  ingress:
    - from:
        # kubernetes.io/metadata.name is set automatically on every namespace, so these
        # match without the namespaces carrying any label of ours.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: fernfiles-prod
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ramblefeed-prod
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tinkerbell-prod
      ports:
        - port: 587
          protocol: TCP
