resources:
  - namespace.yaml
  - db-pv.yaml
  - token-keys-pv.yaml
  - ../../base/dreamwright/
  - certificate.yaml
  - www-redirect-middleware.yaml
  - www-redirect-ingress.yaml
  - db-networkpolicy.yaml
  - ../../../infrastructure/prod/configs/ghcr-pull-secret/
patches:
  - path: patch-ingress.yaml
  - path: patch-deployment.yaml
  - path: patch-db-statefulset.yaml
    target:
      kind: StatefulSet
      name: db
  - path: patch-token-keys-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: token-keys
namespace: dreamwright-prod
secretGenerator:
  # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
  - name: db-creds
    envs:
      - .env.secret.db.encrypted
  # DATABASE_URL (with the password from db-creds), JWT_SECRET and SMTP_PASS
  - name: app-creds
    envs:
      - .env.secret.app.encrypted
# the images tag: https://kubectl.docs.kubernetes.io/references/kustomize/builtins/#_imagetagtransformer_
images:
  - name: dreamwright-image
    newName: ghcr.io/ping-poet/dreamwright/app # {"$imagepolicy": "flux-system:policy-dreamwright:name"}
    newTag: v202610050454 # {"$imagepolicy": "flux-system:policy-dreamwright:tag"}
