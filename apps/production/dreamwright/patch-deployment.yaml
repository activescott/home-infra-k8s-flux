apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreamwright
spec:
  template:
    spec:
      containers:
        - name: dreamwright
          env:
            - name: APP_URL
              value: https://dreamwright.app
            - name: ADMIN_EMAILS
              value: scott@willeke.com
            # email-relay's sender map gives this exact address to dreamwright@relay.local.
            # dreamwright.app itself is declared as sending no mail
            # (infrastructure/prod/dns/zones/dreamwright.app.yaml).
            - name: FROM_EMAIL
              value: dreamwright-noreply@pingpoet.com
            - name: SMTP_HOST
              value: relay.email-relay.svc
            - name: SMTP_PORT
              value: "587"
            # SMTP_PASS is in app-creds and must match this login's entry in email-relay's
            # SMTPD_SASL_USERS.
            - name: SMTP_USER
              value: dreamwright@relay.local
