apiVersion: v1
kind: PersistentVolume
metadata:
  name: dreamwright-prod-token-keys-pv
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    # sudo mkdir -p /mnt/thedatapool/app-data/dreamwright/prod/token-keys
    # sudo chown 1000:1000 /mnt/thedatapool/app-data/dreamwright/prod/token-keys
    # sudo chmod 700 /mnt/thedatapool/app-data/dreamwright/prod/token-keys
    # The app image runs as node (1000), and the kubelet does not chown hostPath volumes.
    path: /mnt/thedatapool/app-data/dreamwright/prod/token-keys
