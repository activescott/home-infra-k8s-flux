apiVersion: v1
kind: PersistentVolume
metadata:
  name: dreamwright-prod-db-pv-data
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    # sudo mkdir -p /mnt/thedatapool/app-data/dreamwright/prod/db-data
    # sudo chown 999:999 /mnt/thedatapool/app-data/dreamwright/prod/db-data
    # sudo chmod 700 /mnt/thedatapool/app-data/dreamwright/prod/db-data
    # The postgres image runs as 999, and the kubelet does not chown hostPath volumes.
    path: /mnt/thedatapool/app-data/dreamwright/prod/db-data
