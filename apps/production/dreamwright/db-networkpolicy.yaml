# Only the app pod may reach Postgres, which covers both the app and its migrate init
# container. The db's own probes are `exec pg_isready` and there is no db-backup CronJob
# here, so anything added later that talks to 5432 needs a rule here or it times out with
# nothing logged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-app
  namespace: dreamwright-prod
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: dreamwright
      ports:
        - port: 5432
          protocol: TCP
