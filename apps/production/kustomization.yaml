apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./transmission
  # `./tayle` removed from the cluster 2026-08-26. Its Let's Encrypt certificate
  # expired 2026-08-25 and cert-manager could not renew it: tayle.co's DNS is not
  # under our control, so the HTTP-01 challenge resolves to someone else's server
  # and had been retrying for 31 days. That failing Certificate was one of the two
  # things keeping the `apps` Kustomization unhealthy.
  # Manifests are intentionally left in ./tayle so the app can be restored by
  # re-adding this line. All three PVs are Retain, so hostPath data survives at
  # /mnt/thedatapool/app-data/tayle/prod/{db-data,db-backups,rabbitmq-data}
  # (also covered by the B2 backup's /app-data/** include).
  - ./home-assistant
  - ./photoprism
  - ./monitoring
  - ./plex
  - ./scott-willeke-com
  - ./gpupoet
  - ./gpu-poet-collector
  - ./coinpoet-redirect
  - ./activescott-redirect
  - ./ramblefeed
  - ./oksana-willeke-redirect
  - ./tinkerbell
  # `./wordpress-micah-mmm` (legacy Bitnami stack) decommissioned 2026-05-31
  # — see docs/specs/wordpress-micah-mmm-migrate-off-bitnami/summary.md.
  # Its manifests (and ../base/wordpress) were deleted 2026-09-03; recover
  # them from git history if ever needed. PVs were Retain policy so hostPath
  # data at /mnt/thedatapool/app-data/wordpress-micah-mmm/ remains on disk as
  # the final rollback artifact.
  - ./wordpress-micah-mmm-v2
  - ./arize-phoenix
  - ./github-runners
  - ./cvat
  - ./zot
  - ./fernfiles
  # Postfix null client relaying to Cloudflare Email Sending. Apps reach it at
  # relay.email-relay.svc.cluster.local:587 -- see its README for the access
  # model and why the queue is not persistent.
  - ./email-relay
  # Stalwart, holding a second copy of scott@willeke.com. Unrelated to
  # email-relay above: that is the outbound application path, this is the
  # inbound personal one, kept separate so a mistake in one cannot reach the
  # other. Google Workspace stays the authoritative MX and keeps its own copy,
  # so this server is additive and never load-bearing for account recovery.
  #
  # Deploying it does not make mail arrive. Nothing reaches it until the Google
  # Workspace routing rule exists, which is a manual admin-console step. Until
  # then the mailbox is empty, which is deliberately the window in which to fix
  # the offsite backup: the B2 cloud sync task reads live files and cannot
  # safely copy a database. See the private repo's scott-todo.md.
  #
  # hostPath volumes at /mnt/thedatapool/app-data/stalwart/prod/{config,data}
  # (covered by the B2 backup's /app-data/** include) must exist and be owned by
  # 2000:2000 before the pod starts, or Stalwart silently re-bootstraps and
  # looks exactly like data loss. Created 2026-08-28.
  - ./email-stalwart
