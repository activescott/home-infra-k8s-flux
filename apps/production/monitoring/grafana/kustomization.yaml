  # Grafana-managed alerting, picked up by the alerts sidecar (sidecar.alerts in
  # helmrelease.yaml), which watches ConfigMaps labelled `grafana_alert=1`. A new rule file
  # under alerting/rules/ has to be listed here too. See alerting/README.md.
  - name: grafana-alerting-notifications
    namespace: monitoring
    files:
      - alerting/notifications.yaml
    options:
      labels:
        grafana_alert: "1"
      disableNameSuffixHash: true
  - name: grafana-alerting-rules
    namespace: monitoring
    files:
      - alerting/rules/auth-origin-probe.yaml
      - alerting/rules/cloudflare-proxied-sites.yaml
      - alerting/rules/cluster-pod-health.yaml
      - alerting/rules/cluster-wide.yaml
      - alerting/rules/crossplane-cloudflare-api.yaml
      - alerting/rules/debeth.yaml
      - alerting/rules/edge-firewall.yaml
      - alerting/rules/email-relay.yaml
      - alerting/rules/email-stalwart.yaml
      - alerting/rules/fernfiles.yaml
      - alerting/rules/flux-reconcile-log-health.yaml
      - alerting/rules/flux-system.yaml
      - alerting/rules/gpu-poet-collector.yaml
      - alerting/rules/gpupoet.yaml
      - alerting/rules/job-accelerator-db-access.yaml
      - alerting/rules/job-accelerator.yaml
      - alerting/rules/nas.yaml
      - alerting/rules/openrouter.yaml
      - alerting/rules/tayle.yaml
      - alerting/rules/tinkerbell-chat.yaml
      - alerting/rules/tinkerbell-llm-providers.yaml
      - alerting/rules/tinkerbell-log-health.yaml
      - alerting/rules/tinkerbell-proxy.yaml
      - alerting/rules/tinkerbell-scrape-health.yaml
      - alerting/rules/wordpress-security.yaml
    options:
      labels:
        grafana_alert: "1"
      disableNameSuffixHash: true
