resources:
  - ./certificate.yaml
  - ./grafana-ingress.yaml
  - ./grafana-pv.yaml
  - ./helmrelease.yaml
  - ./datasource-auth-middleware.yaml

secretGenerator:
  # Grafana's datasource credential, in two Secrets; see datasource-auth-middleware.yaml.
  - name: grafana-datasource-auth
    namespace: monitoring
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.grafana-datasource-auth.public-key-encrypted.encrypted
  - name: grafana-datasource-password
    namespace: monitoring
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.grafana-datasource-password.public-key-encrypted.encrypted
  # The Dreamwright alerts channel's Slack webhook (alerting/notifications.yaml).
  - name: grafana-alerts-slack
    namespace: monitoring
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.grafana-alerts-slack.encrypted

# Dashboards checked in here are picked up by the Grafana sidecar (enabled in
# helmrelease.yaml under sidecar.dashboards). The sidecar watches ConfigMaps
# with label `grafana_dashboard=1` and provisions any JSON keys as dashboards.
configMapGenerator:
  - name: grafana-dashboard-gpupoet-com
    namespace: monitoring
    files:
      - dashboards/gpupoet-com.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
