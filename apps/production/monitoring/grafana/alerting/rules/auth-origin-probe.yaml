# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `auth-origin-probe` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  - orgId: 1
    name: auth-origin-probe
    folder: nas1
    interval: 1m
    rules:
      - uid: authorigingateprobefailing
        title: AuthOriginGateProbeFailing
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'probe_success{job="blackbox_auth_origin"} == 0'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 10m
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.instance }} ({{ $labels.module }}) is failing the @activescott/auth
            origin-gate probe.
          description: >-
            The blackbox_auth_origin probe for module {{ $labels.module }} against {{
            $labels.instance }} has failed for 10 minutes. Check
            `probe_http_status_code{instance="{{ $labels.instance }}", module="{{ $labels.module
            }}"}`: for a module without the `_cross_origin` suffix, 400 means the origin gate
            refused a same-origin https POST (activescott/fernfiles#365 -- check the target's server
            sets express `trust proxy`, or the react-router-serve equivalent, behind Traefik's TLS
            termination); for a `_cross_origin` module, 200 means the gate let an actual
            cross-origin POST through -- the gate itself has regressed, not a proxy-header bug; 0 on
            either means the probe couldn't complete the request at all (DNS, TCP or TLS). Reproduce
            with `curl -X POST {{ $labels.instance }} -H "Origin: <the host's own https origin, or a
            foreign one for a _cross_origin module>"`.
          repo: activescott/home-infra-k8s-flux
