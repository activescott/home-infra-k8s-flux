# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `tinkerbell-llm-providers` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  - orgId: 1
    name: tinkerbell-llm-providers
    folder: nas1
    interval: 1m
    rules:
      - uid: llmproviderpaymentrequired
        title: LLMProviderPaymentRequired
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: |
                (tinkerbell_llm_provider_last_payment_error_timestamp_seconds > 0)
                unless
                (
                  tinkerbell_llm_provider_last_success_timestamp_seconds
                  > tinkerbell_llm_provider_last_payment_error_timestamp_seconds
                )
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 1m
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: 'LLM provider {{ $labels.provider }} is failing with a payment error — top up the account.'
          description: 'Provider {{ $labels.provider }} last returned a payment-bucketed error at timestamp {{
            $values.query.Value }} and has not had a successful call since. Chat is silently failing
            for users. Top up at console.anthropic.com (or the relevant provider) and send a test
            message to clear the alert.'
      - uid: llmproviderratelimited
        title: LLMProviderRateLimited
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'rate(tinkerbell_llm_provider_errors_total{error_type="rate_limit"}[10m]) > 0.05'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 10m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'LLM provider {{ $labels.provider }} is rate-limiting requests.'
          description: 'Sustained 429s from {{ $labels.provider }} — chat experience is degraded. Consider
            lowering request volume or upgrading the plan.'
      - uid: llmprovidererrorspike
        title: LLMProviderErrorSpike
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'rate(tinkerbell_llm_provider_errors_total{error_type!~"payment|rate_limit"}[10m]) > 0.1'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 10m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'LLM provider {{ $labels.provider }} error rate elevated ({{ $labels.error_type }}).'
          description: 'Errors for {{ $labels.provider }} bucket={{ $labels.error_type }} status={{
            $labels.status_code }} above threshold. Investigate provider status page and recent
            deploys.'
