# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Added for #537, flagged in review on #539: once Prometheus/Alertmanager no longer evaluate
# or notify anything, Grafana is both the evaluator and the notifier for every rule in this
# folder, so a dead Grafana can't say it's dead. Grafana's own startup also needs
# grafana.com reachable (the comment above the Grafana egress NetworkPolicy), so an outage
# there during a pod restart takes alerting down the same way.
#
# This rule is built to always fire, the same way every other rule here does (`is_number
# ($query) || ...` against a query that is never empty), so firing says nothing except "the
# evaluator ran". ../notifications.yaml routes it, alone, to an external check-in service
# instead of Slack, on a short repeat_interval -- that service pages when the pings stop,
# which is the only path left that doesn't depend on Grafana to notice Grafana is down.

apiVersion: 1
groups:
  - orgId: 1
    name: watchdog
    folder: nas1
    interval: 1m
    rules:
      - uid: watchdog
        title: Watchdog
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'vector(1)'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0s
        missing_series_evals_to_resolve: 1
        labels:
          severity: info
        annotations:
          summary: Dead man's switch for Grafana alerting -- this should always be firing
          description: >-
            Not a real incident. This rule always fires while Grafana is evaluating rules and
            can reach Prometheus. If it has stopped firing, Grafana itself has stopped
            evaluating (crashed, crashlooping, or stuck on a grafana.com fetch during
            startup), or lost Prometheus -- in which case every other rule in this folder is
            also silently not evaluating. See ../README.md ("The Watchdog") for the external
            check-in service this pings and what should page when the pings stop.
