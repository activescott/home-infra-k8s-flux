# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `edge-firewall` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  - orgId: 1
    name: edge-firewall
    folder: nas1
    interval: 1m
    rules:
      - uid: wanlinkflapping
        title: WanLinkFlapping
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                sum(increase(loki_process_custom_wan_link_down_total[10m])) > 0 or
                (sum(loki_process_custom_wan_link_down_total) > 0 and
                absent(loki_process_custom_wan_link_down_total offset 15m))
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'WAN link (igb0) dropped carrier on the edge firewall.'
          description: 'One or more igb0 carrier drops in the last 10 minutes; each is a ~5-9s internet
            outage. Pull exact times in Grafana Explore with {host="theshield"} |= "igb0: link state
            changed".'
      - uid: wanlinkflappingburst
        title: WanLinkFlappingBurst
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'sum(increase(loki_process_custom_wan_link_down_total[1h])) > 3'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0m
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: 'WAN link (igb0) flapping in bursts on the edge firewall.'
          description: 'More than 3 igb0 carrier drops in the last hour, matching the dense-burst signature
            seen during the ongoing ISP investigation. Capture the timestamps for the ticket.'
      # Gateway-monitor (dpinger) alarm transitions. Since 2026-08-11
      # an inline switch holds igb0's carrier up, so upstream WAN
      # outages no longer produce link-state lines and the two rules
      # above stay silent — these two are their replacement signal.
      # Thresholds on the firewall: loss 5%/8%, latency 200/500ms.
      - uid: wangatewaydegraded
        title: WanGatewayDegraded
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'sum(increase(loki_process_custom_wan_gateway_alarm_total[10m])) > 0'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'WAN gateway monitor alarmed (loss/latency/down) on the edge firewall.'
          description: >-
            One or more gateway-monitor alarm transitions in the last 10 minutes — upstream packet
            loss or outage even though igb0 carrier held. Known cause so far: fired 2026-09-24
            during Ziply Fiber's planned maintenance -- the upstream gateway alarmed none -> loss ->
            down and was unreachable for 12m29s, then alarmed back through down -> loss -> none as
            it recovered. The blackbox site probes and the Cloudflare API budget alerts fired from
            the same outage in the same window. It fired again 2026-09-25 on a single 40s loss alarm
            with no down transition, outside the announced maintenance window -- compare against
            home-infra-private docs/specs/wan-link-flapping-ziply/ before assuming it's the same
            known cause. See activescott/home-infra-k8s-flux#239.
          query: '{host="theshield"} |= "MONITOR:"'
          runbook_url: https://github.com/activescott/home-infra-k8s-flux/blob/main/apps/production/monitoring/runbooks/WanGatewayDegraded.md#wangatewaydegraded
          repo: activescott/home-infra-k8s-flux
      - uid: wangatewaydegradedburst
        title: WanGatewayDegradedBurst
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'sum(increase(loki_process_custom_wan_gateway_alarm_total[1h])) > 3'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0m
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: 'WAN gateway monitor alarming repeatedly on the edge firewall.'
          description: >-
            More than 3 gateway-monitor alarm transitions in the last hour, matching the dense-burst
            outage signature from the ongoing ISP investigation. Same counter and triage path as
            WanGatewayDegraded (activescott/home-infra-k8s-flux#239) at a higher bar: pull
            theshield's MONITOR: lines for the firing window and check whether the transitions
            cluster inside an announced Ziply maintenance window or match a pattern already recorded
            in home-infra-private docs/specs/wan-link-flapping-ziply/. Capture the timestamps for
            the ticket either way.
          query: '{host="theshield"} |= "MONITOR:"'
          runbook_url: https://github.com/activescott/home-infra-k8s-flux/blob/main/apps/production/monitoring/runbooks/WanGatewayDegraded.md#wangatewaydegradedburst
          repo: activescott/home-infra-k8s-flux
      # Meta-alert: if the firewall stops shipping syslog, the two
      # alerts above go silent instead of firing. The firewall logs
      # continuously, so a 15m gap means the feed is broken (Alloy
      # listener, alloy-syslog Service, or the firewall's syslog
      # destination), not that the network went quiet. The absent()
      # arm covers the series vanishing entirely, which a bare == 0
      # would miss.
      - uid: firewallsyslogfeeddown
        title: FirewallSyslogFeedDown
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'sum(increase(loki_process_custom_firewall_syslog_lines_total[15m])) == 0 or
                absent(loki_process_custom_firewall_syslog_lines_total)'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 15m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'No syslog received from the edge firewall for 15 minutes.'
          description: 'The edge firewall log feed has stopped, so WAN flap alerting is blind until restored.
            Check the alloy-syslog Service, the Alloy pod, and the firewall''s Logging / Targets
            settings.'
