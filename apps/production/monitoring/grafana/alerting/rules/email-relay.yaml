# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `email-relay` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  - orgId: 1
    name: email-relay
    folder: nas1
    interval: 1m
    rules:
      # Any permanent failure at all. These are sign-in codes and share
      # invites, so a single lost message is a user who cannot get into
      # their account — worth paging on rather than thresholding.
      - uid: emailrelaybounced
        title: EmailRelayBounced
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'increase(loki_process_custom_email_relay_bounced_total[15m]) > 0'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0m
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: 'email-relay could not deliver a message.'
          description: 'Postfix reported status=bounced — the message is gone and will not be retried. Check
            Loki in Grafana Explore: {namespace="email-relay"} |= "status=bounced". Auth chain and
            debugging notes: apps/production/email-relay/README.md.'
      # Deferrals in ones and twos are normal; postfix retries and usually
      # succeeds. Sustained deferral means Cloudflare is refusing us, which
      # is the documented risk of Email Sending being a beta with an
      # undocumented, auto-scaling daily quota.
      - uid: emailrelaydeferred
        title: EmailRelayDeferred
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'increase(loki_process_custom_email_relay_deferred_total[1h]) > 5'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 15m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'email-relay is repeatedly deferring mail.'
          description: 'More than 5 deferrals in an hour. Postfix is still retrying, but sustained deferral
            usually means Cloudflare is rejecting us — check the sending quota and the API token.
            Loki: {namespace="email-relay"} |= "status=deferred".'
      # An app whose SASL password no longer matches the relay's copy
      # produces no delivery lines at all, so the counters above stay flat
      # and look like a quiet day. This is what makes that case visible.
      #
      # Fires on any failure: traffic is low enough that a broken relay
      # otherwise goes unnoticed for days (#516). The counter is born at its
      # first matching line and increase() cannot see a series' first sample,
      # so the `unless ... offset 5m` arm catches the birth.
      #
      # Counts LOG LINES, not attempts: postfix walks CRAM-MD5, PLAIN and
      # LOGIN, so one rejected login emits three. send-test-email.sh (without
      # --send-only) deliberately fails one auth per run and so fires this.
      - uid: emailrelayauthfailures
        title: EmailRelayAuthFailures
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                increase(loki_process_custom_email_relay_auth_failed_total[5m]) > 0 or
                loki_process_custom_email_relay_auth_failed_total unless
                loki_process_custom_email_relay_auth_failed_total offset 5m
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0s
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'Failed authentication against email-relay.'
          description: 'Postfix rejected an SMTP login. Most likely an app password no longer matches
            SMTPD_SASL_USERS in the relay secret; also worth checking whether anything is reaching
            the port that should not be. Loki: {namespace="email-relay"} |= "authentication
            failed".'
