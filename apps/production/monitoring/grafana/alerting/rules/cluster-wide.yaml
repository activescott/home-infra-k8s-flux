# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `cluster-wide` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  - orgId: 1
    name: cluster-wide
    folder: nas1
    interval: 1m
    rules:
      - uid: podcrashloopbackoff
        title: PodCrashLoopBackOff
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",
                namespace!="fernfiles-prod"} > 0'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 1m
        keepFiringFor: 10m
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} in CrashLoopBackOff"
          description: >-
            Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} is in
            CrashLoopBackOff. Query Loki for the crash reason -- {namespace="{{ $labels.namespace
            }}", pod="{{ $labels.pod }}"} -- it keeps the previous container's stdout after
            Kubernetes has recycled the container, which `kubectl logs --previous` may no longer
            have by the time anyone looks.
