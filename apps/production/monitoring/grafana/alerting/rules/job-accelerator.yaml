# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `job-accelerator` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  - orgId: 1
    name: job-accelerator
    folder: nas1
    interval: 1m
    rules:
      - uid: jobacceleratoremailsendfailed
        title: JobAcceleratorEmailSendFailed
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'sum by (kind)
                (increase(job_accelerator_emails_sent_total{job="job_accelerator_worker",outcome="failure"}[1h]))
                > 0'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0s
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: "Job Accelerator failed to send a {{ $labels.kind }} email"
          description: >-
            {{ $values.query.Value | printf "%.0f" }} {{ $labels.kind }} notification send
            attempt(s) failed in the last hour. Check `kubectl -n job-accelerator-prod logs
            deploy/worker` for the notifications.send error.
          repo: activescott/job-accelerator
