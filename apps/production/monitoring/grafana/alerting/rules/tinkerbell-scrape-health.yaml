# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `tinkerbell-scrape-health` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  - orgId: 1
    name: tinkerbell-scrape-health
    folder: nas1
    interval: 1m
    rules:
      - uid: tinkerbellappmetricsdown
        title: TinkerbellAppMetricsDown
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'up{job="tinkerbell_app"} < 1'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 10m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'Cannot scrape /metrics from tinkerbell app pod.'
          description: 'Prometheus has been unable to scrape
            app.tinkerbell-prod.svc.cluster.local:3100/metrics for 10 minutes. Without this, LLM and
            proxy alerts will not fire. Check pod health and the /metrics route.'
