# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `flux-reconcile-log-health` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  # activescott/home-infra-k8s-flux#276: the flux-system group above
  # cannot actually see a Kustomization go unhealthy. Confirmed live
  # against Prometheus on 2026-09-30: gotk_reconcile_condition does not
  # exist (list_prometheus_metric_names for `gotk.*` returns only
  # _duration_seconds and the http/token-cache series, no condition
  # gauge), so FluxKustomizationNotReady, FluxKustomizationNotReadyCritical
  # and FluxHelmReleaseNotReady above have had nothing to evaluate for
  # as long as this Flux version (helm-controller v2.9.5) has been
  # deployed. That silence is how the dreamwright-prod crash loop on
  # 2026-09-29 went unnoticed, and how the apps Kustomization has
  # stayed not-Ready ever since without anyone being told.
  #
  # kustomize-controller has no replacement condition metric either,
  # and controller_runtime_reconcile_errors_total does not count a
  # health-check failure as a reconcile error (confirmed flat at 0 for
  # controller="kustomization" through the entire incident window), so
  # FluxReconcileErrors would not have caught this either. What it DOES
  # do is log an error on every failed reconcile attempt, repeating at
  # the Kustomization's retry interval for as long as it stays
  # unhealthy -- confirmed live in Loki, once every ~10m since
  # 2026-09-29 for the apps Kustomization. That log line is what the
  # flux_apps_kustomization_reconcile_failed_total /
  # flux_infra_configs_kustomization_reconcile_failed_total counters in
  # alloy/helmrelease.yaml's loki.process pipeline turn into a metric.
  #
  # Scoped to apps and infra-configs specifically (issue #276's ask)
  # rather than every Kustomization: doing that generically would need
  # the Kustomization name promoted out of the log line into a label so
  # one counter could carry many series, which is a bigger change than
  # this issue asks for. The proper fix -- kube-state-metrics custom
  # resource state against kustomize.toolkit.fluxcd.io, which is what
  # upstream now recommends in gotk_reconcile_condition's place -- is
  # left as a follow-up; it would also replace the three dead rules
  # above.
  - orgId: 1
    name: flux-reconcile-log-health
    folder: nas1
    interval: 1m
    rules:
      - uid: fluxappskustomizationnotready
        title: FluxAppsKustomizationNotReady
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'increase(loki_process_custom_flux_apps_kustomization_reconcile_failed_total[15m]) > 0'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 5m
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: "Flux apps Kustomization failing to reconcile"
          description: >-
            kustomize-controller has logged a reconciliation failure for the apps Kustomization
            within the last 15 minutes and keeps retrying without succeeding. Check what's failing
            in Loki -- {namespace="flux-system", app="kustomize-controller"} |= "Reconciliation
            failed" |= "\"name\":\"apps\"" -- or run `flux --context nas get kustomization apps` for
            the live status message. Downstream workloads under apps/ stop receiving updates until
            this clears.
      - uid: fluxinfraconfigskustomizationnotready
        title: FluxInfraConfigsKustomizationNotReady
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'increase(loki_process_custom_flux_infra_configs_kustomization_reconcile_failed_total[15m]) >
                0'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 5m
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: "Flux infra-configs Kustomization failing to reconcile"
          description: >-
            kustomize-controller has logged a reconciliation failure for the infra-configs
            Kustomization within the last 15 minutes and keeps retrying without succeeding. Check
            what's failing in Loki -- {namespace="flux-system", app="kustomize-controller"} |=
            "Reconciliation failed" |= "\"name\":\"infra-configs\"" -- or run `flux --context nas
            get kustomization infra-configs` for the live status message. Issue #32 previously
            wedged this Kustomization on a stuck ImagePolicy.
