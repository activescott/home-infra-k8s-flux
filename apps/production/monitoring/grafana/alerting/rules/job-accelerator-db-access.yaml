# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `job-accelerator-db-access` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  # Olya's read-only olya_ro role on job-accelerator's Postgres
  # (activescott/home-infra-k8s-flux#535). Scott asked to hear about every
  # login. The counter is minted in alloy/helmrelease.yaml from Postgres's
  # "connection authorized: user=olya_ro" line, which needs log_connections
  # (apps/production/job-accelerator/patch-db-statefulset.yaml).
  #
  # The counter is born at 1 on the first login after an Alloy restart, which
  # increase() cannot see, hence the `unless ... offset 5m` arm (same as
  # wordpress-security). A session of several logins stays one firing alert
  # until 5m after the last: one firing message and one resolved message on
  # each of Slack and Telegram.
  - orgId: 1
    name: job-accelerator-db-access
    folder: nas1
    interval: 1m
    rules:
      - uid: olyarojobacceleratordbconnection
        title: OlyaRoJobAcceleratorDbConnection
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                sum(increase(loki_process_custom_job_accelerator_db_olya_ro_connections_total[5m]))
                > 0 or sum(loki_process_custom_job_accelerator_db_olya_ro_connections_total unless
                loki_process_custom_job_accelerator_db_olya_ro_connections_total offset 5m) > 0
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0s
        missing_series_evals_to_resolve: 1
        labels:
          severity: info
        annotations:
          summary: 'FYI: Olya logged in to job-accelerator prod Postgres as olya_ro (read-only).'
          description: >-
            Expected when Olya is troubleshooting job-accelerator. olya_ro can read every table and
            write none. The login lines, with the client application name, are in Loki.
          query: '{namespace="job-accelerator-prod", app="db"} |= "connection authorized: user=olya_ro "'
          repo: activescott/home-infra-k8s-flux
      # Meta-alert: OlyaRoJobAcceleratorDbConnection is a counter that sits
      # flat for days, so on its own a broken feed looks exactly like "no
      # logins". The db's pg_isready probes log a connection line every 5s,
      # counted in alloy/helmrelease.yaml before they are dropped, so 15m of
      # silence means the path is broken: log_connections lost from the db's
      # args, the Alloy stage no longer matching, the Alloy pod down, or the db
      # itself down. The absent() arm covers the series vanishing entirely.
      # Loud on purpose: while this fires, Olya's logins go unreported.
      - uid: jobacceleratordbconnectionlogfeeddown
        title: JobAcceleratorDbConnectionLogFeedDown
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'sum(increase(loki_process_custom_job_accelerator_db_connection_lines_total[15m])) == 0 or
                absent(loki_process_custom_job_accelerator_db_connection_lines_total)'
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 15m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'No connection log lines from job-accelerator prod Postgres for 15 minutes; olya_ro logins
            are not being reported.'
          description: >-
            The db's pg_isready probes log a "connection authorized" line every 5s, so silence means
            the feed is broken, not that the db is idle. Check, in order: the db pod is running, its
            args still carry log_connections=authorization
            (apps/production/job-accelerator/patch-db-statefulset.yaml), the Alloy pod on the db's
            node is up, and the job-accelerator stages in alloy/helmrelease.yaml still match.
            OlyaRoJobAcceleratorDbConnection is blind until this clears.
          query: '{namespace="job-accelerator-prod", app="db"} |= "connection authorized: "'
          repo: activescott/home-infra-k8s-flux
