# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `wordpress-security` in apps/production/monitoring/prometheus/helmrelease.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  # WordPress (apps/base/wordpress-upstream). The counters are minted from the wordpress
  # container's log in alloy/helmrelease.yaml, which has the matched lines. All three
  # should read zero forever, so each fires on one event and `for` is omitted.
  #
  # Each counter is born at 1 on its first matching line, and increase() cannot see a
  # series' first sample, so the `unless ... offset 5m` arm catches the birth. Without it
  # the first event after an Alloy restart would never alert. sum by (namespace) for the
  # reason in the tinkerbell-log-health group.
  #
  # Only requests that reached WordPress count. With the tenant's ingress in place, an
  # internet client asking for the REST API, wp-login.php or wp-admin gets a 403 from
  # Traefik and appears only in Traefik's access log:
  #   {namespace="kube-system", container="traefik"} | json | RequestHost="mmm.willeke.com"
  - orgId: 1
    name: wordpress-security
    folder: nas1
    interval: 1m
    rules:
      - uid: wordpressrestbatchsucceeded
        title: WordPressRestBatchSucceeded
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                sum by (namespace)
                (increase(loki_process_custom_wordpress_rest_batch_2xx_total[5m])) > 0 or sum by
                (namespace) (loki_process_custom_wordpress_rest_batch_2xx_total unless
                loki_process_custom_wordpress_rest_batch_2xx_total offset 5m) > 0
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0s
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: 'WordPress in {{ $labels.namespace }} answered a REST batch request with 2xx.'
          description: >-
            A request to rest_route=/batch/v1 or /wp-json/batch/v1 reached WordPress and got a 2xx.
            The ingress allows this endpoint from the LAN only; internet attempts get a 403 from
            Traefik and show only in Traefik's access log, never here. If the client address in this
            log line is not a LAN address, check the ingress middlewares and wp_users for accounts
            nobody created.
          query: '{app="wordpress", container="wordpress"} |~
            "(?i)(rest_route=(/|%2f)batch(/|%2f)v1|/wp-json/+batch/v1)"'
          repo: activescott/home-infra-k8s-flux
      - uid: wordpressuserloginwarning
        title: WordPressUserLoginWarning
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                sum by (namespace)
                (increase(loki_process_custom_wordpress_user_login_warning_total[5m])) > 0 or sum by
                (namespace) (loki_process_custom_wordpress_user_login_warning_total unless
                loki_process_custom_wordpress_user_login_warning_total offset 5m) > 0
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0s
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: 'WordPress in {{ $labels.namespace }} logged Undefined array key "user_login".'
          description: >-
            PHP warned from wp-includes/user.php that a user was written without a user_login field.
            Check wp_users for new or changed accounts and the access log for the request at the
            same second.
          query: '{app="wordpress", container="wordpress"} |= "user_login"'
          repo: activescott/home-infra-k8s-flux
      - uid: wordpressuploadsphprequest
        title: WordPressUploadsPhpRequest
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: >-
                sum by (namespace)
                (increase(loki_process_custom_wordpress_uploads_php_request_total[5m])) > 0 or sum
                by (namespace) (loki_process_custom_wordpress_uploads_php_request_total unless
                loki_process_custom_wordpress_uploads_php_request_total offset 5m) > 0
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 0s
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: 'Request for a .ph* path under wp-content/uploads in {{ $labels.namespace }}.'
          description: >-
            A request for a PHP-looking file in the uploads directory reached WordPress's Apache.
            Apache refuses to run or serve those, so on its own this is an attempt. A 200 means the
            file exists on the volume and something uploaded it; look at it and at the requests
            before it.
          query: '{app="wordpress", container="wordpress"} |~ "(?i)/wp-content/uploads/[^ ?]*([.]|%2e)ph"'
          repo: activescott/home-infra-k8s-flux
