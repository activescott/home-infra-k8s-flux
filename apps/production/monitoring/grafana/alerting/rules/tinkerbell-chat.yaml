# Grafana-managed alert rules, provisioned by the alerts sidecar (see ../README.md).
# Migrated from the Prometheus rule group `tinkerbell-chat` in apps/base/tinkerbell/grafana-alerts.yaml (#537).
# Grafana expands environment variables in rule labels (a literal `$` there has to be
# written `$$`), but not in annotations or the query models under `data`, so a `$` in
# those stays single. Checked against Grafana 13.2.

apiVersion: 1
groups:
  - orgId: 1
    name: tinkerbell-chat
    folder: nas1
    interval: 1m
    rules:
      - uid: llmproviderhigherrorrate
        title: LLMProviderHighErrorRate
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: rate(llm_requests_total{status="error"}[5m]) / rate(llm_requests_total[5m]) > 0.1
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 10m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: "LLM provider error rate exceeds 10%"
      - uid: workflowstepfailurerate
        title: WorkflowStepFailureRate
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: rate(workflow_steps_total{status="failed"}[15m]) / rate(workflow_steps_total[15m]) > 0.2
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 15m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: "Workflow step failure rate exceeds 20%"
      - uid: dailyspendinglimitbreach
        title: DailySpendingLimitBreach
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: daily_spending_usd > daily_spending_limit_usd
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 1m
        missing_series_evals_to_resolve: 1
        labels:
          severity: critical
        annotations:
          summary: "User has exceeded daily spending limit"
      - uid: backgroundjobunhealthy
        title: BackgroundJobUnhealthy
        condition: firing
        data:
          - refId: query
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: time() - last_summary_job_run_timestamp > 600
              instant: true
              range: false
          - refId: firing
            datasourceUid: __expr__
            model: { type: math, expression: is_number($query) || is_nan($query) || is_inf($query) }
        noDataState: OK
        execErrState: Error
        for: 10m
        missing_series_evals_to_resolve: 1
        labels:
          severity: warning
        annotations:
          summary: "Summary background job has not run in over 10 minutes"
