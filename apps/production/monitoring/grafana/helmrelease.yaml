apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana
      version: "13.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      interval: 24h
  values:
    replicas: 1

    persistence:
      enabled: true
      existingClaim: grafana-storage-pvc

    securityContext:
      runAsUser: 4020
      runAsGroup: 4020
      fsGroup: 4020

    # Disable the init container that chowns /var/lib/grafana — the hostPath
    # is already owned by 4020:4020 and the init container lacks permission.
    initChownData:
      enabled: false

    # Grafana's Drilldown apps (Logs/Metrics/Traces/Profiles) are not baked
    # into the image: the preinstaller downloads them into
    # GF_PATHS_PLUGINS=/var/lib/grafana/plugins, which is the PVC, so they
    # outlive image upgrades. Preinstalled plugins auto-update on startup
    # "except for new major versions" (documented under [plugins] preinstall
    # in setup-grafana/configure-grafana; the guard is
    # pluginchecker.CanUpdateVersion() with onlyMinor=true, and the skip is
    # logged at debug level only, so nothing shows in the pod log). So
    # after the chart went 11.6.1 -> 13.0.0 (Grafana 13.2.0), the PVC still
    # held the v1 plugins downloaded under Grafana 11, whose frontend bundles
    # do not load in Grafana 13 (they declare react-router v5 as a shared
    # module). Symptom: "App not found" on /a/grafana-lokiexplore-app/explore
    # while /api/plugins/<id>/settings reports the plugin enabled.
    #
    # `plugin_id@version` is the documented pinning syntax, and an explicit
    # version also bypasses the major guard: the preinstaller installs the
    # requested version whenever it differs from what is on disk. These entries
    # merge into Grafana's built-in preinstall list (they do not replace it).
    # A pinned plugin never auto-updates. Once these 2.x versions are on the
    # PVC the pins may be dropped, which restores auto-update within the 2.x
    # major; the pins have to come back for the next major. Latest compatible
    # version for an id:
    #   curl -H "grafana-version: <grafana-ver>" -H "grafana-os: linux" \
    #     -H "grafana-arch: amd64" \
    #     https://grafana.com/api/plugins/<plugin-id>/versions | jq -r .items[0].version
    grafana.ini:
      plugins:
        preinstall: "grafana-lokiexplore-app@2.5.2,grafana-metricsdrilldown-app@2.5.1,grafana-exploretraces-app@2.2.0,grafana-pyroscope-app@2.3.0"
        # These two datasource plugins ship inside the image, under
        # /usr/share/grafana/data/plugins-bundled, and are also in Grafana's
        # default preinstall list. Whenever the catalog holds a newer version
        # than the image bundles (12.8.0 -> 12.8.1 and 13.0.2 -> 13.1.0 as of
        # Grafana 13.2.0), every pod start logs an error the cluster can do
        # nothing about:
        #   Failed to install plugin ... error="unlinkat
        #   /usr/share/grafana/data/plugins-bundled/<id>: read-only file system"
        # Neither datasource is used here — only Prometheus and Loki are
        # provisioned — so drop them from the preinstall list. Disabling also
        # stops them loading and hides them from the plugin catalog; delete an
        # entry here to get one back. If a different bundled datasource starts
        # logging the same error after a Grafana upgrade, add it to this list.
        disable_plugins: "elasticsearch,mysql"

    # Provision both Prometheus and Loki datasources
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://prometheus-server.monitoring.svc:80
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki.monitoring.svc:3100
            access: proxy

    resources:
      requests:
        cpu: "250m"
        memory: "750Mi"
      limits:
        cpu: "1"
        memory: "2Gi"

    # Sidecar that watches ConfigMaps in the same namespace with the label
    # `grafana_dashboard=1` and writes their JSON contents into Grafana's
    # provisioned-dashboard directory. Used to ship our own dashboards as code:
    # see ./dashboards/ + configMapGenerator in kustomization.yaml.
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /tmp/dashboards
        # Default location for sidecar-loaded dashboards is the root
        # ("General" folder in Grafana — no folder shown). A ConfigMap
        # can opt INTO a named folder by adding
        # `metadata.annotations.grafana_folder: <folder>`. Until we have
        # 3+ dashboards that share a theme, leave the annotation off and
        # let them sit at the root.
        folderAnnotation: grafana_folder
        provider:
          name: sidecarProvider
          orgid: 1
          folder: ""
          type: file
          disableDelete: false
          allowUiUpdates: true
          foldersFromFilesStructure: true

    # Provision standard Kubernetes monitoring dashboards from grafana.com.
    # These two sections (dashboardProviders + dashboards) work together:
    # - dashboardProviders defines WHERE on disk Grafana looks for dashboard JSON files
    # - dashboards defines WHAT to download (by grafana.com ID) into that location
    # The Helm chart creates a ConfigMap + init container that downloads each gnetId
    # at deploy time. Removing these sections removes the provisioned dashboards on
    # next redeploy (dashboards only persist if saved to Grafana's own database).
    # Docs: https://github.com/grafana-community/helm-charts/blob/main/charts/grafana/values.yaml
    #        https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    # Each gnetId is a dashboard ID from https://grafana.com/grafana/dashboards/
    # Browse/search for dashboards at that URL and use the ID from the dashboard page.
    dashboards:
      default:
        # https://grafana.com/grafana/dashboards/15757
        k8s-global:
          gnetId: 15757
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
        # https://grafana.com/grafana/dashboards/15758
        k8s-namespaces:
          gnetId: 15758
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
        # https://grafana.com/grafana/dashboards/15759
        k8s-nodes:
          gnetId: 15759
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
        # https://grafana.com/grafana/dashboards/15760
        k8s-pods:
          gnetId: 15760
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
        # https://grafana.com/grafana/dashboards/1860
        node-exporter-full:
          gnetId: 1860
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

    # Ingress managed separately via raw K8s Ingress + cert-manager Certificate
    ingress:
      enabled: false

    # Pod annotations for Prometheus scraping
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3000"

    # The Helm chart creates a service named "grafana" on port 80 by default
    service:
      enabled: true
      type: ClusterIP
      port: 80
      targetPort: 3000
