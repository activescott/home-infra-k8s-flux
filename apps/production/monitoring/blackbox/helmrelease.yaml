apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 24h
  values:
    # Keeps the Service name at blackbox-exporter.monitoring.svc — the
    # Prometheus scrape job in prometheus/helmrelease.yaml addresses it.
    fullnameOverride: blackbox-exporter

    config:
      modules:
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        # Probes a public https URL end to end: DNS, TCP, TLS handshake and
        # certificate, then the HTTP status. Runs from inside the cluster, so
        # it does NOT prove the site is reachable from the internet — but it
        # does go through the real ingress, so it catches the failures that
        # kube-state-metrics cannot see: an ingress misroute, a 502 with pods
        # that look healthy, and an expiring certificate.
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_status_codes: [200]
            method: GET
            preferred_ip_protocol: ip4
            fail_if_not_ssl: true
        # Opens a TLS connection to Stalwart's implicit-TLS mail ports (465
        # submission, 993 IMAP) and reports the certificate it is actually
        # served, through probe_ssl_earliest_cert_expiry.
        #
        # This is NOT redundant with cert-manager's own
        # certmanager_certificate_expiration_timestamp_seconds. That metric
        # describes the Certificate object: it goes green the moment cert-manager
        # writes a renewed Secret, and says nothing about what the server is
        # presenting. Stalwart does not notice a rotated certificate file — see
        # email-stalwart/stalwart-tls-reload.yaml — so the failure that actually
        # happens here is "cert-manager renewed it, Stalwart is still serving the
        # old one". The cert-manager metric cannot see that; only a completed
        # handshake can. Both are alerted on separately for exactly that reason.
        #
        # server_name is pinned rather than derived from the target because the
        # targets are in-cluster Service DNS names. Probing the public hostname
        # instead would depend on the firewall hairpinning a connection from the
        # LAN back to its own WAN address — a second thing that can break, which
        # would then report as a certificate problem when it is not one. Pinning
        # the SNI keeps this a clean "what does the mail server serve" check.
        # Whether the ports answer from the internet is a different question and
        # deliberately not what this probe claims to answer.
        mail_implicit_tls:
          prober: tcp
          timeout: 10s
          tcp:
            preferred_ip_protocol: ip4
            tls: true
            tls_config:
              server_name: mail.activescott.com

        # Blackbox probe of the @activescott/auth origin gate (post-incident
        # review on activescott/fernfiles#365, activescott/home-infra-k8s-flux#290).
        # `@activescott/auth-adapter-react-router` 3.0.0 added an Origin check
        # that compares scheme, and a server that forwards plain HTTP behind
        # Traefik's TLS termination without express `trust proxy` (or the
        # react-router-serve equivalent) makes a real same-origin https POST
        # look cross-origin and refuse it with 400. e2e never catches this: it
        # runs over plain http, where the schemes already match.
        #
        # Every module below POSTs the same body to the same route,
        # /auth/passkey/authenticate-options. That action only issues a
        # challenge cookie, so the probe writes nothing. Most modules send an
        # Origin header equal to the host's own https origin, to catch the
        # scheme-mismatch bug above; the gate runs before provider dispatch,
        # so the result still distinguishes a refusal from a pass on a host
        # with no passkey provider configured: a refusal is always 400; a
        # pass is 200 where passkey is configured, 404 where it is not (the
        # route itself doesn't exist, but only after the gate already let the
        # request through).
        #
        # The `_cross_origin` modules instead send a genuinely foreign Origin
        # (ping-poet/dreamwright#320) to cover the case the scheme-mismatch
        # bug above is not about: an actual cross-site POST. Measured against
        # dreamwright.app, that refusal is 403, not the scheme-mismatch bug's
        # 400 -- a different failure with a different status -- so these
        # modules set valid_status_codes: [403] and fail (probe_success 0) if
        # the gate ever answers with anything else, in particular 200, which
        # would mean a cross-origin request got through.
        auth_origin_fernfiles:
          prober: http
          timeout: 10s
          http:
            method: POST
            headers:
              Origin: https://fernfiles.com
              Content-Type: application/json
            body: "{}"
            valid_status_codes: [200]
            preferred_ip_protocol: ip4
            fail_if_not_ssl: true
        # ramblefeed.com is expected to answer 200 once activescott/ramblefeed#114
        # deploys with a passkey provider configured; today it is 400, the same
        # bug, so this probe starts red until that fix ships.
        auth_origin_ramblefeed:
          prober: http
          timeout: 10s
          http:
            method: POST
            headers:
              Origin: https://ramblefeed.com
              Content-Type: application/json
            body: "{}"
            valid_status_codes: [200]
            preferred_ip_protocol: ip4
            fail_if_not_ssl: true
        # Passkey provider configured (activescott/tinkerbell#272), so a passing
        # gate returns 200 with authentication options.
        auth_origin_tinkerbell:
          prober: http
          timeout: 10s
          http:
            method: POST
            headers:
              Origin: https://tinkerbellbot.com
              Content-Type: application/json
            body: "{}"
            valid_status_codes: [200]
            preferred_ip_protocol: ip4
            fail_if_not_ssl: true
        auth_origin_job_accelerator:
          prober: http
          timeout: 10s
          http:
            method: POST
            headers:
              Origin: https://job-accelerator.pingpoet.com
              Content-Type: application/json
            body: "{}"
            valid_status_codes: [200]
            preferred_ip_protocol: ip4
            fail_if_not_ssl: true
        # Passkey provider configured (ping-poet/dreamwright#484), so a passing
        # gate returns 200 with authentication options.
        auth_origin_dreamwright:
          prober: http
          timeout: 10s
          http:
            method: POST
            headers:
              Origin: https://dreamwright.app
              Content-Type: application/json
            body: "{}"
            valid_status_codes: [200]
            preferred_ip_protocol: ip4
            fail_if_not_ssl: true
        # Cross-origin control for auth_origin_dreamwright
        # (ping-poet/dreamwright#320): same route, but an Origin the gate
        # must refuse. Passes (probe_success 1) only on 403, the refusal
        # observed against this host; a 200 here would mean the origin gate
        # stopped covering cross-origin requests.
        auth_origin_dreamwright_cross_origin:
          prober: http
          timeout: 10s
          http:
            method: POST
            headers:
              Origin: https://evil.example
              Content-Type: application/json
            body: "{}"
            valid_status_codes: [403]
            preferred_ip_protocol: ip4
            fail_if_not_ssl: true

    # The ICMP prober sends raw packets, which requires NET_RAW.
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        add: ["NET_RAW"]

    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
