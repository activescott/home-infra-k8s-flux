# The Dreamwright agents host pushes its logs here (ping-poet/dreamwright#122). The only other
# route on this host is loki-read-ingress.yaml, Grafana's GET-only query path.
#
# Middleware order is the annotation's order, as in
# ../prometheus/prometheus-remote-write-ingress.yaml: the allowlist first, so a request from
# anywhere else gets a 403 before anything else runs. Then the in-flight cap, then basic auth,
# and only then the body limit, so nothing unauthenticated gets buffered.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-push-ingress
  annotations:
    # <middleware-namespace>-<middleware-name>@kubernetescrd. Nothing validates the string, and
    # a reference to a middleware that does not exist drops the whole router. The push then
    # gets a 404, since loki-read-ingress.yaml admits GET only, but run the post-merge checks in
    # ../README.md ("Loki push") after any change to this line anyway.
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-loki-push-allowlist@kubernetescrd,monitoring-loki-push-inflight@kubernetescrd,monitoring-loki-push-auth@kubernetescrd,monitoring-loki-push-body-limit@kubernetescrd
spec:
  tls:
    - hosts:
        - loki.activescott.com
      # must match certificate.yaml's secretName
      secretName: loki-activescott-com-tls
  rules:
    - host: loki.activescott.com
      http:
        paths:
          - path: /loki/api/v1/push
            pathType: Exact
            backend:
              service:
                name: loki
                port:
                  number: 3100
