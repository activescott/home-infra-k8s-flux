# Gates the Loki push path (loki-push-ingress.yaml) to its senders. Same shape and reasoning as
# ../prometheus/remote-write-middleware.yaml: loki.activescott.com resolves to the WAN address,
# so a credential alone is not enough. Never add .1 or .20 here, for the reason given in that
# file.
#
# There is no sender: the Dreamwright agents host was the only one, and stopped pushing in
# ping-poet/dreamwright#976. Traefik refuses an empty sourceRange and drops the whole router, so
# the list holds 192.0.2.1, a documentation address no request comes from, and every push gets a
# 403. Replace it with the next sender's address.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-push-allowlist
  namespace: monitoring
spec:
  # see https://doc.traefik.io/traefik/middlewares/http/ipallowlist/
  ipAllowList:
    sourceRange:
      - 192.0.2.1/32 # no sender; RFC 5737 TEST-NET-1, never a real source
---
# Loki runs with auth_enabled: false, so this is the only credential on the path. One htpasswd
# line per sender, written by scripts/add-ingest-user.mts.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-push-auth
  namespace: monitoring
spec:
  # see https://doc.traefik.io/traefik/middlewares/http/basicauth/
  basicAuth:
    secret: loki-push-auth
    removeHeader: true
---
# Loki's own limits are per stream and per tenant, not per connection, so cap concurrent pushes
# here. Excess requests get a 429, which Alloy and Promtail retry.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-push-inflight
  namespace: monitoring
spec:
  # see https://doc.traefik.io/traefik/middlewares/http/inflightreq/
  inFlightReq:
    amount: 4
---
# Alloy's loki.write batches 1 MiB by default, so 4 MiB leaves room; larger bodies get a 413.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-push-body-limit
  namespace: monitoring
spec:
  # see https://doc.traefik.io/traefik/middlewares/http/buffering/
  buffering:
    maxRequestBodyBytes: 4194304 # 4 MiB
