# Reference:
# - https://cert-manager.io/docs/concepts/certificate/
# - https://cert-manager.io/docs/usage/certificate/
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loki-activescott-com
spec:
  # must match loki-push-ingress.yaml's secretName
  secretName: loki-activescott-com-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: loki.activescott.com
  dnsNames:
  - loki.activescott.com
