apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 24h
  values:
    alloy:
      mounts:
        extra:
          - name: plex-logs
            mountPath: /mnt/plex-logs
            readOnly: true

      # Syslog listener for the edge firewall.
      # Reached from the LAN via the separate `alloy-syslog` LoadBalancer
      # Service (syslog-service.yaml). The chart's own Service stays ClusterIP
      # so Alloy's UI on 12345 is not published to the network.
      extraPorts:
        - name: syslog
          port: 1514
          targetPort: 1514
          protocol: TCP

      # Alloy log collection pipeline:
      #
      # 1. discovery.kubernetes - Queries the K8s API to find all running pods.
      #
      # 2. discovery.relabel - Maps verbose internal K8s metadata labels to clean,
      #    short names (e.g. __meta_kubernetes_namespace -> namespace). These become
      #    the label dimensions searchable in Loki/Grafana, enabling queries like
      #    {namespace="gpupoet-prod", app="app"}.
      #    A synthetic "service_name" label is also created by joining
      #    namespace + app (e.g. "tinkerbell-prod/app") for use in Grafana's
      #    service dropdown where bare "app" would be ambiguous.
      #
      # 3. loki.source.kubernetes - Tails container logs from the discovered pods
      #    (via the K8s API, similar to `kubectl logs -f`) and attaches the
      #    relabeled metadata to each log line.
      #
      # 4. loki.process - Processes log lines before sending to Loki:
      #    - Joins multi-line stack traces into single entries
      #    - Drops health check request noise
      #    - Parses pino JSON to extract level and msg
      #    - Falls back msg to the full log line for non-JSON entries
      #    - Maps numeric pino levels to string names (info, warn, error, etc.)
      #    - Promotes level to a Loki label for efficient filtering
      #    - Stores msg as structured metadata for Grafana visibility
      #    - Preserves raw JSON body so all fields are queryable via | json
      #
      # 5. loki.write - Pushes labeled log lines to Loki's HTTP API.
      #
      # ---------------------------------------------------------------------
      # RESTART THE DAEMONSET AFTER CHANGING ANY metric.counter BELOW
      #
      #   kubectl --context nas -n monitoring rollout restart daemonset alloy
      #
      # Editing this file is not enough, and the failure is far worse than the
      # change simply not applying.
      #
      # There is a config-reloader sidecar, so a ConfigMap change IS hot-reloaded
      # into the long-running process. But a reload re-registers the loki.process
      # counters without unregistering the old ones, and the Prometheus client
      # library then refuses to serve the whole endpoint:
      #
      #   collected metric "loki_process_custom_email_relay_sent_total" {...}
      #   was collected before with the same name and label values
      #
      # /metrics returns that error instead of metrics, so the scrape fails and
      # EVERY Alloy-derived series disappears at once -- not just the ones being
      # edited. Observed 2026-08-29 while adding the stalwart counters: the
      # email-relay, WAN-flapping and tinkerbell log-health alerts all went blind
      # together, and the only visible symptom was alerts quietly not firing.
      # A restart clears it.
      #
      # This is why every alert reading these counters pairs its threshold with an
      # `or absent(...)` arm -- see FirewallSyslogFeedDown and StalwartLogFeedDown
      # in prometheus/helmrelease.yaml. A bare `== 0` cannot fire on a series that
      # does not exist, which is exactly the state this bug produces.
      # ---------------------------------------------------------------------
      configMap:
        content: |
          // Stage 1: Discover all pods via the Kubernetes API
          discovery.kubernetes "pods" {
            role = "pod"
          }

          // Stage 2: Relabel raw K8s metadata into clean Loki labels
          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "__host__"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "app"
            }
            // Build a "service_name" label from namespace/app so that
            // Grafana's service dropdown shows e.g. "tinkerbell-prod/app"
            // instead of a single ambiguous "app" entry.
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app"]
              separator     = "/"
              target_label  = "service_name"
            }
          }

          // Stage 3: Tail container logs from discovered pods
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.process.default.receiver]
          }

          // Stage 4: Process log lines (parse JSON, drop noise, extract fields)
          loki.process "default" {
            // Join multi-line stack traces into single log entries.
            // Lines starting with { (JSON) or non-whitespace begin a new entry;
            // indented continuation lines (e.g. "    at Module._compile(...)") are
            // appended to the preceding entry.
            stage.multiline {
              firstline     = "^(\\{|\\S)"
              max_wait_time = "3s"
              max_lines     = 128
            }

            // Drop health check request logs to reduce noise.
            // Covers tinkerbell (/health/*) and gpupoet (/api/health/*).
            stage.drop {
              expression = ".*GET /(api/)?health/(readiness|liveness).*"
            }

            // Extract level and msg from JSON for label promotion and
            // structured metadata. Two field-name conventions in the wild:
            //   - pino (Node) and many others: "level" + "msg"
            //   - controller-runtime / GCP-style: "severity" + "message"
            //     (e.g. ARC controller in arc-systems)
            // JMESPath `||` coalesces to the first non-empty value.
            // Non-JSON lines pass through since stage.json silently skips them.
            stage.json {
              expressions = {
                level = "level || severity",
                msg   = "msg || message",
              }
            }

            // Fallback for logfmt-style lines (e.g. ARC autoscaling
            // listener: `time=... level=INFO source=... msg=Compare ...`).
            // stage.logfmt silently no-ops on non-logfmt lines, and lines
            // already parsed by stage.json are skipped too (this stage
            // only overwrites when a logfmt key is present).
            stage.logfmt {
              mapping = {
                level = "",
                msg   = "",
              }
            }

            // Fallback for GitHub Actions runner's bracketed log format
            // (arc-runners "runner" container, e.g.
            // `[RUNNER 2026-05-22 05:53:07Z INFO Listener] Runner execution finished`).
            // stage.regex silently no-ops on non-matching lines, so this
            // does not disturb json/logfmt-parsed lines above.
            stage.regex {
              expression = "^\\[RUNNER \\S+ \\S+Z (?P<level>\\w+) [^\\]]+\\] "
            }

            // Levels arrive in many cases ("INFO", "DEBUG", "info"). Lowercase
            // so downstream Loki `level` labels stay consistent with the
            // pino path (info/warn/error).
            stage.template {
              source   = "level"
              template = "{{ "{{" }} .Value | lower {{ "}}" }}"
            }

            // For non-JSON lines, msg is empty after stage.json. Fall back
            // to the full log line so msg is always populated.
            stage.template {
              source   = "msg"
              template = "{{ "{{" }} if .Value {{ "}}" }}{{ "{{" }} .Value {{ "}}" }}{{ "{{" }} else {{ "}}" }}{{ "{{" }} .Entry {{ "}}" }}{{ "{{" }} end {{ "}}" }}"
            }

            // Pino outputs numeric levels (10=trace, 20=debug, 30=info, etc.)
            // but Loki's detected_level expects string values ("info", "error").
            // Without this mapping, levels show as raw numbers in Grafana and
            // level-based filtering/color-coding doesn't work.
            // Uses stage.template with Helm-escaped curly braces (same
            // technique as the Plex section).
            stage.template {
              source   = "level"
              template = "{{ "{{" }} if eq .Value \"10\" {{ "}}" }}trace{{ "{{" }} else if eq .Value \"20\" {{ "}}" }}debug{{ "{{" }} else if eq .Value \"30\" {{ "}}" }}info{{ "{{" }} else if eq .Value \"40\" {{ "}}" }}warn{{ "{{" }} else if eq .Value \"50\" {{ "}}" }}error{{ "{{" }} else if eq .Value \"60\" {{ "}}" }}fatal{{ "{{" }} else {{ "}}" }}{{ "{{" }} .Value {{ "}}" }}{{ "{{" }} end {{ "}}" }}"
            }

            // Promote level to a Loki label for efficient stream selectors
            // like {level="error"}. Low cardinality (6 values).
            stage.labels {
              values = {
                level = "",
              }
            }

            // Store msg as structured metadata so it's visible in Grafana
            // without needing | json. For JSON lines this is the pino msg
            // field; for non-JSON lines it's the full log line.
            stage.structured_metadata {
              values = {
                msg = "",
              }
            }

            // The raw JSON log body is preserved (no stage.output), so all
            // pino fields (module, noteId, url, err, etc.) remain queryable
            // with | json in LogQL.

            // General log-volume backstop for tinkerbell: counts ANY
            // warn/fatal-or-error log line, not just failure modes someone
            // has specifically instrumented with a Prometheus counter (see
            // prometheus/helmrelease.yaml's tinkerbell-log-health group).
            // Split into two separate metric.counter blocks (warn vs
            // error/fatal) so they back two independently-alertable series
            // (TinkerbellAppWarnVolumeElevated vs
            // TinkerbellAppErrorVolumeElevated) — a single combined counter
            // made the "Error" alert fire on routine warn-level noise
            // (anti-bot retries, empty provider results), indistinguishable
            // from real errors. Despite each stage.match being scoped to one
            // selector, metric.counter under match_all still inherits the
            // ambient stream labels present at this point in the pipeline
            // (namespace, level, pod, node, ...) — confirmed empirically via
            // `ALERTS{alertname=...}` showing per-pod/per-level series, not
            // a single flat counter as originally assumed. A cluster-wide
            // version would still need one pair of counters per namespace.
            stage.match {
              selector = "{namespace=\"tinkerbell-prod\", level=\"warn\"}"

              stage.metrics {
                metric.counter {
                  name        = "tinkerbell_app_warn_log_lines_total"
                  description = "warn-level log lines from the tinkerbell app"
                  match_all   = true
                  action      = "inc"

                  // Default is 5m; baseline is low-volume, so the default
                  // would delete the series between occurrences and leave
                  // increase() with nothing to measure most of the time.
                  max_idle_duration = "24h"
                }
              }
            }

            stage.match {
              selector = "{namespace=\"tinkerbell-prod\", level=~\"error|fatal\"}"

              stage.metrics {
                metric.counter {
                  name        = "tinkerbell_app_error_log_lines_total"
                  description = "error/fatal log lines from the tinkerbell app"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "24h"
                }
              }
            }

            // email-relay: outbound mail delivery outcomes. Postfix is the only
            // evidence that mail is or is not leaving — it exports no metrics, and
            // the applications cannot tell either, since the relay accepts a message
            // and delivers it afterwards. Without these counters, a total outage of
            // outbound mail (sign-in codes included) is silent.
            //
            // Postfix logs plain text, not the JSON the stages above parse, so these
            // select on the literal `status=` token rather than a `level` label. A
            // delivery line looks like:
            //   to=<x@y>, relay=smtp.mx.cloudflare.net[...]:465, dsn=2.0.0, status=sent (250 ...)
            //
            // Separate counters, not one "problem" counter: `deferred` is transient and
            // usually self-resolving, `bounced` is terminal. Merging them means paging
            // for things that fix themselves — the mistake the tinkerbell warn/error
            // split above documents.
            stage.match {
              selector = "{namespace=\"email-relay\"} |= \"status=sent\""

              stage.metrics {
                metric.counter {
                  name        = "email_relay_sent_total"
                  description = "messages the relay handed to Cloudflare successfully"
                  match_all   = true
                  action      = "inc"
                  // As with the tinkerbell counters: the 5m default deletes an idle
                  // series, and these are idle for days at a time by design.
                  max_idle_duration = "24h"
                }
              }
            }

            stage.match {
              selector = "{namespace=\"email-relay\"} |= \"status=bounced\""

              stage.metrics {
                metric.counter {
                  name        = "email_relay_bounced_total"
                  description = "messages the relay could not deliver, permanently"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "24h"
                }
              }
            }

            stage.match {
              selector = "{namespace=\"email-relay\"} |= \"status=deferred\""

              stage.metrics {
                metric.counter {
                  name        = "email_relay_deferred_total"
                  description = "messages queued for retry after a temporary failure"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "24h"
                }
              }
            }

            // Inbound SASL failures. Catches an app whose password no longer matches
            // the relay's copy: it produces no delivery lines at all, so the counters
            // above stay flat — indistinguishable from a quiet day at this volume.
            // Note this counts log LINES, not attempts: postfix walks CRAM-MD5, PLAIN
            // and LOGIN, so a single rejected login increments it three times. The
            // alert's threshold accounts for that, and for send-test-email.sh
            // deliberately failing one auth per run.
            stage.match {
              selector = "{namespace=\"email-relay\"} |= \"SASL\" |= \"authentication failed\""

              stage.metrics {
                metric.counter {
                  name        = "email_relay_auth_failed_total"
                  description = "failed SMTP authentications against the relay"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "24h"
                }
              }
            }

            // email-stalwart: the mailboxes for willeke.com. Stalwart DOES have its
            // own Prometheus exporter, and prometheus/helmrelease.yaml scrapes it --
            // so why derive counters from logs as well?
            //
            // Because the exporter is a setting inside Stalwart's own datastore, not a
            // file in this repo. It is enabled by hand in the admin UI, it is lost if
            // the datastore is ever restored from an older backup, and nothing in git
            // would show that it had turned itself off. These counters come from the
            // container's stdout, which cannot be switched off from inside the
            // application, so the "is mail still flowing" question survives the
            // exporter being unavailable for any reason.
            //
            // Deliberately narrow: this is not a reimplementation of the exporter.
            // Only the handful of events that answer "is mail arriving, is it leaving,
            // and is the server locking people out" are counted here. Everything
            // richer -- queue depth, per-protocol connections, delivery latency
            // histograms -- comes from the exporter and appears only on the dashboard.
            //
            // Event names are Stalwart's own event ids, taken from the parenthesised
            // tag it prints on every line, e.g.
            //   INFO Queued message for delivery (queue.message-queued) listenerId = "smtp", ...
            // Each was confirmed against live log lines rather than inferred from the
            // documentation, which does not list them.
            //
            // As with the email-relay counters above, each of these ends up as several
            // series (the counter inherits each line's labels), so every alert that
            // reads them wraps the expression in sum().

            // Inbound mail accepted on :25. This is the one signal that says the
            // dual-delivery path from Google still works end to end: firewall NAT,
            // the LoadBalancer, and Stalwart accepting the message.
            //
            // queue.message-queued is specific to mail arriving from outside.
            // Submissions from a mail client on :465 log queue.authenticated-message-queued
            // and DMARC/TLS reports log queue.report-queued, so neither inflates this.
            stage.match {
              selector = "{namespace=\"email-stalwart\"} |= \"(queue.message-queued)\""

              stage.metrics {
                metric.counter {
                  name        = "stalwart_inbound_queued_total"
                  description = "messages accepted from the internet on port 25"
                  match_all   = true
                  action      = "inc"
                  // Inbound volume is roughly one message a day at present, so the
                  // 5m default would delete this series constantly and every
                  // increase() would start again from a fresh zero.
                  max_idle_duration = "168h"
                }
              }
            }

            // Outbound mail successfully handed to the Google Workspace SMTP relay.
            stage.match {
              selector = "{namespace=\"email-stalwart\"} |= \"(delivery.delivered)\""

              stage.metrics {
                metric.counter {
                  name        = "stalwart_outbound_delivered_total"
                  description = "messages Stalwart delivered to a remote server"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "168h"
                }
              }
            }

            // Delivery failures, permanent and transient together.
            //
            // One counter rather than the sent/deferred/bounced split used for
            // email-relay, and for a reason: Stalwart spreads failure across a dozen
            // event ids (TLS, greeting, MX lookup, rejection, DSN) where postfix has a
            // single status= token. Enumerating them individually would mean a counter
            // per id and an alert per counter, and the operator response to all of them
            // is the same -- read the log lines. The regex covers the ids that mean
            // "this message did not go out".
            stage.match {
              selector = "{namespace=\"email-stalwart\"} |~ \"delivery\\\\.(connect-error|dsn-perm-fail|dsn-temp-fail|message-rejected|rcpt-to-rejected|mail-from-rejected|greeting-failed|ehlo-rejected|start-tls-error|implicit-tls-error|mx-lookup-failed|null-mx|auth-failed)\""

              stage.metrics {
                metric.counter {
                  name        = "stalwart_delivery_failed_total"
                  description = "outbound delivery attempts that failed, permanently or transiently"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "168h"
                }
              }
            }

            // Failed logins against IMAP, submission and the admin UI. Worth watching
            // for its own sake -- 993 and 465 are internet-facing -- and because
            // Stalwart's auth-ban counts these, so a burst here precedes an address
            // being banned.
            stage.match {
              selector = "{namespace=\"email-stalwart\"} |= \"(auth.failed)\""

              stage.metrics {
                metric.counter {
                  name        = "stalwart_auth_failed_total"
                  description = "failed authentications against Stalwart"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "168h"
                }
              }
            }

            // Connections dropped because the source address is banned. Almost always
            // a scanner on the public admin hostname, which is working as intended and
            // is why the ban exists.
            //
            // It is here because of what happened on 2026-08-28: Stalwart banned the
            // Traefik pod's address, and since it drops banned addresses at TCP accept
            // -- before any request is parsed -- the admin UI and CalDAV returned 502
            // for everyone with no HTTP log line to explain it. Bans do not expire
            // (every *BanPeriod is unset by default), so that state was permanent
            // until someone noticed. The alert on this counter looks specifically for
            // an in-cluster address being blocked, which is the shape of that failure
            // rather than of ordinary scanner traffic.
            stage.match {
              selector = "{namespace=\"email-stalwart\"} |= \"(security.ip-blocked)\""

              stage.metrics {
                metric.counter {
                  name        = "stalwart_ip_blocked_total"
                  description = "connections dropped because the source address is banned"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "168h"
                }
              }
            }

            // The same event, narrowed to in-cluster source addresses. This is the
            // counter the alert reads; the broad one above is for the dashboard.
            //
            // The distinction matters because the two cases mean opposite things. A
            // banned address from the internet is the ban working correctly and
            // happens constantly on a public admin hostname -- alerting on it would be
            // pure noise. A banned address inside 172.16/16 is Stalwart having banned
            // the ingress controller, which takes out the admin UI and CalDAV for
            // everyone and does not resolve on its own, because no *BanPeriod is set
            // and bans therefore never expire.
            //
            // Matching the CIDR as a string prefix rather than parsing the address
            // into a label is deliberate: a remoteIp label would be unbounded
            // cardinality driven by whoever is scanning today.
            stage.match {
              selector = "{namespace=\"email-stalwart\"} |= \"(security.ip-blocked)\" |= \"remoteIp = 172.16.\""

              stage.metrics {
                metric.counter {
                  name        = "stalwart_ip_blocked_cluster_total"
                  description = "in-cluster addresses Stalwart is refusing, e.g. the ingress controller"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "168h"
                }
              }
            }

            // Inbound messages Stalwart temp-rejected against one of its
            // MtaInboundThrottle limits.
            //
            // This is here because of 2026-09-03: Stalwart's *default* "Sender
            // address to recipient throttle" is 25 messages per hour keyed on
            // (senderDomain, rcpt), and GitHub notification bursts to
            // scott@willeke.com blew past it 68 times in 24 hours. Every one was a
            // 451 to Google, which retried into the same limit. Nothing here
            // noticed: the routing rule has "Suppress bounces from this recipient"
            // checked, so the sender sees nothing, and Gmail has the message
            // regardless -- only the archive copy is at risk, and only silently.
            // The detector was a Google Workspace "Smart host failure" alert email.
            //
            // The limit was raised to 1000/hour in stalwart-config/plan.ndjson, so
            // the expected value of this counter is zero. It exists to catch the
            // next throttle nobody chose.
            //
            // Matching on "MtaInboundThrottle" rather than the bare event id is
            // deliberate: Stalwart logs the event TWICE per rejection, once naming
            // the throttle and its limit and once naming the recipient, so the bare
            // id double-counts.
            stage.match {
              selector = "{namespace=\"email-stalwart\"} |= \"(smtp.rate-limit-exceeded)\" |= \"MtaInboundThrottle\""

              stage.metrics {
                metric.counter {
                  name        = "stalwart_rate_limit_exceeded_total"
                  description = "inbound messages rejected against an MtaInboundThrottle limit"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "168h"
                }
              }
            }

            // Liveness heartbeat for this pipeline, not for Stalwart.
            //
            // Every counter above is silent on a quiet day, and mail here IS quiet --
            // so "no inbound mail in 36 hours" cannot on its own distinguish a broken
            // mail path from a broken log path. Stalwart reschedules its internal
            // calculateMetrics task every 5 minutes regardless of traffic, which makes
            // task-scheduled the only line guaranteed to appear on an idle server. If
            // this counter goes flat, every other Stalwart alert here is blind and
            // should not be read as "all quiet".
            stage.match {
              selector = "{namespace=\"email-stalwart\"} |= \"(task-manager.task-scheduled)\""

              stage.metrics {
                metric.counter {
                  name        = "stalwart_heartbeat_total"
                  description = "Stalwart internal task scheduling lines, ~12/hour on an idle server"
                  match_all   = true
                  action      = "inc"
                  max_idle_duration = "168h"
                }
              }
            }

            forward_to = [loki.write.default.receiver]
          }

          // Stage 5: Push labeled log lines to Loki
          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }

          // ── Edge firewall remote syslog ──────────────────────────────────
          // The firewall ships every facility to this listener over
          // TCP/1514 in RFC5424.
          //
          // TCP rather than UDP: the WAN link-flap bursts this exists to
          // catch are precisely when UDP datagrams get dropped.
          // RFC5424 rather than RFC3164: RFC3164 timestamps carry neither
          // year nor timezone, and these lines are correlated against an
          // ISP's optical-line logs where exact times are the evidence.

          // Promote a bounded subset of syslog header fields to labels. The
          // component's __syslog_message_* labels are internal and dropped
          // unless mapped here. hostname is omitted (constant — already the
          // static `host` label) and so is facility (largely redundant with
          // app_name); both would only add stream cardinality.
          loki.relabel "syslog" {
            forward_to = []

            rule {
              action = "labelmap"
              regex  = "__syslog_message_(app_name|severity)"
            }
          }

          loki.source.syslog "firewall" {
            listener {
              address       = "0.0.0.0:1514"
              protocol      = "tcp"
              syslog_format = "rfc5424"

              // Keep the firewall's own timestamp rather than stamping on
              // arrival — drop times are the whole point of this feed.
              use_incoming_timestamp = true

              // pf filter lines are long; the 8192 default truncates some.
              max_message_length = 16384

              // `app` and `service_name` both carry "firewall" so these
              // streams are findable by that word in Grafana's Drilldown
              // service picker and label filters — "theshield" alone is not
              // an obvious search term. service_name follows the
              // namespace/app convention used by the Kubernetes pipeline
              // above.
              labels = {
                job          = "syslog",
                host         = "theshield",
                namespace    = "network",
                app          = "firewall",
                service_name = "network/firewall",
              }
            }

            relabel_rules = loki.relabel.syslog.rules
            forward_to    = [loki.process.firewall.receiver]
          }

          loki.process "firewall" {
            // Count WAN carrier drops so Prometheus can alert on them. The
            // kernel line looks like:
            //   <6>[1164263] igb0: link state changed to DOWN
            // A named capture is required — metric.counter matches on an
            // extracted key, not on the raw line.
            // Anchored to the kernel MSG prefix: sudo audit lines echo
            // investigation greps containing this phrase into the same
            // syslog stream, and an unanchored substring match counts them
            // as drops (observed 2026-08-11).
            stage.regex {
              expression = "(?P<wan_link_down>^<\\d+>\\[\\d+\\] igb0: link state changed to DOWN)"
            }

            // Count gateway-monitor (dpinger) alarm transitions into a bad
            // state. Since 2026-08-11 an inline switch holds igb0's carrier
            // up, so upstream outages no longer produce link-state lines —
            // these alarm lines are the WAN outage signal instead:
            //   MONITOR: WAN_DHCP (Addr: ... Alarm: none -> loss RTT: ... Loss: 12.0 %)
            // Recovery transitions (-> none) are deliberately not counted.
            stage.regex {
              expression = "(?P<wan_gw_alarm>Alarm: [a-z]+ -> (?:loss|delay|down))"
            }

            // pf verdicts. filterlog MSG is CSV:
            //   rule,subrule,anchor,rid,interface,reason,action,dir,...
            // Anchored field-wise so nothing else can match; kernel and
            // sudo lines fail the six-comma prefix.
            stage.regex {
              expression = "^(?:[^,]*,){6}(?P<fw_action>block|pass),"
            }

            stage.metrics {
              metric.counter {
                // No `value` filter: the capture includes the kernel
                // sequence prefix, which varies per line. Presence of the
                // capture is the match.
                name        = "wan_link_down_total"
                description = "WAN (igb0) carrier drops observed on theshield"
                source      = "wan_link_down"
                action      = "inc"

                // Default is 5m, which would delete the series between
                // drops and leave increase() with nothing to measure.
                max_idle_duration = "168h"
              }

              // No `value` filter: increments on any captured transition
              // (none -> loss, loss -> down, none -> down, ...).
              metric.counter {
                name        = "wan_gateway_alarm_total"
                description = "Gateway monitor alarm transitions (loss/delay/down) on theshield"
                source      = "wan_gw_alarm"
                action      = "inc"

                max_idle_duration = "168h"
              }

              metric.counter {
                name        = "fw_block_total"
                description = "pf blocked packets logged by filterlog on theshield"
                source      = "fw_action"
                value       = "block"
                action      = "inc"

                max_idle_duration = "168h"
              }

              metric.counter {
                name        = "fw_pass_total"
                description = "pf passed packets logged by filterlog on theshield"
                source      = "fw_action"
                value       = "pass"
                action      = "inc"

                max_idle_duration = "168h"
              }

              // Watchdog. Carrier drops are rare, so the counter above sits
              // flat for days and cannot distinguish "no drops" from "feed
              // broken". The firewall emits syslog continuously, so this one
              // going flat is unambiguous — it backs the
              // FirewallSyslogFeedDown alert.
              metric.counter {
                name        = "firewall_syslog_lines_total"
                description = "All syslog lines received from theshield"
                match_all   = true
                action      = "inc"

                max_idle_duration = "168h"
              }
            }

            forward_to = [loki.write.default.receiver]
          }

          // ── Plex file-based log collection ──────────────────────────────
          // Plex writes logs to files rather than stdout. The host directory
          // is mounted into Alloy at /mnt/plex-logs via a hostPath volume.
          // DirectoryOrCreate ensures Alloy pods on nodes without the Plex
          // data directory start with an empty dir (no files to tail).

          // Discover *.log files under the mounted Plex log directory
          local.file_match "plex_logs" {
            path_targets = [{
              __path__     = "/mnt/plex-logs/*.log",
              namespace    = "plex",
              app          = "plex",
              source       = "file",
              service_name = "plex/plex",
            }]
          }

          // Tail discovered Plex log files, starting from end to avoid
          // ingesting all historical data on first startup
          loki.source.file "plex_logs" {
            targets    = local.file_match.plex_logs.targets
            forward_to = [loki.process.plex.receiver]

            tail_from_end = true
          }

          // Parse Plex log format: "Jan 27, 2026 12:39:48.421 [tid] LEVEL - msg"
          loki.process "plex" {
            stage.regex {
              expression = "^\\S+ \\d+, \\d{4} [\\d:.]+ \\[\\d+\\] (?P<level>\\S+) - (?P<message>.*)$"
            }

            // Normalize level to lowercase. Uses stage.template because
            // stage.replace doesn't modify extracted values or the log line
            // in this Alloy version. The {{ "{{" }}/{{ "}}" }} escaping
            // prevents Helm's tpl function from interpreting the River
            // template delimiters as Go template actions.
            stage.template {
              source   = "level"
              template = "{{ "{{" }} .Value | lower {{ "}}" }}"
            }

            // Use the parsed message as the log line body
            stage.output {
              source = "message"
            }

            // Promote level to a Loki label
            stage.labels {
              values = {
                level = "",
              }
            }

            // Attach filename as structured metadata so individual log files
            // can be distinguished in LogQL queries
            stage.structured_metadata {
              values = {
                filename = "",
              }
            }

            forward_to = [loki.write.default.receiver]
          }

    controller:
      type: daemonset

      # Let Prometheus scrape Alloy's /metrics so the stage.metrics counter
      # (loki_process_custom_wan_link_down_total) reaches the alerting rules
      # in prometheus/helmrelease.yaml. Uses the pod-annotation method — see
      # "Adding a scrape target" in ../README.md. Do NOT also add a static
      # extraScrapeConfigs entry for Alloy or every series is duplicated.
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
        prometheus.io/path: "/metrics"

      volumes:
        extra:
          - name: plex-logs
            hostPath:
              path: "/mnt/thedatapool/app-data/plex/config/Library/Application Support/Plex Media Server/Logs"
              type: DirectoryOrCreate

    serviceAccount:
      create: true

    rbac:
      create: true

    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
