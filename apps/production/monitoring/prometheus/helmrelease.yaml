apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      version: "28.6.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 24h
  values:
    # --- Prometheus Server ---
    server:
      enabled: true
      retention: "180d"
      retentionSize: "190GB"

      persistentVolume:
        enabled: true
        existingClaim: prometheus-storage-pvc

      securityContext:
        runAsUser: 4030
        runAsGroup: 4030
        fsGroup: 4030

      resources:
        limits:
          cpu: "1"
          memory: "2Gi"

      # Basic-auth password for the stalwart scrape job below. Mounted as a file
      # rather than written into the scrape config inline: serverFiles and
      # extraScrapeConfigs render into a ConfigMap, which is not a Secret and is
      # readable by anything that can read ConfigMaps in this namespace.
      # basic_auth.password_file keeps the credential in the Secret and puts only a
      # path in the ConfigMap.
      extraSecretMounts:
        - name: stalwart-metrics-auth
          mountPath: /etc/prometheus/secrets
          secretName: stalwart-metrics-auth
          readOnly: true

      # Ingress managed separately via raw K8s Ingress + cert-manager Certificate
      ingress:
        enabled: false

      global:
        scrape_interval: 15s
        evaluation_interval: 15s

    # --- AlertManager ---
    alertmanager:
      enabled: true

      persistence:
        enabled: false

      extraSecretMounts:
        - name: alertmanager-telegram-secret
          mountPath: /etc/alertmanager/secrets
          secretName: alertmanager-secrets
          readOnly: true

      resources:
        limits:
          cpu: "1"
          memory: "1Gi"
        requests:
          cpu: "250m"
          memory: "250Mi"

      # Enable the AlertManager configmap-reload sidecar. Without this,
      # changes to .config below land in the ConfigMap but the running
      # pod keeps serving the old in-memory config until the next
      # restart. We hit this exact failure mode on 2026-05-17 — see
      # the comment on the prometheus configmapReload block below for
      # the full incident write-up.
      configmapReload:
        enabled: true

      # The chart's previous top-level `alertmanagerFiles.alertmanager.yml`
      # block was IGNORED — the chart renders AlertManager config from
      # `alertmanager.config` (nested under the subchart values). Our
      # config sat in the wrong path silently for ~110 days, so
      # AlertManager ran on the chart default (single "default-receiver"
      # with no notifier) and routed every alert into the void. Telegram
      # delivery never worked. Moving the config to the correct path here.
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: on_call_operator_default
          group_by:
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
        inhibit_rules:
          - source_match:
              severity: critical
            target_match:
              severity: warning
            equal:
              - alertname
              - job
              - instance
        receivers:
          - name: on_call_operator_default
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
                send_resolved: true
                chat_id: 510755639

    # --- Alert Rules ---
    # All alerting rules go into the standard alerting_rules.yml key so they're
    # automatically included in Prometheus's rule_files without extra config.
    serverFiles:
      alerting_rules.yml:
        groups:
          # Cloudflare's API allows 1200 requests per 5 minutes per token, and
          # exceeding it returns 429 for *every* call for the next 5 minutes --
          # not just the call that went over. Crossplane then cannot observe any
          # resource, so nothing reconciles and drift goes undetected.
          #
          # This cost most of a night on 2026-08-28 because it is invisible
          # without these metrics: the provider reports Healthy, DNS keeps
          # working (it lands in the gaps), and only some resources show 429 --
          # which reads like a bug in those resources rather than a shared
          # budget being exhausted. Full write-up in the private repo's
          # docs/specs/email-infrastructure/summary.md.
          #
          # One token is shared by every managed resource, so the budget is
          # account-wide in practice: adding resources anywhere raises the cost
          # of every sweep.
          - name: crossplane-cloudflare-api
            rules:
              # 1200 per 5 minutes is the hard limit. Warn at half of it, which
              # leaves a full sweep of headroom to react in.
              - alert: CloudflareAPIBudgetHigh
                expr: 'sum(increase(upjet_resource_ext_api_duration_count[5m])) > 600'
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: Crossplane is using over half the Cloudflare API budget
                  description: >-
                    Over 600 Cloudflare API calls in 5 minutes; the limit is 1200 per token,
                    after which every call 429s for 5 minutes and Crossplane stops reconciling.
                    Raise --poll in provider-cloudflare-runtimeconfig.yaml. Do NOT set
                    --max-reconcile-rate, which silently stops controllers.
              - alert: CloudflareAPIBudgetCritical
                expr: 'sum(increase(upjet_resource_ext_api_duration_count[5m])) > 1000'
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: Crossplane is about to exhaust the Cloudflare API budget
                  description: >-
                    Over 1000 Cloudflare API calls in 5 minutes against a 1200 limit. At the
                    limit every call 429s for 5 minutes and no managed resource can be observed.
              # The symptom rather than the cause: resources that cannot sync.
              # Catches throttling, credential problems and dead controllers
              # alike, which is the point -- on 2026-08-28 all three looked
              # identical from outside.
              # crossplane_managed_resource_{exists,synced} are per-GVK gauges,
              # NOT per-resource. There is one series per installed CRD kind --
              # 242 of them for this provider -- so `synced == 0` matches every
              # kind that simply has no resources, which was 241 of them. The
              # difference against _exists is what actually means "resources
              # exist for this kind and some of them are not syncing".
              - alert: CrossplaneResourcesNotSynced
                expr: 'crossplane_managed_resource_exists - crossplane_managed_resource_synced > 0'
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Crossplane resources unsynced for 30m: {{ $labels.gvk }}"
                  description: >-
                    {{ $value }} managed resources of {{ $labels.gvk }} report Synced=False.
                    Check the resource's Synced condition message. Note lastTransitionTime does
                    NOT update while the reason stays the same, so a stale-looking timestamp
                    does not mean the controller has stopped retrying -- and an unchanging one
                    does not mean it is still trying either.
              # CrossplaneResourcesNotSynced resolves on exists - synced == 0,
              # which is reached either by synced rising OR by exists falling to
              # zero. Deletion and repair produce an identical "Resolved"
              # notification. On 2026-08-28 that had to be told apart by hand,
              # by checking the denominators had held at 10 and 7.
              #
              # Self-baselining rather than a hardcoded floor: a literal
              # `> 100` is correct only until the real count changes, and
              # nobody updates a number that is not failing. max_over_time
              # tracks additions on its own.
              #
              # `max by (gvk)` is load-bearing, not tidying. The raw series
              # carry pod, instance and pkg_crossplane_io_revision labels, all
              # of which change when the provider upgrades -- so an unaggregated
              # comparison silently starts a fresh 6h baseline on every rollout
              # and cannot see a drop across one. `sum by (gvk)` would instead
              # double-count while old and new pods overlap mid-roll, then halve
              # and fire a false alarm on every upgrade. max is stable across
              # both: one replica's worth either way.
              #
              # It fires on deliberate deletions too. That is intended -- every
              # managed resource here comes from git, so an unannounced drop is
              # exactly the event worth interrupting for. Expect it to stay
              # firing until the 6h window rolls past the old high-water mark.
              #
              # Verified against live Prometheus before merging: the expression
              # returns nothing now, and the same expression with `+ 1` on the
              # right returns all 242 series -- which is what proves the
              # comparison actually joins on labels rather than silently
              # matching nothing and never firing.
              - alert: CrossplaneResourcesDisappeared
                expr: 'max by (gvk) (crossplane_managed_resource_exists) < max_over_time(max by (gvk) (crossplane_managed_resource_exists)[6h:])'
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "Crossplane managed resources vanished: {{ $labels.gvk }}"
                  description: >-
                    {{ $labels.gvk }} now reports {{ $value }} resources, fewer than its
                    6h high-water mark. If this was not a deliberate git deletion, suspect a
                    kustomize path change combined with prune: true. Cloudflare state is the
                    ground truth -- re-run export-cloudflare.sh and diff before recreating
                    anything, since the records may still be live and only the managed
                    resources gone.
              # The threshold rules above cannot fire on data that does not
              # exist: if the whole metric family disappears, every expr
              # referencing it goes empty and silently stops alerting. absent()
              # is the only form that catches its own absence.
              - alert: CrossplaneStateMetricsAbsent
                expr: 'absent(crossplane_managed_resource_exists)'
                for: 30m
                labels:
                  severity: critical
                annotations:
                  summary: Crossplane managed-resource state metrics have disappeared
                  description: >-
                    No crossplane_managed_resource_exists series at all. Every other Crossplane
                    alert here is blind while this is firing. Check the provider pod, its
                    metrics endpoint, and the ServiceMonitor.
              # A provider that stops reconciling a whole kind looks completely
              # healthy: the pod is Running, the Provider is Healthy, and other
              # kinds keep working. This is the only signal that catches it.
              - alert: CrossplaneProviderNotReconciling
                expr: 'sum(rate(upjet_resource_ext_api_duration_count[15m])) == 0'
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: Crossplane provider has made no external API calls in 30m
                  description: >-
                    The provider is up but calling nothing. Expected steady-state is roughly
                    17 calls/min at --poll=15m with ~131 managed resources. Zero means
                    controllers are not running even though the pod is Running and Healthy.
          - name: gpupoet
            rules:
              - alert: ProbeFailure
                expr: 'up{instance="gpupoet.com"} < 1.0'
                for: 60m
                labels:
                  severity: critical
                annotations:
                  summary: Probe failure. Check https://gpupoet.com/ops/metrics
              - alert: MissingMetricsFailure
                expr: 'scrape_samples_scraped{instance="gpupoet.com"} < 7.0'
                for: 60m
                labels:
                  severity: critical
                annotations:
                  summary: Missing metrics. Check https://gpupoet.com/ops/metrics
              - alert: CacheRevalidationJobFailure
                expr: 'coinpoet_last_job_success{instance="gpupoet.com"} == 0'
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: Cache revalidation job failed
                  description: The gpupoet cache revalidation cronjob has failed. Check the app logs and https://gpupoet.com/ops/metrics for details.
              - alert: AmazonSearchFailure
                expr: 'increase(coinpoet_amazon_searches_total{status="error",instance="gpupoet.com"}[1h]) > 4'
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: Multiple Amazon search failures in the last hour
                  description: More than 4 Amazon search errors in 1 hour. Check proxy config and amazon-searcher service.
              - alert: AmazonSearchStale
                expr: '(time() - coinpoet_amazon_last_success_timestamp_seconds{instance="gpupoet.com"}) > 7200'
                for: 30m
                labels:
                  severity: critical
                annotations:
                  summary: No successful Amazon searches in over 2 hours
                  description: Amazon searching has not succeeded in over 2 hours. Check amazon-searcher pod logs.
              # ProbeFailure above only sees the app's own /ops/metrics being
              # scraped -- it says nothing about whether the public URL actually
              # answers through DNS, TLS and the ingress. This is that check,
              # same shape as FernfilesSiteProbeFailing.
              - alert: GpupoetSiteProbeFailing
                expr: 'probe_success{job="blackbox_https",instance=~"https://gpupoet.com/.*"} == 0'
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    gpupoet.com is not answering its https probe.
                  description: >-
                    The https probe to {{ $labels.instance }} has failed for 5
                    minutes.
              - alert: GpupoetCertExpiringSoon
                expr: '(probe_ssl_earliest_cert_expiry{job="blackbox_https",instance=~"https://gpupoet.com/.*"} - time()) / 86400 < 14'
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: >-
                    gpupoet.com TLS certificate expires in under 14 days — cert-manager renewal is likely broken.
                  description: >-
                    {{ $value | printf "%.1f" }} days of validity left on
                    {{ $labels.instance }}. cert-manager normally renews at 30
                    days, so reaching 14 means renewal is not happening.
          - name: gpu-poet-collector
            rules:
              - alert: CollectorDown
                expr: 'up{job="gpu_poet_collector"} < 1.0'
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: gpu-poet-collector /metrics endpoint is not reachable.
              - alert: CollectorGitPushStalled
                # 6 days = 5-day cadence + 1d slack. Only fires after a full
                # cycle has been missed.
                expr: '(time() - collector_last_git_push_timestamp_seconds) > 518400'
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: gpu-poet-collector has not pushed cache updates to git in over 6 days.
              - alert: CollectorHighErrorRate
                # >5% of fetches are landing in the not-found bucket (404/error/unparseable)
                # over the past hour — gpumagick may be blocking us or the parser is broken.
                expr: 'rate(collector_furmark_fetches_total{outcome="notfound"}[1h]) / clamp_min(sum(rate(collector_furmark_fetches_total[1h])), 0.001) > 0.05'
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: gpu-poet-collector FurMark fetch error rate >5% over the last hour.
          - name: tayle
            rules:
              - alert: PodNotReady
                expr: 'kube_pod_status_ready{namespace="tayle-prod",pod!~"^db-backup-.*",condition="false"} > 0'
                labels:
                  severity: warning
                annotations:
                  summary: >-
                    Tayle Pod not ready. See https://grafana.activescott.com/d/cc030cf0-cde1-46c1-bc49-fd5c88d7f002/tayle-prod-status
              - alert: DeploymentNotAvailable
                expr: 'kube_deployment_status_condition{namespace="tayle-prod",condition="Available",status="false"} > 0'
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    Tayle Deployment not available. See https://grafana.activescott.com/d/cc030cf0-cde1-46c1-bc49-fd5c88d7f002/tayle-prod-status
              - alert: StatefulSetNotReady
                expr: 'kube_statefulset_status_replicas_ready{namespace="tayle-prod"} == 0'
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    Tayle StatefulSet has no ready replicas. See https://grafana.activescott.com/d/cc030cf0-cde1-46c1-bc49-fd5c88d7f002/tayle-prod-status
          # Alert names here are prefixed "Fernfiles" on purpose. AlertManager
          # groups by `alertname` alone (see route.group_by above) and the
          # inhibit_rule matches on it too, so two projects sharing a generic
          # name like PodNotReady would have their notifications merged and
          # could inhibit each other. The older groups above predate that
          # realization; new rules should stay project-qualified.
          - name: fernfiles
            rules:
              # The app deployment runs a single replica
              # (k8s/base/app-deployment.yaml), so one crash is a full outage
              # and every restart is worth waking up for. On 2026-08-16 the
              # pod crashed and restarted 3 times entirely unnoticed; it
              # surfaced only when Scott hit "no available server" trying to
              # play a video from Prague. Root cause and timeline:
              # fernfiles docs/specs/016-stream-abort-crash/summary.md.
              - alert: FernfilesAppPodRestarted
                expr: 'increase(kube_pod_container_status_restarts_total{namespace="fernfiles-prod",container="app"}[15m]) > 0'
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    Fernfiles app pod restarted. See https://grafana.activescott.com/d/fernfiles-prod/fernfiles-prod-status
                  description: >-
                    The app container restarted in the last 15 minutes. With a
                    single replica this means the site was down. Check
                    `kubectl --context nas -n fernfiles-prod logs app-... --previous`
                    for the fatal error, and the Restarts panel on the dashboard.
              # The restart alert above catches the first crash; this catches
              # the state where it has given up and is backing off, which is a
              # sustained outage rather than a blip.
              - alert: FernfilesAppCrashLoopBackOff
                expr: 'kube_pod_container_status_waiting_reason{namespace="fernfiles-prod",reason="CrashLoopBackOff"} > 0'
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    Fernfiles pod in CrashLoopBackOff. See https://grafana.activescott.com/d/fernfiles-prod/fernfiles-prod-status
                  description: >-
                    Pod {{ $labels.pod }} is in CrashLoopBackOff and the site is
                    down for everyone. Kubernetes will keep retrying with
                    growing backoff; it will not recover on its own if the crash
                    is deterministic.
              # What a user experiences as "no available server" from the
              # ingress: zero ready endpoints behind the service.
              - alert: FernfilesAppDeploymentNotAvailable
                expr: 'kube_deployment_status_condition{namespace="fernfiles-prod",deployment="app",condition="Available",status="false"} > 0'
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    Fernfiles app deployment not available. See https://grafana.activescott.com/d/fernfiles-prod/fernfiles-prod-status
              # Postgres. Losing this is worse than losing the web pod: the app
              # cannot serve anything, and this is the tenet-#1 store.
              - alert: FernfilesDbStatefulSetNotReady
                expr: 'kube_statefulset_status_replicas_ready{namespace="fernfiles-prod",statefulset="db"} == 0'
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    Fernfiles database has no ready replicas. See https://grafana.activescott.com/d/fernfiles-prod/fernfiles-prod-status
              # Slower burn than the conditions above — catches a pod that is
              # up but failing its readiness probe. 10m so a normal rollout
              # (and the terminating old pod) never trips it.
              - alert: FernfilesPodNotReady
                expr: 'kube_pod_status_ready{namespace="fernfiles-prod",condition="false"} > 0'
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: >-
                    Fernfiles pod {{ $labels.pod }} not ready for 10m. See https://grafana.activescott.com/d/fernfiles-prod/fernfiles-prod-status
              # The checks above all watch Kubernetes objects. This one asks
              # the question a user asks: does the URL answer? It goes through
              # the real ingress and TLS, so it catches a 502-with-healthy-pods
              # or a bad ingress rule that the object-level checks cannot see.
              # 5m because a rollout can blip a request or two.
              - alert: FernfilesSiteProbeFailing
                expr: 'probe_success{job="blackbox_https",instance=~"https://fernfiles.com/.*"} == 0'
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    fernfiles.com is not answering its https probe. See https://grafana.activescott.com/d/fernfiles-prod/fernfiles-prod-status
                  description: >-
                    The https probe to {{ $labels.instance }} has failed for 5
                    minutes. Probed from inside the LAN, so this does not rule
                    out (or in) an ISP or external DNS problem — but the
                    ingress, TLS and app path are all covered by it.
              # Certificate expiry is the one failure that is both entirely
              # predictable and total when it lands. cert-manager renews at
              # 30 days remaining, so 14 days left means renewal is broken and
              # there is still time to fix it by hand.
              - alert: FernfilesCertExpiringSoon
                expr: '(probe_ssl_earliest_cert_expiry{job="blackbox_https",instance=~"https://fernfiles.com/.*"} - time()) / 86400 < 14'
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: >-
                    fernfiles.com TLS certificate expires in under 14 days — cert-manager renewal is likely broken.
                  description: >-
                    {{ $value | printf "%.1f" }} days of validity left on
                    {{ $labels.instance }}. cert-manager normally renews at 30
                    days, so reaching 14 means renewal is not happening. Check
                    the Certificate and CertificateRequest objects in the
                    fernfiles-prod namespace.
          - name: cloudflare-proxied-sites
            rules:
              # Site-down / redirect-loop coverage for the Cloudflare-proxied
              # domains pointed at k8s.activescott.com. See the blackbox_https
              # job comment for why this specifically catches a Cloudflare
              # SSL/TLS mode misconfiguration (e.g. "Flexible" against an
              # origin that force-redirects to https), not just a pod outage.
              - alert: RamblefeedSiteProbeFailing
                expr: 'probe_success{job="blackbox_https",instance=~"https://ramblefeed.com/.*"} == 0'
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    ramblefeed.com is not answering its https probe.
                  description: >-
                    The https probe to {{ $labels.instance }} has failed for 5
                    minutes. Could be a pod/ingress problem, or Cloudflare's
                    SSL/TLS mode drifting away from Full -- see
                    tinkerbellbot.com's 2026-08-30 incident.
              - alert: RamblefeedCertExpiringSoon
                expr: '(probe_ssl_earliest_cert_expiry{job="blackbox_https",instance=~"https://ramblefeed.com/.*"} - time()) / 86400 < 14'
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: >-
                    ramblefeed.com TLS certificate expires in under 14 days — cert-manager renewal is likely broken.
                  description: >-
                    {{ $value | printf "%.1f" }} days of validity left on
                    {{ $labels.instance }}. cert-manager normally renews at 30
                    days, so reaching 14 means renewal is not happening.
              - alert: TinkerbellbotSiteProbeFailing
                expr: 'probe_success{job="blackbox_https",instance=~"https://tinkerbellbot.com/.*"} == 0'
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    tinkerbellbot.com is not answering its https probe.
                  description: >-
                    The https probe to {{ $labels.instance }} has failed for 5
                    minutes. Could be a pod/ingress problem, or Cloudflare's
                    SSL/TLS mode drifting away from Full -- see the
                    2026-08-30 flexible-mode redirect-loop incident.
              - alert: TinkerbellbotCertExpiringSoon
                expr: '(probe_ssl_earliest_cert_expiry{job="blackbox_https",instance=~"https://tinkerbellbot.com/.*"} - time()) / 86400 < 14'
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: >-
                    tinkerbellbot.com TLS certificate expires in under 14 days — cert-manager renewal is likely broken.
                  description: >-
                    {{ $value | printf "%.1f" }} days of validity left on
                    {{ $labels.instance }}. cert-manager normally renews at 30
                    days, so reaching 14 means renewal is not happening.
          - name: tinkerbell-llm-providers
            rules:
              # Critical: an LLM provider rejected requests with a payment
              # error (e.g. Anthropic 400 + "credit balance too low",
              # OpenAI 402, etc). Fires when the per-provider
              # `last_payment_error_timestamp` is more recent than the
              # `last_success_timestamp`. The `unless` clause clears the
              # alert ONLY when a successful call lands on the SAME
              # provider — a quiet window with no chat activity won't
              # auto-resolve it. Default vector matching joins on
              # `provider` so cross-provider successes don't suppress.
              - alert: LLMProviderPaymentRequired
                expr: |
                  (tinkerbell_llm_provider_last_payment_error_timestamp_seconds > 0)
                  unless
                  (
                    tinkerbell_llm_provider_last_success_timestamp_seconds
                    > tinkerbell_llm_provider_last_payment_error_timestamp_seconds
                  )
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: 'LLM provider {{ $labels.provider }} is failing with a payment error — top up the account.'
                  description: 'Provider {{ $labels.provider }} last returned a payment-bucketed error at timestamp {{ $value }} and has not had a successful call since. Chat is silently failing for users. Top up at console.anthropic.com (or the relevant provider) and send a test message to clear the alert.'
              - alert: LLMProviderRateLimited
                expr: 'rate(tinkerbell_llm_provider_errors_total{error_type="rate_limit"}[10m]) > 0.05'
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'LLM provider {{ $labels.provider }} is rate-limiting requests.'
                  description: 'Sustained 429s from {{ $labels.provider }} — chat experience is degraded. Consider lowering request volume or upgrading the plan.'
              - alert: LLMProviderErrorSpike
                expr: 'rate(tinkerbell_llm_provider_errors_total{error_type!~"payment|rate_limit"}[10m]) > 0.1'
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'LLM provider {{ $labels.provider }} error rate elevated ({{ $labels.error_type }}).'
                  description: 'Errors for {{ $labels.provider }} bucket={{ $labels.error_type }} status={{ $labels.status_code }} above threshold. Investigate provider status page and recent deploys.'
          - name: tinkerbell-proxy
            rules:
              # Critical: payment-classified proxy errors. The fetch tool
              # refines OxyLabs 407s using the X-Error-Description header
              # — when the response mentions traffic/bandwidth/limit/balance
              # we land here. Indicates the OxyLabs subscription is out of
              # paid bandwidth.
              - alert: ProxyOutOfBandwidth
                expr: 'increase(tinkerbell_proxy_errors_total{error_type="payment"}[5m]) > 0'
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: 'Proxy {{ $labels.proxy }} reports out-of-bandwidth/billing failure — fetch path is broken.'
                  description: 'tinkerbell_proxy_errors_total{error_type=payment, proxy={{ $labels.proxy }}} fired. OxyLabs returned a 4xx with X-Error-Description matching traffic/bandwidth/quota/balance. Top up the OxyLabs plan or check billing immediately.'
              - alert: ProxyAuthFailing
                expr: 'increase(tinkerbell_proxy_errors_total{error_type="auth"}[5m]) > 3'
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'Proxy {{ $labels.proxy }} is rejecting authentication.'
                  description: 'Multiple 407 responses from {{ $labels.proxy }} in the last 5 minutes. Verify OXYLABS_USERNAME/OXYLABS_PASSWORD secrets and whitelisted IPs in the OxyLabs dashboard.'
              - alert: ProxyConnectionFailures
                expr: 'rate(tinkerbell_proxy_errors_total{error_type="connection"}[10m]) > 0.1'
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'Proxy {{ $labels.proxy }} connection failures elevated.'
                  description: 'Sustained ETIMEDOUT/ECONNREFUSED/ERR_TUNNEL errors against {{ $labels.proxy }} — could be transient network or a hard-down OxyLabs account.'
          - name: tinkerbell-log-health
            rules:
              # General backstop, not tied to any one failure mode: counts
              # warn and error/fatal log lines from the tinkerbell app
              # separately (fed by the loki.process "default" pipeline's two
              # counters, see alloy/helmrelease.yaml). Exists alongside the
              # specific LLMProvider*/Proxy* alerts above so a failure mode
              # nobody's instrumented yet still surfaces instead of relying
              # on someone noticing a clean-looking dashboard.
              #
              # Split into two alerts 2026-08-25 after a single combined
              # warn+error+fatal counter made TinkerbellAppErrorVolumeElevated
              # fire on routine warn-level noise (anti-bot retries, empty
              # search-provider results — ~14/hour is normal), indistinguishable
              # from an actual error spike. Baseline measured 2026-08-22 (pre-split):
              # 61 info / 1 warn / 0 error over 24h.
              #
              # Both expressions below MUST stay wrapped in sum(). These counters come from
              # Alloy's loki.process, which attaches the ambient stream labels (namespace,
              # pod, node, controller_revision_hash, ...) to each series — 16 labels, and 3
              # live series for this one logical counter, since it forks on both pod and
              # controller_revision_hash. An Alloy restart alone forks it, with no tinkerbell
              # deploy involved. Without sum(), Prometheus evaluates the threshold PER SERIES
              # and the alert under-detects: three pods emitting 20 warns/hour each is
              # 60/hour in reality but 20 per series, so nothing fires. Both alerts had this
              # bug until 2026-08-29; the tinkerbell dashboard panel already aggregated, so
              # panel and alert disagreed about what they measured.
              - alert: TinkerbellAppWarnVolumeElevated
                # 50 is measured, not guessed: across 3.5 days of aggregated data,
                # sum(increase(...[1h])) had max 55.59, p99 43.7, p95 15.1. That max is an
                # increase() extrapolation artifact from an Alloy restart, which `for: 10m`
                # absorbs; genuine hourly spikes top out near 40.
                expr: 'sum(increase(loki_process_custom_tinkerbell_app_warn_log_lines_total[1h])) > 50'
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'Tinkerbell app logging elevated warn volume.'
                  description: 'More than 50 warn-level log lines from the tinkerbell app in the last hour. Check Loki in Grafana Explore: {namespace="tinkerbell-prod"} | level="warn".'
              - alert: TinkerbellAppErrorVolumeElevated
                # Threshold unchanged, but it now means 3 error lines from the app rather
                # than 3 from any single pod-revision. Re-check it against aggregated data
                # once a week of history exists under the new expression.
                expr: 'sum(increase(loki_process_custom_tinkerbell_app_error_log_lines_total[1h])) > 3'
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'Tinkerbell app logging elevated error/fatal volume.'
                  description: 'More than 3 error/fatal log lines from the tinkerbell app in the last hour. Check Loki in Grafana Explore: {namespace="tinkerbell-prod"} | level=~"error|fatal".'
          - name: email-relay
            rules:
              # Outbound mail for fernfiles, ramblefeed and tinkerbell all leaves
              # through the email-relay Postfix null client
              # (activescott/fernfiles#204). Postfix exports no metrics, so these
              # are fed by counters the alloy pipeline derives from its log lines
              # — see alloy/helmrelease.yaml.
              #
              # The applications cannot detect any of this themselves: the relay
              # accepts a message and delivers it afterwards, so a send that fails
              # at Cloudflare still looks like a success to the app that submitted it.
              - alert: EmailRelayBounced
                # Any permanent failure at all. These are sign-in codes and share
                # invites, so a single lost message is a user who cannot get into
                # their account — worth paging on rather than thresholding.
                expr: 'increase(loki_process_custom_email_relay_bounced_total[15m]) > 0'
                for: 0m
                labels:
                  severity: critical
                annotations:
                  summary: 'email-relay could not deliver a message.'
                  description: 'Postfix reported status=bounced — the message is gone and will not be retried. Check Loki in Grafana Explore: {namespace="email-relay"} |= "status=bounced". Auth chain and debugging notes: apps/production/email-relay/README.md.'
              - alert: EmailRelayDeferred
                # Deferrals in ones and twos are normal; postfix retries and usually
                # succeeds. Sustained deferral means Cloudflare is refusing us, which
                # is the documented risk of Email Sending being a beta with an
                # undocumented, auto-scaling daily quota.
                expr: 'increase(loki_process_custom_email_relay_deferred_total[1h]) > 5'
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'email-relay is repeatedly deferring mail.'
                  description: 'More than 5 deferrals in an hour. Postfix is still retrying, but sustained deferral usually means Cloudflare is rejecting us — check the sending quota and the API token. Loki: {namespace="email-relay"} |= "status=deferred".'
              - alert: EmailRelayAuthFailures
                # An app whose SASL password no longer matches the relay's copy
                # produces no delivery lines at all, so the counters above stay flat
                # and look like a quiet day. This is what makes that case visible.
                #
                # Counts LOG LINES, not attempts: postfix walks CRAM-MD5, PLAIN and
                # LOGIN, so one rejected login emits three. Measured, not assumed —
                # an earlier threshold of 3 would have paged after two test runs.
                # send-test-email.sh deliberately fails one auth per run to prove SASL
                # is enforced, so this allows three such runs an hour and fires on the
                # fourth. A genuinely misconfigured app retries far faster than that.
                expr: 'increase(loki_process_custom_email_relay_auth_failed_total[1h]) > 9'
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'Repeated failed authentications against email-relay.'
                  description: 'More than 3 SASL failures in an hour. Most likely an app password no longer matches SMTPD_SASL_USERS in the relay secret; also worth checking whether anything is reaching the port that should not be. Loki: {namespace="email-relay"} |= "authentication failed".'
          # Stalwart, the self-hosted mailboxes for willeke.com
          # (apps/production/email-stalwart). Every alert in this group has a
          # matching panel on the "Email" dashboard, in the "Alerts" row at the top
          # -- so anything that can page has somewhere to be looked at.
          #
          # Two independent evidence sources on purpose. Stalwart's own exporter is a
          # setting in its datastore that git does not describe and that a restore
          # could silently revert; the loki_process_custom_stalwart_* counters come
          # from container stdout, which cannot be turned off from inside the app.
          # Where a question can be answered by either, it is answered by the log
          # counter, because that is the one that keeps working.
          - name: email-stalwart
            rules:
              # THE CERTIFICATE ALERTS
              #
              # Three of them, because there are three distinct ways TLS breaks here
              # and the first two cannot see each other's failure.
              #
              # Stalwart does not notice a rotated certificate file. cert-manager
              # renews, the kubelet refreshes the mounted Secret, and the running
              # server keeps serving the old one until something restarts it --
              # stalwart-tls-reload.yaml exists solely to do that, and it is a
              # CronJob comparing hashes, which is one more thing that can quietly
              # stop working. 993 and 465 are internet-facing, so the failure lands
              # on every mail client at once.
              - alert: StalwartServedCertNotRenewed
                # The precise detector for that failure, and the one worth having:
                # it compares what the server SERVES against what cert-manager HAS.
                # A gap means the reload did not happen, and it fires within a day of
                # the renewal -- about 30 days before anything actually breaks --
                # rather than waiting for the served certificate to approach expiry.
                #
                # min()/max() reduce both sides to label-less scalars, which is what
                # makes the comparison possible at all: the two metrics share no
                # labels (one is from blackbox, one from cert-manager) so a normal
                # vector match would silently find nothing and never fire.
                #
                # 5 days of slack absorbs the ordinary lag between cert-manager
                # writing the Secret and the reload CronJob's next daily run.
                expr: >-
                  min(probe_ssl_earliest_cert_expiry{job="blackbox_mail_tls"})
                  < max(certmanager_certificate_expiration_timestamp_seconds{namespace="email-stalwart",name="mail-activescott-com"}) - 432000
                for: 2h
                labels:
                  severity: warning
                annotations:
                  summary: Stalwart is serving an older certificate than cert-manager has issued
                  description: >-
                    cert-manager has renewed mail-activescott-com but the certificate offered on
                    the mail ports is still the previous one, so the reload did not happen. Check
                    the stalwart-tls-reload CronJob in email-stalwart; the fix is to restart the
                    pod. Nothing is broken for users yet — this fires ~30 days before the served
                    certificate expires, which is the entire point of it.
              - alert: StalwartServedCertExpiringSoon
                # Backstop for the above: whatever the reason, the certificate on the
                # wire is about to lapse. Fires on the served certificate, so it
                # covers a failed renewal AND a failed reload.
                expr: '(probe_ssl_earliest_cert_expiry{job="blackbox_mail_tls"} - time()) / 86400 < 14'
                for: 1h
                labels:
                  severity: critical
                annotations:
                  summary: >-
                    Stalwart is serving a certificate that expires in under 14 days on {{ $labels.instance }}
                  description: >-
                    {{ $value | printf "%.1f" }} days of validity left on the certificate actually
                    served by {{ $labels.instance }}. cert-manager renews at 30 days, so reaching
                    14 means either renewal or the reload is broken. When this expires, every mail
                    client on 993 and 465 fails to connect.
              - alert: StalwartCertificateNotRenewing
                # cert-manager's own view. Catches the case the two probes above
                # cannot: ACME renewal failing for the admin hostname as well, and
                # any future certificate in this namespace, without needing a probe
                # target added for each.
                expr: '(certmanager_certificate_expiration_timestamp_seconds{namespace="email-stalwart"} - time()) / 86400 < 14'
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: >-
                    cert-manager has not renewed {{ $labels.name }} — under 14 days left
                  description: >-
                    {{ $value | printf "%.1f" }} days left on Certificate {{ $labels.name }} in
                    email-stalwart. cert-manager renews at 30 days, so this means issuance is
                    failing. Check the Certificate and CertificateRequest objects and the ACME
                    HTTP-01 route through Traefik.
              # THE MAIL-PATH ALERTS
              - alert: StalwartMailPortDown
                # IMAP and submission. A user experiences this as "my mail app stopped
                # working" with no other symptom.
                expr: 'probe_success{job="blackbox_mail_tls"} == 0'
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: 'Stalwart is not answering TLS on {{ $labels.instance }}'
                  description: >-
                    The TLS handshake to {{ $labels.instance }} has failed for 5 minutes. Probed
                    from inside the cluster against the Service, so this is the server itself
                    rather than the firewall or WAN — which also means it does NOT rule out an
                    external-only problem when it is quiet.
              - alert: StalwartWebSurfaceDown
                # Three probes, three different backends behind one hostname pattern:
                # admin.mail.activescott.com (Stalwart), mail.activescott.com/setup
                # (the mail-setup nginx) and mail.activescott.com/api/health (Bulwark
                # webmail). The instance label says which.
                #
                # One alert rather than one per app on purpose: the regex already
                # matched every path on these hosts, so a separate webmail alert would
                # fire alongside this one for the same failure.
                #
                # This is the alert that would have caught the 2026-08-28 outage,
                # where Stalwart banned the Traefik pod's address and every request
                # became a 502 with no HTTP log line to explain it.
                expr: 'probe_success{job="blackbox_https",instance=~"https://(admin\\.)?mail\\.activescott\\.com/.*"} == 0'
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: '{{ $labels.instance }} is not answering its https probe'
                  description: >-
                    Five minutes of failures through the real ingress and TLS. Check the instance
                    label first — /api/health is the webmail, /setup is the nginx setup page, and
                    the admin host is Stalwart itself; they share a hostname but not a backend.
                    If the admin host is the one failing while the mail ports are fine, suspect
                    Stalwart having banned the ingress controller's address — it drops banned
                    addresses at TCP accept, so there is no request log to find. Confirm with the
                    "In-cluster addresses blocked" panel on the Email dashboard. If only
                    /api/health is failing, mail delivery is unaffected and nothing else will
                    alert; that is the webmail alone.
              - alert: StalwartBlockingClusterAddress
                # The direct detector for that ban, rather than its 502 symptom.
                # Bans never expire here (no *BanPeriod is set), so this does not
                # self-resolve and one occurrence is worth acting on.
                expr: 'sum(increase(loki_process_custom_stalwart_ip_blocked_cluster_total[15m])) > 0'
                for: 0m
                labels:
                  severity: critical
                annotations:
                  summary: Stalwart is refusing connections from inside the cluster
                  description: >-
                    Stalwart banned a 172.16/16 address, which is the ingress controller or
                    another cluster pod, and is dropping its connections at TCP accept. The admin
                    UI and CalDAV are down for everyone while this holds, and it will NOT expire
                    on its own. Add the range under Security > Allowed IPs and restart the pod —
                    deleting the block alone does not take effect, the running process keeps a
                    stale copy. Full write-up in apps/production/email-stalwart/README.md.
              - alert: StalwartNoInboundMail
                # willeke.com's MX is still Google; this server receives a copy through
                # a dual-delivery routing rule. That path crosses the firewall NAT
                # rule, the LoadBalancer and Stalwart, and a break anywhere in it is
                # completely silent — Google keeps delivering to its own mailbox, so
                # nobody notices mail stopped arriving HERE until they go looking.
                #
                # Retuned 2026-09-01 from 36h to 12h, against real traffic instead of
                # the ~24h of a day-old namespace the first number came from. The
                # original comment recorded "one inbound message per day"; measured
                # over the three days to 2026-09-01 the rate is ~49/day, and the
                # minimum of a rolling window stepped hourly never reached zero:
                #
                #   window   fewest messages observed
                #   4h       2
                #   6h       6
                #   8h       8
                #   12h      14
                #
                # 12h is therefore ~14x margin over the quietest half-day actually
                # seen, and it includes a weekend. It cuts detection of a silent break
                # from ~36.5h to ~12.5h. Widen it again if a holiday produces a
                # genuinely dead half-day; do not narrow below 8h without new data.
                #
                # The heartbeat clause is load-bearing: without it, Alloy or Loki
                # breaking would zero this counter and fire this alert, pointing at
                # the mail path when the mail path is fine. The absent() arm covers
                # first deployment, when the counter does not exist yet at all.
                expr: >-
                  (sum(increase(loki_process_custom_stalwart_inbound_queued_total[12h])) == 0
                  or absent(loki_process_custom_stalwart_inbound_queued_total))
                  and on() sum(increase(loki_process_custom_stalwart_heartbeat_total[1h])) > 6
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: No mail has arrived at Stalwart in 12 hours
                  description: >-
                    Nothing accepted on port 25 for 12 hours while the server is demonstrably
                    alive. Suspect the Google Workspace dual-delivery routing rule, the OPNsense
                    NAT rule for :25, or the source restriction to Google's egress ranges. Mail
                    is NOT lost — Google remains the MX and retains its own copy — but the
                    archive here is incomplete for as long as this holds.
              - alert: StalwartDeliveryFailing
                # Outbound leaves through the Google Workspace SMTP relay authenticated
                # with an app password. Google revokes every app password whenever the
                # owning account's password changes, so an unrelated password rotation
                # on scott@willeke.com stops outbound mail for every mailbox here.
                expr: 'sum(increase(loki_process_custom_stalwart_delivery_failed_total[1h])) > 5'
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: Stalwart is failing to deliver outbound mail
                  description: >-
                    More than 5 failed delivery attempts in an hour. The most likely cause is the
                    Google app password having been revoked by a password change on the account
                    that owns it. Note Stalwart falls back to UNAUTHENTICATED relay when it cannot
                    resolve the credential rather than failing loudly, so a missing secret looks
                    like a rejected one. Loki:
                    {namespace="email-stalwart"} |~ "delivery\\.(connect-error|dsn-perm-fail)".
              - alert: StalwartAuthFailures
                # 993 and 465 are deliberately internet-facing, so some noise is
                # expected and this is not a break-glass alert.
                #
                # Retuned 2026-09-01 from 20/hour to 5/hour. The baseline is still
                # exactly zero: over the 7 days to 2026-09-01, 378k log lines carried
                # 1675 (auth.success) and not one (auth.failed). Scanners are stopped
                # earlier than authentication — 237 (security.ip-blocked) and 3
                # (security.scan-ban) over the same window — which is why the
                # internet-facing ports produce no failed-auth floor to sit above.
                #
                # 5/hour rather than 20 because the failure this needs to catch first
                # is a mail client left on a stale password, not a password spray. It
                # retries every few minutes, which lands under 20/hour, and every
                # attempt feeds Stalwart's auto-ban — and *BanPeriod is unset here, so
                # the ban that follows is permanent. Catching it while it is still a
                # warning is the entire point. `for: 15m` keeps a human fumbling a
                # password a few times from firing it.
                #
                # The counter does not exist until the first failure, so this rule
                # evaluates to empty rather than 0 today. That is correct — but it also
                # means a broken selector would look identical to a quiet server. The
                # selector was verified against upstream (the id is emitted as
                # `auth.failed`) rather than inferred from the absence of data.
                expr: 'sum(increase(loki_process_custom_stalwart_auth_failed_total[1h])) > 5'
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: Repeated failed logins against Stalwart
                  description: >-
                    More than 5 failed authentications in an hour on internet-facing IMAP and
                    submission, against a baseline of zero. Most likely a mail client retrying a
                    stale password; possibly a password spray. Stalwart's auth-ban counts these
                    and bans here do not expire, so act before the source address is banned
                    permanently. Loki: {namespace="email-stalwart"} |= "(auth.failed)".
              # THE HEALTH AND META ALERTS
              - alert: StalwartNotReady
                expr: 'kube_statefulset_status_replicas_ready{namespace="email-stalwart",statefulset="stalwart"} == 0'
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: Stalwart has no ready replicas — mail is down
                  description: >-
                    Single replica, so this is a total outage of IMAP, submission and inbound
                    delivery. Inbound mail is not lost: Google is still the MX and will retry,
                    and holds its own copy regardless.
              - alert: StalwartPodRestarted
                # Restarts are a normal part of operating this server — settings
                # changes and certificate reloads both require one — so this is a
                # warning that provides context for other alerts rather than a page.
                expr: 'increase(kube_pod_container_status_restarts_total{namespace="email-stalwart",container="stalwart"}[15m]) > 0'
                labels:
                  severity: warning
                annotations:
                  summary: Stalwart restarted
                  description: >-
                    The container restarted in the last 15 minutes. Expected after a settings
                    change or a certificate reload; unexplained, it is worth checking
                    `kubectl --context nas -n email-stalwart logs stalwart-0 --previous`. Note
                    that a restart is also why `kubectl logs` can look empty for events you know
                    happened — Loki has the previous container's output, kubectl does not.
              - alert: StalwartQueueBacklog
                # From Stalwart's own exporter. queue_count is the whole MTA queue;
                # a couple of messages mid-retry is normal, a persistent pile is not.
                expr: 'queue_count{job="stalwart"} > 25'
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: 'Stalwart''s mail queue is backing up ({{ $value }} messages)'
                  description: >-
                    More than 25 messages queued for half an hour. Usually the outbound path:
                    check StalwartDeliveryFailing and the Queue panel on the Email dashboard.
              - alert: StalwartMetricsScrapeDown
                # Meta-alert. StalwartQueueBacklog is the only rule above that reads
                # the exporter, but the dashboard leans on it heavily, and its being
                # a datastore setting rather than a file in this repo means it can go
                # away without any git change to explain it.
                expr: 'up{job="stalwart"} == 0'
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: Cannot scrape Stalwart's Prometheus exporter
                  description: >-
                    Two causes look identical from here. Either the exporter was switched off in
                    the admin UI (Settings > Telemetry > Metrics > Prometheus) or lost in a
                    datastore restore — it 404s — or the basic-auth password no longer matches,
                    which 401s. Check the status code before assuming. The password lives in TWO
                    files that must hold the same value: email-stalwart/.env.secret.stalwart and
                    monitoring/prometheus/.env.secret.stalwart-metrics.
              - alert: StalwartLogFeedDown
                # The counterpart to the above for the other evidence source. Stalwart
                # reschedules an internal task every 5 minutes no matter how quiet the
                # server is, so ~12 heartbeat lines an hour is the floor. Zero means
                # the log path is broken, and while it is, StalwartNoInboundMail and
                # every other counter-based rule here is blind rather than reassuring.
                expr: 'sum(increase(loki_process_custom_stalwart_heartbeat_total[30m])) == 0 or absent(loki_process_custom_stalwart_heartbeat_total)'
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: No log lines from Stalwart for 30 minutes
                  description: >-
                    Stalwart emits a scheduling line every 5 minutes even when completely idle, so
                    silence means the log pipeline is broken, not that the server is quiet. Check
                    the Alloy pod and the loki.process "default" stages. Mail-flow alerting is
                    inoperative until this clears.
          - name: tinkerbell-scrape-health
            rules:
              # Meta-alert: catches the case where /metrics is unreachable
              # so the alerts above don't go silent during a real outage.
              - alert: TinkerbellAppMetricsDown
                expr: 'up{job="tinkerbell_app"} < 1'
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: 'Cannot scrape /metrics from tinkerbell app pod.'
                  description: 'Prometheus has been unable to scrape app.tinkerbell-prod.svc.cluster.local:3100/metrics for 10 minutes. Without this, LLM and proxy alerts will not fire. Check pod health and the /metrics route.'
          - name: edge-firewall
            # Fed by Alloy's stage.metrics counters over the edge firewall's
            # syslog feed — see alloy/helmrelease.yaml, loki.process "firewall".
            rules:
              # WAN carrier drops on the firewall's igb0. Chronic and under
              # active investigation with the ISP. Drops previously went
              # unnoticed for days because nothing was watching — this rule
              # exists to close that gap.
              # sum() matters on all three rules below: stage.metrics counters
              # inherit each log line's labels (app_name, severity, pod, ...),
              # so these are many series rather than one. Evaluating per-series
              # would let a single sporadically-logging application go flat and
              # fire the feed-down alert on its own.
              # The `or` clause covers the first drop after the series has been
              # away. max_idle_duration (168h, set in alloy/helmrelease.yaml)
              # deletes a counter untouched for a week, and an Alloy restart
              # drops it too — as of 2026-08-17 this counter has been gone
              # since the 2026-08-11 inline-switch change stopped producing
              # link-state lines. A counter that reappears holds 1, and
              # increase() needs two differing samples, so the drop that
              # resurrected the series reports nothing on its own.
              #
              # Confirmed against the 2026-08-07 flap rather than assumed. The
              # counter appeared at 15:43:45Z holding 1 and sat there for two
              # minutes; the old expression's first firing sample was 15:46:00Z,
              # immediately after the SECOND drop took it 1 -> 2. That episode
              # only alerted because a second drop followed. An isolated first
              # drop would have been silent. With the clause, firing starts at
              # 15:44:00Z.
              #
              # Backtested for false positives over 2026-08-01..08-17: the added
              # clause contributes exactly two evaluation points, both inside
              # that same 2-minute window, and nothing anywhere else — including
              # across the 2026-08-11 episode, where the series already existed
              # and the clause correctly stayed quiet.
              #
              # Known false-positive mode: a scrape gap longer than 15m with the
              # counter still nonzero afterwards is indistinguishable from a new
              # series and would fire this once. No such gap occurred in the 16
              # days examined, and a gap that long is arguably worth knowing
              # about anyway.
              #
              # WanLinkFlappingBurst below deliberately keeps the plain
              # expression: its threshold is >3 in an hour, which a single
              # first-appearance cannot reach.
              - alert: WanLinkFlapping
                expr: >-
                  sum(increase(loki_process_custom_wan_link_down_total[10m])) > 0
                  or (sum(loki_process_custom_wan_link_down_total) > 0
                  and absent(loki_process_custom_wan_link_down_total offset 15m))
                for: 0m
                labels:
                  severity: warning
                annotations:
                  summary: 'WAN link (igb0) dropped carrier on the edge firewall.'
                  description: 'One or more igb0 carrier drops in the last 10 minutes; each is a ~5-9s internet outage. Pull exact times in Grafana Explore with {host="theshield"} |= "igb0: link state changed".'
              - alert: WanLinkFlappingBurst
                expr: 'sum(increase(loki_process_custom_wan_link_down_total[1h])) > 3'
                for: 0m
                labels:
                  severity: critical
                annotations:
                  summary: 'WAN link (igb0) flapping in bursts on the edge firewall.'
                  description: 'More than 3 igb0 carrier drops in the last hour, matching the dense-burst signature seen during the ongoing ISP investigation. Capture the timestamps for the ticket.'
              # Gateway-monitor (dpinger) alarm transitions. Since 2026-08-11
              # an inline switch holds igb0's carrier up, so upstream WAN
              # outages no longer produce link-state lines and the two rules
              # above stay silent — these two are their replacement signal.
              # Thresholds on the firewall: loss 5%/8%, latency 200/500ms.
              - alert: WanGatewayDegraded
                expr: 'sum(increase(loki_process_custom_wan_gateway_alarm_total[10m])) > 0'
                for: 0m
                labels:
                  severity: warning
                annotations:
                  summary: 'WAN gateway monitor alarmed (loss/latency/down) on the edge firewall.'
                  description: 'One or more gateway-monitor alarm transitions in the last 10 minutes — upstream packet loss or outage even though igb0 carrier held. Pull details in Grafana Explore with {host="theshield"} |= "MONITOR:".'
              - alert: WanGatewayDegradedBurst
                expr: 'sum(increase(loki_process_custom_wan_gateway_alarm_total[1h])) > 3'
                for: 0m
                labels:
                  severity: critical
                annotations:
                  summary: 'WAN gateway monitor alarming repeatedly on the edge firewall.'
                  description: 'More than 3 gateway-monitor alarm transitions in the last hour, matching the dense-burst outage signature from the ongoing ISP investigation. Capture the timestamps for the ticket.'
              # Meta-alert: if the firewall stops shipping syslog, the two
              # alerts above go silent instead of firing. The firewall logs
              # continuously, so a 15m gap means the feed is broken (Alloy
              # listener, alloy-syslog Service, or the firewall's syslog
              # destination), not that the network went quiet. The absent()
              # arm covers the series vanishing entirely, which a bare == 0
              # would miss.
              - alert: FirewallSyslogFeedDown
                expr: 'sum(increase(loki_process_custom_firewall_syslog_lines_total[15m])) == 0 or absent(loki_process_custom_firewall_syslog_lines_total)'
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: 'No syslog received from the edge firewall for 15 minutes.'
                  description: 'The edge firewall log feed has stopped, so WAN flap alerting is blind until restored. Check the alloy-syslog Service, the Alloy pod, and the firewall''s Logging / Targets settings.'

    # --- Extra Scrape Configs ---
    extraScrapeConfigs: |
      # WAN reachability/latency probed from inside the LAN via
      # blackbox-exporter (see blackbox/helmrelease.yaml). External anchors
      # only: the first hop is monitored by the firewall's own gateway
      # monitor (which follows DHCP gateway changes automatically), and its
      # address does not belong in this public repo.
      - job_name: "blackbox_icmp"
        metrics_path: /probe
        params:
          module: [icmp]
        scrape_interval: 15s
        static_configs:
          - targets: ["1.1.1.1", "8.8.8.8"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115
      # End-to-end https probes of the sites this cluster serves. Probed from
      # inside the LAN, so this is not a substitute for an off-site check —
      # it cannot see an ISP or external-DNS outage. What it does cover is
      # everything between the ingress and the app that pod-level metrics
      # miss: a 502 while pods report healthy, an ingress rule pointing at
      # the wrong service, and (via probe_ssl_earliest_cert_expiry) a
      # certificate about to lapse.
      - job_name: "blackbox_https"
        metrics_path: /probe
        params:
          module: [http_2xx]
        scrape_interval: 30s
        scrape_timeout: 15s
        static_configs:
          # The site root, not a health endpoint: fernfiles.com/ops/* is denied
          # at the ingress on purpose (app-ops-ingress.yaml), so a probe there
          # would report the site down. The root is a full SSR render through
          # ingress, TLS, and the app — a stronger end-to-end signal than the
          # health route was.
          - targets:
              - "https://fernfiles.com/"
              - "https://gpupoet.com/"
              # The mail server's two web hostnames. Each has its own cert-manager
              # Certificate (deliberately separate -- see stalwart-admin-ingress.yaml
              # for why a shared SAN would restart the mail server on every renewal),
              # so each needs its own probe.
              #
              # /setup is a static nginx page, not Stalwart: it is the mail-client
              # setup instructions and the Apple .mobileconfig. Probing it covers that
              # host's certificate and the mail-setup pod together.
              - "https://mail.activescott.com/setup"
              # The admin UI answers 302 to /account at the root, which the http_2xx
              # module rejects (valid_status_codes: [200]). /robots.txt is served
              # directly by Stalwart with a 200 and needs no session, so it is the
              # stable 200 on this host. What matters here is the certificate and the
              # fact that Traefik still reaches the pod -- both of which broke on
              # 2026-08-28 when Stalwart banned the Traefik address and returned 502.
              - "https://admin.mail.activescott.com/robots.txt"
              # Bulwark webmail. /api/health is its own health route, served at the
              # root rather than under a locale prefix, so it is a stable 200 that
              # needs no session.
              #
              # This is the only monitoring the webmail has, and it is deliberately
              # end-to-end rather than a pod check: it exercises the certificate,
              # Traefik's routing (which is where every failure in this phase
              # actually was), and the pod, in one probe. A dead webmail is
              # otherwise invisible -- mail keeps flowing and every other alert
              # stays green, so the first symptom would be a person trying to read
              # their mail.
              - "https://mail.activescott.com/api/health"
              # Cloudflare-proxied domains pointed at k8s.activescott.com. These
              # sit behind Cloudflare's SSL/TLS encryption mode, which is a
              # dashboard-only setting this repo does not manage (see
              # tinkerbellbot.com.yaml).
              #
              # Broke 2026-08-30 on tinkerbellbot.com: its mode was "Flexible"
              # (Cloudflare talks plain HTTP to the origin) and had sat that way,
              # untouched, for 594 days -- harmless until ab54e12 ("redirect HTTP
              # to HTTPS for every ingress in the cluster", 2026-08-28) made
              # Traefik redirect every :80 request to :443. After that, Cloudflare's
              # plaintext request to the origin got redirected to https, Cloudflare
              # relayed that redirect to the browser, and the cycle repeated
              # forever (ERR_TOO_MANY_REDIRECTS). Cloudflare's "Automatic SSL/TLS"
              # mode would have caught the drift, but its rescan cadence is weeks
              # (next one wasn't due until Sep 3), so it did not save this.
              #
              # http_2xx follows redirects and fails probe_success after 10 hops,
              # so this alerts on that class of bug the same way it alerts on any
              # other site-down failure -- no special-casing needed.
              - "https://ramblefeed.com/"
              - "https://tinkerbellbot.com/"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115
      # Edge firewall host metrics (node_exporter plugin). CPU, memory,
      # per-interface traffic and error counters — correlation context for
      # the WAN investigation.
      - job_name: "firewall_node"
        scrape_interval: 30s
        static_configs:
          - targets: ["10.1.111.1:9100"]
      - job_name: "gpupoet_cache_metrics"
        scrape_interval: 10s
        scrape_timeout: 10s
        metrics_path: "/ops/metrics"
        static_configs:
          - targets: ["gpupoet.com"]
      - job_name: "gpu_poet_collector"
        scrape_interval: 30s
        scrape_timeout: 10s
        metrics_path: "/metrics"
        static_configs:
          - targets: ["gpu-poet-collector.gpupoet-prod.svc.cluster.local:9100"]
      # Fernfiles app metrics: unique active users over 1/7/30-day rolling
      # windows (fernfiles_active_users) plus Node process internals. Must go
      # over the ClusterIP service — the app's operator routes live under /ops,
      # which app-ops-ingress.yaml answers 403 for through fernfiles.com. That
      # also means these counts keep arriving when ingress or TLS is the thing
      # that broke.
      - job_name: "fernfiles_app"
        scrape_interval: 30s
        scrape_timeout: 10s
        metrics_path: "/ops/metrics"
        static_configs:
          - targets: ["app.fernfiles-prod.svc.cluster.local:3300"]
      - job_name: "tinkerbell_app"
        scrape_interval: 30s
        scrape_timeout: 10s
        metrics_path: "/metrics"
        static_configs:
          - targets: ["app.tinkerbell-prod.svc.cluster.local:3100"]
      # Certificates that Stalwart actually SERVES on the mail ports, via a TLS
      # handshake against each one. See the mail_implicit_tls module in
      # blackbox/helmrelease.yaml for why this is not redundant with cert-manager's
      # own expiry metric: cert-manager reports on the Certificate object, and the
      # failure that happens here is Stalwart still serving the previous certificate
      # after cert-manager renewed it.
      #
      # ClusterIP Service DNS rather than mail.activescott.com, so the probe does not
      # depend on the firewall hairpinning a LAN connection back to its own WAN
      # address. The module pins SNI to mail.activescott.com so verification still
      # matches the certificate. Consequence worth stating plainly: this proves what
      # the server serves, NOT that the ports answer from the internet.
      #
      # 465 and 993 are both here even though one Secret backs both listeners. They
      # are separate listeners reading the same file, and the point of the check is
      # that the running process picked the file up -- which is per-listener state,
      # not per-file state.
      - job_name: "blackbox_mail_tls"
        metrics_path: /probe
        params:
          module: [mail_implicit_tls]
        scrape_interval: 60s
        scrape_timeout: 15s
        static_configs:
          - targets:
              - "stalwart.email-stalwart.svc.cluster.local:465"
              - "stalwart.email-stalwart.svc.cluster.local:993"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115
      # Stalwart's own exporter: queue depth, per-protocol connection counts,
      # delivery outcomes, spam classification, auth results and latency histograms.
      #
      # Metric names carry no prefix and no labels -- Stalwart derives them from its
      # internal event ids with non-alphanumerics replaced by underscores, so
      # `queue.count` is exported as `queue_count`. Several are generic enough to
      # collide with other exporters (`http_request_time`, `auth_failed`), so every
      # query against these MUST qualify with {job="stalwart"}.
      #
      # Enabled by hand at Settings > Telemetry > Metrics > Prometheus in the admin
      # UI, because Stalwart keeps its configuration in its datastore rather than in
      # any file this repo controls. Two consequences:
      #   - It is not restored by redeploying this repo. If the datastore is rebuilt
      #     or rolled back, the endpoint 404s and this job reports up=0.
      #   - Saving it in the UI does not apply it. Stalwart builds its configuration
      #     at startup, so the endpoint keeps 404ing until the pod restarts.
      #
      # Authenticated because the exporter shares an HTTP listener with the admin UI,
      # which is published to the internet -- see email-stalwart/stalwart-metrics-ingress.yaml,
      # which blocks the path at the edge as the second layer. The scrape below goes
      # to the ClusterIP and never traverses Traefik, so that block does not affect it.
      - job_name: "stalwart"
        scrape_interval: 30s
        scrape_timeout: 10s
        metrics_path: "/metrics/prometheus"
        basic_auth:
          username: prometheus
          # File, not an inline password: extraScrapeConfigs renders into a ConfigMap,
          # which is not a Secret. Mounted by server.extraSecretMounts above.
          password_file: /etc/prometheus/secrets/stalwart_metrics_password
        static_configs:
          - targets: ["stalwart-admin.email-stalwart.svc.cluster.local:8080"]
      # No job here for the Crossplane providers on purpose. Their :8080 metrics
      # are ALREADY collected by the chart's built-in `kubernetes-pods` job, and
      # adding a second scrape of the same endpoint would double every counter
      # -- which would silently halve the effective thresholds of the
      # crossplane-cloudflare-api alerts below rather than failing visibly.
      # Confirmed with:
      #   upjet_resource_ext_api_duration_count -> job="kubernetes-pods"
      - job_name: "prometheus self scrape"
        static_configs:
          - targets: ["localhost:9090"]

    # Without this sidecar, scrape and alert-rule edits silently fail to take
    # effect: Helm only rolls pods on Deployment-spec changes, not on child
    # ConfigMap content changes, so the rendered ConfigMap drifts ahead of
    # the long-running pod's in-memory config until something forces a
    # restart. Burned us on 2026-05-17 — a payment-error alert PR appeared
    # to deploy successfully but didn't actually arm until /-/reload was hit
    # manually.
    configmapReload:
      prometheus:
        enabled: true

    # --- Sub-charts ---
    kube-state-metrics:
      enabled: true

    prometheus-node-exporter:
      enabled: true

    prometheus-pushgateway:
      enabled: false
