# NOTE: We use ingress here rather than a simple service so we can route traffic
#   based on hostname and not only IP. Ingress also has the advantage of being
#   able to serve TLS.
#
# Read-only. An IngressRoute rather than an Ingress because the routes match on the method, which
# an Ingress cannot. A request no route matches gets a 404 from Traefik and never reaches
# Prometheus, so the read credential cannot reach the lifecycle endpoints (/-/reload, /-/quit),
# the admin API or /api/v1/write. prometheus-remote-write-ingress.yaml owns POST /api/v1/write
# with its own credentials; if that router drops, the path now 404s here instead of falling
# through to the read credential.
#
# GET /-/ready stays open because the Prometheus UI polls it and refuses to render the query page
# without a 200. POST is allowed on /api/v1/labels and /api/v1/series only, because the UI's
# PromQL autocomplete (codemirror-promql) sends those as POST. The UI runs queries with GET.
#
# Grafana's Prometheus datasource comes through here too, with its own user
# (../grafana/datasource-auth-middleware.yaml) and GET only. Its requests carry
# X-Read-Client: grafana, which picks the first route; the explicit priority puts that route
# ahead of the others, whose priority is their rule's length. The header only selects which
# credential is checked, so sending it without Grafana's password gets a 401.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      priority: 1000
      match: >-
        Host(`prometheus.activescott.com`) && Header(`X-Read-Client`, `grafana`) && Method(`GET`)
        && PathPrefix(`/api/v1/`) && !(PathPrefix(`/api/v1/admin`) || Path(`/api/v1/write`))
      middlewares:
        - name: grafana-datasource-auth
      services:
        - name: prometheus-server
          port: 80
    - kind: Rule
      match: >-
        Host(`prometheus.activescott.com`) && (Method(`GET`) || Method(`HEAD`))
        && (Path(`/-/ready`) || !(PathPrefix(`/-/`) || PathPrefix(`/api/v1/admin`) || Path(`/api/v1/write`)))
      middlewares:
        - name: prometheus-basic-auth
      services:
        # Service created by the prometheus Helm chart
        - name: prometheus-server
          port: 80
    - kind: Rule
      match: >-
        Host(`prometheus.activescott.com`) && Method(`POST`)
        && (Path(`/api/v1/labels`) || Path(`/api/v1/series`))
      middlewares:
        - name: prometheus-basic-auth
      services:
        - name: prometheus-server
          port: 80
  tls:
    # must match certificate.yaml's secretName
    secretName: prometheus-activescott-com-tls
