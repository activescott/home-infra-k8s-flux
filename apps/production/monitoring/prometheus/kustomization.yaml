resources:
  - ./certificate.yaml
  - ./prometheus-ingress.yaml
  - ./prometheus-pv.yaml
  - ./helmrelease.yaml
  - ./basic-auth-middleware.yaml
  - ./prometheus-remote-write-ingress.yaml
  - ./remote-write-middleware.yaml

secretGenerator:
  - name: alertmanager-secrets
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.alertmanager.encrypted
  - name: prometheus-basic-auth
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.prometheus-basic-auth.encrypted
  # Mounted into the Prometheus server pod (server.extraSecretMounts in
  # helmrelease.yaml) so the stalwart scrape job reads the password from a file
  # instead of carrying it inline in the rendered ConfigMap, which is not a Secret
  # and is readable by anyone who can get the Prometheus config. Same value as
  # STALWART_METRICS_PASSWORD in apps/production/email-stalwart/.env.secret.stalwart.
  - name: stalwart-metrics-auth
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.stalwart-metrics.encrypted
  # htpasswd lines for the remote-write senders, one per user (remote-write-middleware.yaml).
  # Written by scripts/add-ingest-user.mts, which prints the new user's password once and keeps
  # no copy. A line whose hash is too short to be bcrypt is a placeholder: Traefik rejects it
  # for any password.
  #
  # A file and not an env file because a dotenv value cannot hold the second line. The
  # generator key, not the filename, selects the SOPS format kustomize-controller decrypts
  # with, so this must stay `users=` (no extension) to be read as binary.
  - name: prometheus-remote-write-auth
    options:
      disableNameSuffixHash: true
    files:
      - users=prometheus-remote-write-users.public-key-encrypted.encrypted
