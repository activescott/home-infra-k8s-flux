resources:
  - ./certificate.yaml
  - ./prometheus-ingress.yaml
  - ./prometheus-pv.yaml
  - ./helmrelease.yaml
  - ./basic-auth-middleware.yaml
  - ./prometheus-remote-write-ingress.yaml
  - ./remote-write-middleware.yaml

secretGenerator:
  - name: alertmanager-secrets
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.alertmanager.encrypted
  - name: prometheus-basic-auth
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.prometheus-basic-auth.encrypted
  # Mounted into the Prometheus server pod (server.extraSecretMounts in
  # helmrelease.yaml) so the stalwart scrape job reads the password from a file
  # instead of carrying it inline in the rendered ConfigMap, which is not a Secret
  # and is readable by anyone who can get the Prometheus config. Same value as
  # STALWART_METRICS_PASSWORD in apps/production/email-stalwart/.env.secret.stalwart.
  - name: stalwart-metrics-auth
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.stalwart-metrics.encrypted
  # Bearer token for the openclaw scrape job, same reasoning as above. Same value as
  # openclaw_gateway_token in apps/production/olya/.env.secret.olya.encrypted, which the
  # gateway reads as OPENCLAW_GATEWAY_TOKEN.
  - name: openclaw-metrics-auth
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.openclaw-metrics.encrypted
  # Bearer token for Alertmanager's olya-hook webhook receiver. Same value as
  # openclaw_hooks_token in
  # apps/production/olya/.env.secret.olya-hooks.public-key-encrypted.encrypted, which the
  # gateway reads as OPENCLAW_HOOKS_TOKEN. The `public-key-encrypted` part of the name marks a
  # secret that was encrypted straight to the age recipient and has no plaintext anywhere; see
  # apps/production/olya/README.md#alertmanager-hook-token.
  - name: alertmanager-olya-hook
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.alertmanager-olya-hook.public-key-encrypted.encrypted
  # htpasswd line for the debeth user on the remote-write path (remote-write-middleware.yaml).
  # Written by scripts/create-debeth-remote-write-auth.mts, which prints the password once for
  # debeth and keeps no copy. Until that has run, the committed file holds a hash too short to
  # be bcrypt, which Traefik rejects for any password, so the path denies every write.
  - name: prometheus-remote-write-auth
    options:
      disableNameSuffixHash: true
    envs:
      - .env.secret.prometheus-remote-write-auth.public-key-encrypted.encrypted
