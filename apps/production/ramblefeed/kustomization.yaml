resources:
  - namespace.yaml
  - db-pv.yaml
  - ../../base/ramblefeed/
  - app-ingress-certificate.yaml
  - db-networkpolicy.yaml
  - ../../../infrastructure/prod/configs/ghcr-pull-secret/
patches:
  - path: patch-app-deployment.yaml
    target:
      kind: Deployment
      name: app
  - path: patch-app-ingress.yaml
    target:
      kind: Ingress
      name: app-ingress
  - path: patch-db-statefulset.yaml
    target:
      kind: StatefulSet
      name: db
namespace: ramblefeed-prod
secretGenerator:
  # db
  - name: db-creds
    envs:
      - .env.secret.db.encrypted
  # app
  - name: app-creds
    envs:
      - .env.secret.app.encrypted
  # Signs the short-lived cookie that binds a WebAuthn ceremony to the browser
  # it started in; the app refuses to start in production without it
  # (activescott/ramblefeed#113). `public-key-encrypted` because nobody ever
  # saw it: it was piped straight into sops against the age recipient and never
  # written to disk in the clear, so onepassword-secrets.mts skips it rather
  # than reporting a missing backup. Replacing the file only drops the
  # challenges in flight, which live seconds.
  - name: passkey-challenge
    envs:
      - .env.secret.passkey-challenge.public-key-encrypted.encrypted
# the images tag: https://kubectl.docs.kubernetes.io/references/kustomize/builtins/#_imagetagtransformer_
images:
  - name: ramblefeed-image-app
    newName: ghcr.io/activescott/ramblefeed/app # {"$imagepolicy": "flux-system:policy-ramblefeed-app:name"}
    newTag: v0.25.1 # {"$imagepolicy": "flux-system:policy-ramblefeed-app:tag"}
  - name: ramblefeed-image-db
    newName: postgres
    newTag: "17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675"
