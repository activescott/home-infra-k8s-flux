apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fernfiles-runners
  namespace: arc-runners
spec:
  interval: 1h
  dependsOn:
    - name: arc-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: ">=0.14.0 <0.15.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
      interval: 24h
  values:
    githubConfigUrl: https://github.com/activescott/fernfiles
    githubConfigSecret: fernfiles-github-token
    runnerScaleSetName: fernfiles-runners
    minRunners: 0
    # Sized against the single nas node (20 CPU / 125 GiB). fernfiles' e2e
    # job does nearly all of its work in the dind sidecar: three image
    # builds, a kind cluster running the app, and Playwright. Each pod
    # requests 1.5 CPU / 4 GiB (runner 500m / 1Gi, dind 1 / 3Gi), and dind
    # may burst to 6 CPU / 12Gi, so at maxRunners: 4:
    #   - requests: 6 CPU (30%) / 16 GiB (13%)
    #   - every dind at its limit: 24 CPU, more than the node has, shared in
    #     proportion to requests so other workloads keep theirs
    # Lowered from 6 because a Dependabot burst (11-16 PRs within minutes)
    # filled all 6 with validate, prod-image and e2e at once. On 2026-10-16,
    # -24 and -25, 42 of the 45 e2e jobs that overlapped 7 or more other e2e
    # or prod-image jobs hit their 45-minute timeout
    # (activescott/fernfiles#373). A job waiting for
    # a runner does not use up its timeout; a job sharing the node with five
    # others does, and the work it did is lost when it is cancelled.
    maxRunners: 4
    # Annotations on the listener pod so the existing kubernetes-pods
    # Prometheus scrape config picks up gha_* metrics from :8080/metrics
    # (also requires the controller chart's `metrics:` block to be enabled
    # — see controller/helmrelease.yaml — and listenerMetrics below to
    # define which metrics this listener emits).
    # When providing listenerTemplate, spec.containers is required by the
    # chart's AutoscalingListener CRD validation. A container named
    # "listener" is appended onto the chart-generated default; an empty
    # block keeps the defaults while letting us add metadata.annotations.
    listenerTemplate:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
          prometheus.io/path: "/metrics"
      spec:
        containers:
          - name: listener
    listenerMetrics:
      counters:
        gha_started_jobs_total:
          labels: ["repository", "organization", "enterprise", "job_name", "event_name", "job_workflow_ref", "job_workflow_name", "job_workflow_target"]
        gha_completed_jobs_total:
          labels: ["repository", "organization", "enterprise", "job_name", "event_name", "job_result", "job_workflow_ref", "job_workflow_name", "job_workflow_target"]
      gauges:
        gha_assigned_jobs:
          labels: ["name", "namespace", "repository", "organization", "enterprise"]
        gha_running_jobs:
          labels: ["name", "namespace", "repository", "organization", "enterprise"]
        gha_registered_runners:
          labels: ["name", "namespace", "repository", "organization", "enterprise"]
        gha_busy_runners:
          labels: ["name", "namespace", "repository", "organization", "enterprise"]
        gha_min_runners:
          labels: ["name", "namespace", "repository", "organization", "enterprise"]
        gha_max_runners:
          labels: ["name", "namespace", "repository", "organization", "enterprise"]
        gha_desired_runners:
          labels: ["name", "namespace", "repository", "organization", "enterprise"]
        gha_idle_runners:
          labels: ["name", "namespace", "repository", "organization", "enterprise"]
      histograms:
        gha_job_startup_duration_seconds:
          labels: ["repository", "organization", "enterprise", "job_name", "event_name", "job_workflow_ref", "job_workflow_name", "job_workflow_target"]
        gha_job_execution_duration_seconds:
          labels: ["repository", "organization", "enterprise", "job_name", "event_name", "job_result", "job_workflow_ref", "job_workflow_name", "job_workflow_target"]
    # containerMode is deliberately unset. With `containerMode.type: dind`
    # the chart renders its own dind sidecar and drops any `dind` entry
    # given here (gha-runner-scale-set 0.13.1 through 0.14.2), so dockerd
    # args cannot be overridden. The pod below is the chart's dind-mode
    # spec written out, which is the chart's documented way to customize
    # dind (values.yaml: "If any customization is required for dind ...
    # containerMode should remain empty"). On a chart upgrade, re-diff it
    # against `helm template` with `containerMode.type: dind`.
    template:
      spec:
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/actions/actions-runner:2.337.0
            command: ["cp"]
            args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          # Override the chart-injected dind sidecar so dockerd uses the
          # systemd cgroup driver. Without this, kind clusters created
          # inside this dind cannot reach kubelet=Ready (cgroup-delegation
          # mismatch between dockerd's default cgroupfs and the kind
          # node's systemd PID 1). See ramblefeed
          # specs/migrate-dev-to-kind/plan.md "Phase B execution detail"
          # and this repo's docs/specs/gha-runner-self-hosted/summary.md
          # "What would actually break the deadlock".
          # The systemd cgroup driver is deliberately not set: docker:dind
          # runs no systemd, so runc fails every container start when it's
          # enabled. See activescott/home-infra-k8s-flux#304.
          #
          # Args here REPLACE the chart default; defaults come from the
          # gha-runner-scale-set chart's _helpers.tpl. Keep the `--host`
          # and `--group` flags the chart relied on.
          - name: dind
            image: docker:dind
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
              # Pod network MTU is 1450 (flannel); match it so nested containers do not rely on PMTUD.
              - --mtu=1450
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command:
                  - docker
                  - info
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            # Without a request this container got the smallest CPU share the
            # kernel gives, so on a busy node every build, kind node and
            # Playwright run in it was starved by pods that do request CPU
            # (activescott/fernfiles#373). The limit stops one job's cold
            # image build from taking the whole node.
            resources:
              requests:
                cpu: "1"
                memory: "3Gi"
              limits:
                cpu: "6"
                memory: "12Gi"
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.337.0
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "4"
                memory: "6Gi"
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
        volumes:
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
          - name: work
            emptyDir: {}
