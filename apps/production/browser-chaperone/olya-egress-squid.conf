# The assistant's forwarding proxy, the network chaperone (activescott/activeassistant#316 and
# browser-chaperone#18, part of #289). It logs each connection by host, allows the standing hosts
# below, and asks the approval app about every other host. In report-only mode, which is how it
# runs now, a host with no approval raises a request and logs a would-deny but is still let
# through, so it blocks nothing a NetworkPolicy does not already block.
#
# Separate from squid.conf on purpose: that one admits only the browser pod and should stay that
# way. This one admits only olya-0, which reaches it through HTTP_PROXY and HTTPS_PROXY set in
# apps/production/olya. Nothing stops her from ignoring those yet; the default-deny egress that
# makes this the only way out is #317.
#
# The approval check is an external_acl_type helper that asks the approval app about each host,
# which is why this is Squid and why it runs in this namespace next to the app. The helper ships
# in the image with Squid; see browser-chaperone's docs/network-proxy.md for the lines below that
# start it.

http_port 3128
visible_hostname olya-egress-proxy

# One line per connection, by host, to stdout so it lands in Loki:
#   {namespace="browser-chaperone-prod", app="olya-egress-proxy"}
#
# Squid writes the line when the connection CLOSES, so a CONNECT tunnel that stays open for an
# hour is logged an hour late. `start` is when it opened (epoch seconds), `time` when it was
# logged. `pod` is the reverse DNS of `client`, which CoreDNS answers with the pod name; it is
# the address when the lookup fails.
#
# Host and port only. No path or query, no headers, no bodies: a plain-HTTP URL or header can
# carry a token, and under CONNECT there is nothing else to log anyway.
#
# `chaperone` is what the approval check made of the connection: allowed, would_deny, denied or
# unchecked (the approval app did not answer), and `-` for a standing host, which is never asked
# about. The helper's own log, with the reason and the request id, is on stderr:
#   {namespace="browser-chaperone-prod", app="olya-egress-proxy"} |= "would deny"
logformat egress time=%{%Y-%m-%dT%H:%M:%SZ}tg start=%tS duration_ms=%tr client=%>a pod=%>A method=%rm host=%>rd port=%>rP status=%>Hs result=%Ss bytes_out=%>st bytes_in=%<st chaperone=%ea
access_log stdio:/dev/stdout logformat=egress
cache_log stdio:/dev/stderr

# A pass-through, not a cache. Nothing is kept between requests.
cache deny all
cache_mem 8 MB

# Runs as the image's non-root user on a read-only root filesystem: no pid file, and the only
# writable path is the /tmp emptyDir. The pinger needs setuid root and is not wanted anyway.
pid_filename none
coredump_dir /tmp
pinger_enable off

# Nothing on a private network, the cluster included. Her own NetworkPolicy already drops these
# when she connects directly, and this proxy's policy drops them too; denying here as well turns
# a silent timeout into a logged 403. In-cluster names are in her NO_PROXY and never get here.
acl private_dst dst 10.0.0.0/8
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.168.0.0/16
acl private_dst dst 100.64.0.0/10

# The standing hosts: allowed here, ahead of the approval check, so no grant, revocation or
# outage of the approval app can cut her off from them (browser-chaperone#18). Exact hosts, no
# subdomains. Seeded from what olya-0 reached through this proxy in the day after
# home-infra-k8s-flux#224; the table is on the PR that added this list.
#
# The model providers, and the Claude CLI's own plumbing: its claude.ai connectors and updates.
acl standing_hosts dstdomain api.anthropic.com mcp-proxy.anthropic.com downloads.claude.ai
acl standing_hosts dstdomain openrouter.ai
# Her channels. Slack's Web API goes through the Slack relay; Socket Mode's websocket does not.
acl standing_hosts dstdomain api.telegram.org wss-primary.slack.com
# GitHub, for git over SSH and HTTPS, gh, and the CI logs she reads.
acl standing_hosts dstdomain github.com api.github.com codeload.github.com
acl standing_hosts dstdomain raw.githubusercontent.com release-assets.githubusercontent.com
acl standing_hosts dstdomain results-receiver.actions.githubusercontent.com
# install-plugins fetches from npm on every boot, when nobody is there to approve it
# (activescott/activeassistant#289).
acl standing_hosts dstdomain registry.npmjs.org
# Her web search and fetch: openclaw.json turns the built-in web tools off in favour of it.
acl standing_hosts dstdomain tinkerbellbot.com
# The approval app's public page, which every refusal points her at.
acl standing_hosts dstdomain chaperone.pingpoet.com

# The approval check. ttl=0 and negative_ttl=0 so nothing is cached and a revocation lands on the
# next connection. concurrency is required: the helper reads the first value of each line as its
# channel. What a miss does is NETWORK_CHAPERONE_MODE in olya-egress-proxy-deployment.yaml, not
# anything here.
external_acl_type network_chaperone ttl=0 negative_ttl=0 children-max=2 children-startup=1 concurrency=50 %>rd %>rP %>rm /usr/local/bin/node /app/packages/network-proxy/dist/index.js
acl network_chaperone external network_chaperone
# The 403 page, naming the host, the request and where to approve it. The template is in the
# image. deny_info applies only when its ACL is the last one on the line that denied, which is
# why the check is `deny !network_chaperone` rather than an allow followed by `deny all`.
deny_info ERR_NETWORK_CHAPERONE network_chaperone

# No port restriction, unlike squid.conf: she reaches any port today, and git over SSH arrives
# here as CONNECT github.com:22 (scripts/ssh-proxy-connect.mts in apps/production/olya).
http_access deny to_localhost
http_access deny to_linklocal
http_access deny private_dst
http_access allow standing_hosts
http_access deny !network_chaperone
http_access allow all

# Do not tell the destination the pod's address, or which Squid this is.
forwarded_for delete
httpd_suppress_version_string on

# The default is 30 seconds, which holds up every rollout for no benefit.
shutdown_lifetime 5 seconds
