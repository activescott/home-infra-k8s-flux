# The assistant's forwarding proxy, the network chaperone's first step
# (activescott/activeassistant#316, part of #289). It forwards everything and logs each
# connection by host. It blocks nothing a NetworkPolicy does not already block.
#
# Separate from squid.conf on purpose: that one admits only the browser pod and should stay that
# way. This one admits only olya-0, which reaches it through HTTP_PROXY and HTTPS_PROXY set in
# apps/production/olya. Nothing stops her from ignoring those yet; the default-deny egress that
# makes this the only way out is #317.
#
# The approval check (browser-chaperone#18) goes here as an external_acl_type helper that asks
# the approval app about each host, which is why this is Squid and why it runs in this namespace
# next to the app.

http_port 3128
visible_hostname olya-egress-proxy

# One line per connection, by host, to stdout so it lands in Loki:
#   {namespace="browser-chaperone-prod", app="olya-egress-proxy"}
#
# Squid writes the line when the connection CLOSES, so a CONNECT tunnel that stays open for an
# hour is logged an hour late. `start` is when it opened (epoch seconds), `time` when it was
# logged. `pod` is the reverse DNS of `client`, which CoreDNS answers with the pod name; it is
# the address when the lookup fails.
#
# Host and port only. No path or query, no headers, no bodies: a plain-HTTP URL or header can
# carry a token, and under CONNECT there is nothing else to log anyway.
logformat egress time=%{%Y-%m-%dT%H:%M:%SZ}tg start=%tS duration_ms=%tr client=%>a pod=%>A method=%rm host=%>rd port=%>rP status=%>Hs result=%Ss bytes_out=%>st bytes_in=%<st
access_log stdio:/dev/stdout logformat=egress
cache_log stdio:/dev/stderr

# A pass-through, not a cache. Nothing is kept between requests.
cache deny all
cache_mem 8 MB

# Runs as the image's non-root user on a read-only root filesystem: no pid file, and the only
# writable path is the /tmp emptyDir. The pinger needs setuid root and is not wanted anyway.
pid_filename none
coredump_dir /tmp
pinger_enable off

# Nothing on a private network, the cluster included. Her own NetworkPolicy already drops these
# when she connects directly, and this proxy's policy drops them too; denying here as well turns
# a silent timeout into a logged 403. In-cluster names are in her NO_PROXY and never get here.
acl private_dst dst 10.0.0.0/8
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.168.0.0/16
acl private_dst dst 100.64.0.0/10

# No port restriction, unlike squid.conf: she reaches any port today, and git over SSH arrives
# here as CONNECT github.com:22 (scripts/ssh-proxy-connect.mts in apps/production/olya).
http_access deny to_localhost
http_access deny to_linklocal
http_access deny private_dst
http_access allow all

# Do not tell the destination the pod's address, or which Squid this is.
forwarded_for delete
httpd_suppress_version_string on

# The default is 30 seconds, which holds up every rollout for no benefit.
shutdown_lifetime 5 seconds
