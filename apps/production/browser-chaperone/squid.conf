# The browser service's only route out (activescott/activeassistant#196). It forwards and it
# logs. It does NOT check the allowlist: under CONNECT it sees a host and a port and nothing
# else, so it cannot tell a page load from a subresource. The browser service is the gate on
# page loads (Scott's decision on #191, 2026-09-20); this log is where a mistake there shows up.
#
# The browser reaches this as http://egress-proxy:3128, a plain forwarding proxy with no
# authentication. The NetworkPolicy is what decides who may use it, not a credential.

http_port 3128
visible_hostname egress-proxy

# One line per connection, by host, to stdout so it lands in Loki:
#   {namespace="browser-chaperone-prod", app="egress-proxy"}
#
# Squid writes the line when the connection CLOSES, so a CONNECT tunnel that stays open for an
# hour is logged an hour late. `start` is when it opened (epoch seconds), `time` when it was
# logged. For CONNECT, `host` and `port` are all there is: no path, no redirect, no page.
logformat egress time=%{%Y-%m-%dT%H:%M:%SZ}tg start=%tS duration_ms=%tr client=%>a method=%rm host=%>rd port=%>rP status=%>Hs result=%Ss bytes=%<st
access_log stdio:/dev/stdout logformat=egress
cache_log stdio:/dev/stderr

# A pass-through, not a cache. Nothing is kept between requests.
cache deny all
cache_mem 8 MB

# Runs as the image's non-root user on a read-only root filesystem: no pid file, and the only
# writable path is the /tmp emptyDir. The pinger needs setuid root and is not wanted anyway.
pid_filename none
coredump_dir /tmp
pinger_enable off

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

# Nothing on a private network, the cluster included. The NetworkPolicy already drops these;
# denying here as well turns a silent timeout into a logged 403.
acl private_dst dst 10.0.0.0/8
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.168.0.0/16
acl private_dst dst 100.64.0.0/10

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_localhost
http_access deny to_linklocal
http_access deny private_dst
http_access allow all

# Do not tell the destination the pod's address, or which Squid this is.
forwarded_for delete
httpd_suppress_version_string on

# The default is 30 seconds, which holds up every rollout for no benefit.
shutdown_lifetime 5 seconds
