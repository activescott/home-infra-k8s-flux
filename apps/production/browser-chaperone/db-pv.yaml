apiVersion: v1
kind: PersistentVolume
metadata:
  name: browser-chaperone-prod-db-pv-data
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /mnt/thedatapool/app-data/browser-chaperone/prod/db-data
    type: DirectoryOrCreate
