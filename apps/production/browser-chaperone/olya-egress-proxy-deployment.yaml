# Squid, as the assistant's forwarding proxy. See olya-egress-squid.conf for what it does and
# does not do. Same shape as egress-proxy-deployment.yaml. The image is browser-chaperone's
# network-proxy, which is the same Squid with the approval check's helper in it
# (browser-chaperone#18).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: olya-egress-proxy
  namespace: browser-chaperone-prod
spec:
  # Two replicas so a restart or a rollout leaves the other one serving; nas1 is a single-node
  # cluster, so this is not node-loss protection.
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app: olya-egress-proxy
  template:
    metadata:
      labels:
        # Alloy promotes this to the Loki `app` label, so the connection log is
        # {namespace="browser-chaperone-prod", app="olya-egress-proxy"}.
        app: olya-egress-proxy
    spec:
      # ScheduleAnyway, not DoNotSchedule: on this single-node cluster a hard requirement would
      # leave the second replica Pending forever. If a second node ever joins, this spreads them.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: olya-egress-proxy
      enableServiceLinks: false
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: github-container-registry-secret
      securityContext:
        # The image's own non-root user (`_daemon_`), which owns its writable directories.
        runAsUser: 584792
        runAsGroup: 584792
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          image: browser-chaperone-image-network-proxy
          # The ubuntu/squid entrypoint is pebble, which runs a script that tails log files into
          # stdout. squid.conf writes the log to stdout directly, so squid runs as PID 1
          # instead. -N keeps it in the foreground; there is no cache_dir, so no -z step. The
          # network-proxy image's entrypoint already does this; the command stays so the
          # config path is visible here.
          command:
            - /usr/sbin/squid-gnutls
            - -N
            - -f
            - /etc/squid-egress/squid.conf
          # Squid passes its environment to the helper, which is where these are read.
          env:
            # report_only: a host with no approval raises a request and logs a would-deny, and
            # the connection still goes through. enforce refuses it with a 403. Enforce once the
            # would-deny log is quiet (browser-chaperone#18).
            - name: NETWORK_CHAPERONE_MODE
              value: report_only
            - name: CHAPERONE_URL
              value: http://app:3400
            # Named in every refusal, for the operator who approves it.
            - name: REQUESTS_URL
              value: https://chaperone.pingpoet.com/requests
          envFrom:
            - secretRef:
                name: internal-api-token
          ports:
            - name: proxy
              containerPort: 3128
          volumeMounts:
            - name: config
              mountPath: /etc/squid-egress
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # CPU limit is high so the proxy is never throttled but still bounded on a single node.
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: proxy
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: olya-egress-proxy-config
        - name: tmp
          emptyDir: {}
