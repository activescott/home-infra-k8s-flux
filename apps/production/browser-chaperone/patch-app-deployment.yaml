# Enforce mode (browser-chaperone#89, ping-poet/dreamwright#108) fails closed
# when the app does not answer within 5s, so a rollout or a restart cannot
# leave it unreachable: two replicas, a PDB (app-pdb.yaml) and no drop in
# capacity while a new pod starts. The sign-in challenge the app used to hold
# in process memory now lives in Postgres instead (packages/web-app's
# app/lib/auth.server.ts), so a verify reaching the other replica still finds it.
- op: replace
  path: /spec/replicas
  value: 2
- op: add
  path: /spec/strategy
  value:
    rollingUpdate:
      maxUnavailable: 0
- op: add
  path: /spec/template/spec/imagePullSecrets
  value:
    - name: github-container-registry-secret
# The image sets no NODE_ENV. Production is what makes the app refuse to start without
# SMTP credentials and INTERNAL_API_TOKEN rather than run unable to sign anyone in.
- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: NODE_ENV
      value: production
    # email-relay's sender map gives this exact address to browserchaperone@relay.local.
    - name: FROM_EMAIL
      value: browser-chaperone-noreply@pingpoet.com
    # Kept off FROM_EMAIL so the operator's filter on that address, which catches request
    # notifications, doesn't also catch the sign-in link (browser-chaperone#79).
    # email-relay's sender map gives this address to the same browserchaperone@relay.local.
    - name: SIGNIN_FROM_EMAIL
      value: chaperone-signin@pingpoet.com
    # The request-waiting email links back here (browser-chaperone#16).
    - name: APP_URL
      value: https://chaperone.pingpoet.com
    # The request-waiting Slack post goes through the relay (browser-chaperone#23).
    - name: SLACK_RELAY_URL
      value: http://slack-relay:3600
    # The one key the app gets from the relay's Secret: the real Slack tokens stay out of this
    # pod. Optional, and while it is missing the app logs a warning and posts nothing.
    - name: RELAY_NOTIFY_TOKEN
      valueFrom:
        secretKeyRef:
          name: slack-relay-creds
          key: RELAY_NOTIFY_TOKEN
          optional: true
    # The standing send and receive grants on an email_address, applied at start
    # (browser-chaperone#39): Olya can always mail an operator and read what one sends her.
    - name: OPERATOR_EMAIL_ADDRESSES
      value: scott@willeke.com
    # A forever connect grant on each host at start, so enforce mode doesn't stop a coding
    # agent's build on a registry approval (ping-poet/dreamwright#453). The same list as
    # Dreamwright's host template. Exact hosts only, and taking one out doesn't revoke its
    # grant: revoke it in the app.
    - name: DEFAULT_NETWORK_HOSTS
      value: archive.ubuntu.com,security.ubuntu.com,cloud-images.ubuntu.com,deb.debian.org,security.debian.org,dl-cdn.alpinelinux.org,pypi.org,files.pythonhosted.org,bootstrap.pypa.io,proxy.golang.org,sum.golang.org,index.crates.io,static.crates.io,crates.io,registry.yarnpkg.com,repo.yarnpkg.com,npm.pkg.github.com,pkg-npm.githubusercontent.com,registry-1.docker.io,auth.docker.io,index.docker.io,production.cloudfront.docker.com,ghcr.io,pkg-containers.githubusercontent.com,registry.k8s.io,us-west1-docker.pkg.dev,registry.terraform.io,registry.opentofu.org,releases.hashicorp.com,charts.bitnami.com,repo.broadcom.com,actions.github.io,aws.github.io,charts.jetstack.io,charts.loft.sh,falcosecurity.github.io,grafana.github.io,grafana-community.github.io,helm.traefik.io,traefik.github.io,helm.vector.dev,nuclio.github.io,prometheus-community.github.io,zotregistry.dev,nodejs.org,dl.k8s.io,go.dev,dl.google.com,objects.githubusercontent.com,binaries.prisma.sh,cdn.playwright.dev,playwright.download.prss.microsoft.com,playwright.azureedge.net
    # Who may click Approve or Deny on the Slack notice (browser-chaperone#54, #51).
    # Separate from OPERATOR_SLACK_USER_IDS on purpose: that one is the standing DM grant,
    # this one decides who a click is honored from.
    - name: SLACK_APPROVER_USER_IDS
      value: U0FS2ER1Q
    # Verifies the v0 signature on POST /slack/interactions. Optional so the app starts
    # before the operator writes it; every click gets refused, same as if the second Slack
    # app were never created.
    - name: SLACK_SIGNING_SECRET
      valueFrom:
        secretKeyRef:
          name: slack-signing-creds
          key: SLACK_SIGNING_SECRET
          optional: true
    # After each decision the app posts the request id and the decision to the chaperone-wake
    # plugin in olya-0, which wakes the session that raised it (activescott/activeassistant#543).
    # Through Traefik's cluster-internal entrypoint, not straight to olya:18789, so the gateway
    # never sees an X-Forwarded-For this pod wrote; see ../olya/olya-wake-ingress.yaml.
    - name: AGENT_WAKE_URL
      value: http://traefik-internal.kube-system.svc:8001/chaperone/decision
    - name: AGENT_WAKE_TOKEN
      valueFrom:
        secretKeyRef:
          name: agent-wake-token
          key: chaperone_wake_token
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    secretRef:
      name: app-signin
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    secretRef:
      name: internal-api-token
- op: add
  path: /spec/template/spec/containers/0/envFrom/-
  value:
    configMapRef:
      name: slack-notify-config
