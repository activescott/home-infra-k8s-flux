apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - egress-proxy-deployment.yaml
  - egress-proxy-service.yaml
  - networkpolicy.yaml
namespace: browser-chaperone-prod
configMapGenerator:
  # Generated, so the name carries a content hash and a change to squid.conf rolls the pod.
  - name: egress-proxy-config
    files:
      - squid.conf
