# The one thing olya's agents need from this namespace: read on the Secret vcluster writes the
# kubeconfig to (`exportKubeConfig` in helmrelease.yaml). The certificate in it is cluster-admin
# inside the virtual cluster and carries no rights on nas1, so this hands her the sandbox and
# nothing else.
#
# `resourceNames` is what keeps it from being "read Secrets in agent-sandbox-k8s". Keep it that
# narrow: any Secret she can read is a Secret a prompt injection can get repeated back out, which
# is the same reason olya-rbac.yaml takes ConfigMaps away from her cluster-wide.
#
# `get` only. `list` and `watch` cannot be narrowed by resourceNames -- the request names no
# object for the authorizer to match -- so granting either would grant every Secret here.
#
# This lives in the sandbox directory rather than apps/production/olya, where README.md first
# expected it, for two reasons. That Kustomization sets `namespace: olya`, which would rewrite
# this Role into the namespace the Secret is not in. And deleting the sandbox should take the
# grant with it, which is what happens when this directory goes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: olya-vcluster-kubeconfig
  namespace: agent-sandbox-k8s
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vc-agent-sandbox"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: olya-vcluster-kubeconfig
  namespace: agent-sandbox-k8s
subjects:
  - kind: ServiceAccount
    name: olya
    namespace: olya
roleRef:
  kind: Role
  name: olya-vcluster-kubeconfig
  apiGroup: rbac.authorization.k8s.io
