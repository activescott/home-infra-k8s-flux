# How the node pulls from registry.yaml. Images in a pod spec are pulled by nas1's kubelet and
# containerd, not by anything in this namespace, and containerd will not talk plain HTTP to a
# registry k3s's registries.yaml does not name. That file is node configuration outside this
# repo, so the pull goes over HTTPS through Traefik with a real certificate instead, at
# sandbox.oci-registry.activescott.com. The `*.oci-registry.activescott.com` records already
# exist publicly (infrastructure/prod/dns/zones/activescott.com.yaml) and as a LAN override to
# 10.1.111.20, so this name needs no DNS change.
#
# ###########################################################################################
# # ONLY THE NODE MAY USE THIS HOSTNAME. Everyone else, on the LAN or off it, gets a 403.   #
# ###########################################################################################
#
# The registry behind it is anonymous read-write, so the allowlist is the whole access control.
# It holds one address, 172.16.0.1: the cni0 bridge, which is the source Traefik sees when a
# process on the node connects to its own 10.1.111.20:443 and the connection is NATed onto the
# pod network. Measured 2026-10-01 from the access log of a kubelet pull of
# ghcr.oci-registry.activescott.com: ClientHost 172.16.0.1. A pod that dials 10.1.111.20 keeps its
# own address (the same log, every other line), and a LAN or internet client keeps its own
# because the Traefik Service runs externalTrafficPolicy: Local.
#
# That last part is what this rests on, and it fails open. Switch the Traefik Service to Cluster
# and svclb MASQUERADEs every request onto the same bridge, so the whole internet would arrive as
# 172.16.0.1 and could pull here. The security-guardrails workflow fails any PR that changes it
# (`Traefik externalTrafficPolicy must be Local`). The route below matches GET and HEAD only, so
# that failure exposes reads and never push: the node only pulls.
#
# The sandbox itself cannot use this name: networkpolicy.yaml denies 10.0.0.0/8, and the node's
# address is in it. Agents push to the in-namespace Service instead (README.md).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandbox-oci-registry-activescott-com
  namespace: agent-sandbox-k8s
spec:
  secretName: sandbox-oci-registry-activescott-com-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - sandbox.oci-registry.activescott.com
---
# Matching is on the TCP source address, not X-Forwarded-For; see the same note in
# apps/production/olya/olya-ingress.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sandbox-registry-node-only
  namespace: agent-sandbox-k8s
spec:
  # see https://doc.traefik.io/traefik/middlewares/http/ipallowlist/
  ipAllowList:
    sourceRange:
      - 172.16.0.1/32
---
# An IngressRoute rather than an Ingress because an Ingress cannot match on method. Any other
# method gets a 404 from Traefik. Traefik v3 takes one method per Method(), so
# `Method(`GET`, `HEAD`)` fails to parse and disables the router.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sandbox-registry
  namespace: agent-sandbox-k8s
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`sandbox.oci-registry.activescott.com`) && (Method(`GET`) || Method(`HEAD`))
      middlewares:
        - name: sandbox-registry-node-only
      services:
        - name: sandbox-registry
          port: registry
  tls:
    secretName: sandbox-oci-registry-activescott-com-tls
