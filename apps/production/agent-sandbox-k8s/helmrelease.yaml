# A throwaway Kubernetes API for coding agents to run tests against
# (activescott/activeassistant#346). Nothing in here is production: the virtual cluster can be
# deleted and re-created by removing and re-adding this file.
#
# THE DISTRO IS NOT K3S. #346 asked for the k3s distro; vcluster deprecated it through 0.32 and
# removed it in 0.33, so no currently-supported chart can start one. `k8s` is the only distro
# left, and it is upstream Kubernetes rather than k3s. A distro cannot be changed after a vcluster
# is deployed, so pinning a 0.32.x chart to keep the word "k3s" would have meant starting on a
# version with no upgrade path and deleting the cluster later to leave it. See README.md.
#
# The distro image is pinned to the host's minor. The host is k3s v1.33.5+k3s1, and its kubelet is
# what ends up running every pod the syncer creates, so a virtual API server far ahead of it
# accepts pod fields the host then prunes. Same reasoning as the alpine/kubectl skew cap in
# renovate.json5: raise this when the cluster's k3s minor moves. The chart would otherwise default
# to v1.36.0.
#
# vcluster-oss, not the chart's default vcluster-pro image: the pro build ships the same OSS
# features with the paid ones switched off, and this repo is public. Nothing here needs a
# platform login.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
  namespace: agent-sandbox-k8s
spec:
  interval: 10m
  # Longer than helm-controller's 5m default because the first install pulls two images before the
  # control plane answers /readyz. The `apps` Kustomization is `wait: true`, so a release that
  # fails on a slow pull does not just retry quietly -- it makes the whole Kustomization unhealthy.
  timeout: 10m
  chart:
    spec:
      chart: vcluster
      # 0.37.2 shipped the morning this was written; 0.37.1 is the newest release older than the
      # 7-day minimumReleaseAge this repo applies to every other dependency (renovate.json5).
      version: "0.37.1"
      sourceRef:
        kind: HelmRepository
        name: loft
        namespace: agent-sandbox-k8s
      interval: 24h
  values:
    controlPlane:
      distro:
        k8s:
          enabled: true
          image:
            tag: v1.33.13
      statefulSet:
        image:
          repository: loft-sh/vcluster-oss
        persistence:
          volumeClaim:
            enabled: true
            size: 5Gi
            # The only StorageClass on nas1: rancher.io/local-path, reclaim Delete. Right choice
            # here -- deleting the vcluster should take its state with it.
            storageClass: local-path
      proxy:
        # The kubeconfig below points at the Service FQDN, so the serving certificate has to be
        # signed for it. vcluster adds the Service's own names, but naming them is cheap and the
        # failure mode (x509 name mismatch on every call from olya-0) is not obvious.
        extraSANs:
          - agent-sandbox.agent-sandbox-k8s.svc.cluster.local
          - agent-sandbox.agent-sandbox-k8s.svc
      # The chart's Corefile with one line changed: `forward` names the host's kube-dns Service
      # instead of /etc/resolv.conf. vcluster runs its CoreDNS with dnsPolicy: Default, so that
      # file is the node's, whose nameserver is the OPNsense router at 10.1.111.1, and
      # networkpolicy.yaml denies the LAN on 53. Every lookup outside cluster.local timed out,
      # and forward's health check retried the dead upstream about 80 times a minute, each one a
      # Falco "unexpected private network connection". kube-system on 53 is the DNS path that file
      # does allow.
      #
      # The rest is what vcluster 0.37.1 generates for these values (pkg/coredns/template.go).
      # Re-read that template when the chart moves, since this replaces it whole.
      #
      # WHY THE MANIFESTS AND NOT JUST THE COREFILE. vcluster applies these inside the virtual
      # cluster every time the syncer starts, and a changed Corefile always arrives with a start.
      # Its ConfigMap syncer keeps the last-seen copy of each object in memory and seeds that copy
      # from the virtual object on its first reconcile after a restart, so an edit made during
      # startup looks like no change and never reaches the host copy the pod actually mounts
      # (pkg/syncer/syncer.go, pkg/controllers/resources/configmaps/to_host_syncer.go). That is
      # how overwriteConfig left the old forwarder running on 2026-09-24: the virtual ConfigMap
      # said 172.17.0.10, the host one still said /etc/resolv.conf, and `reload` had nothing to
      # reload. Restarting the pod would not have helped either; it mounts the same host copy.
      #
      # So the Corefile lives in its own ConfigMap named after the first ten hex digits of its
      # sha256. A changed Corefile is a new name, which the syncer creates on the host from the
      # current data, and a new name in the pod template, which rolls the pod. The validate
      # workflow recomputes the hash and fails the PR if the name is stale, so edit the Corefile
      # and then run the command it prints. NodeHosts stays in `coredns`, the ConfigMap vcluster's
      # node controller patches by name, and is projected alongside.
      #
      # The image is the one vcluster 0.37.1 picks for a v1.33 API server
      # (pkg/constants/coredns.go). Written out here it no longer follows the chart, so move it
      # with the distro tag above.
      coredns:
        overwriteManifests: |-
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: coredns
            namespace: kube-system
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            labels:
              kubernetes.io/bootstrapping: rbac-defaults
            name: system:coredns
          rules:
            - apiGroups:
                - ""
              resources:
                - endpoints
                - services
                - pods
                - namespaces
              verbs:
                - list
                - watch
            - apiGroups:
                - discovery.k8s.io
              resources:
                - endpointslices
              verbs:
                - list
                - watch
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            annotations:
              rbac.authorization.kubernetes.io/autoupdate: "true"
            labels:
              kubernetes.io/bootstrapping: rbac-defaults
            name: system:coredns
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system:coredns
          subjects:
            - kind: ServiceAccount
              name: coredns
              namespace: kube-system
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: coredns
            namespace: kube-system
          data:
            NodeHosts: ""
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            # Suffix is the first ten hex digits of sha256 of the Corefile. If you change it, update
            # this name and the other one to match, or validate fails. See the comment above.
            name: coredns-corefile-36679dc1d5
            namespace: kube-system
          data:
            Corefile: |-
              .:1053 {
                  errors
                  health
                  ready
                  rewrite name regex .*\.nodes\.vcluster\.com kubernetes.default.svc.cluster.local
                  kubernetes cluster.local in-addr.arpa ip6.arpa {
                      pods insecure
                      fallthrough in-addr.arpa ip6.arpa
                  }
                  hosts /etc/coredns/NodeHosts {
                      ttl 60
                      reload 15s
                      fallthrough
                  }
                  prometheus :9153
                  forward . 172.17.0.10
                  cache 30
                  loop
                  reload
                  loadbalance
              }

              import /etc/coredns/custom/*.server
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: coredns
            namespace: kube-system
            labels:
              k8s-app: vcluster-kube-dns
              kubernetes.io/name: "CoreDNS"
          spec:
            replicas: 1
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 1
            selector:
              matchLabels:
                k8s-app: vcluster-kube-dns
            template:
              metadata:
                labels:
                  k8s-app: vcluster-kube-dns
              spec:
                priorityClassName: ""
                serviceAccountName: coredns
                nodeSelector:
                  kubernetes.io/os: linux
                topologySpreadConstraints:
                  - labelSelector:
                      matchLabels:
                        k8s-app: vcluster-kube-dns
                    maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: DoNotSchedule
                containers:
                  - name: coredns
                    image: docker.io/coredns/coredns:1.12.0
                    imagePullPolicy: IfNotPresent
                    resources:
                      limits:
                        cpu: 1000m
                        memory: 170Mi
                      requests:
                        cpu: 20m
                        memory: 64Mi
                    args: [ "-conf", "/etc/coredns/Corefile" ]
                    volumeMounts:
                      - name: config-volume
                        mountPath: /etc/coredns
                        readOnly: true
                      - name: custom-config-volume
                        mountPath: /etc/coredns/custom
                        readOnly: true
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1001
                      runAsGroup: 1001
                      allowPrivilegeEscalation: false
                      capabilities:
                        add:
                          - NET_BIND_SERVICE
                        drop:
                          - ALL
                      readOnlyRootFilesystem: true
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 8080
                        scheme: HTTP
                      initialDelaySeconds: 60
                      periodSeconds: 10
                      timeoutSeconds: 1
                      successThreshold: 1
                      failureThreshold: 3
                    readinessProbe:
                      httpGet:
                        path: /ready
                        port: 8181
                        scheme: HTTP
                      initialDelaySeconds: 0
                      periodSeconds: 2
                      timeoutSeconds: 1
                      successThreshold: 1
                      failureThreshold: 3
                dnsPolicy: Default
                volumes:
                  - name: config-volume
                    projected:
                      sources:
                        - configMap:
                            # Suffix is the first ten hex digits of sha256 of the Corefile. If you change it, update
                            # this name and the other one to match, or validate fails. See the comment above.
                            name: coredns-corefile-36679dc1d5
                            items:
                              - key: Corefile
                                path: Corefile
                        - configMap:
                            name: coredns
                            items:
                              - key: NodeHosts
                                path: NodeHosts
                  - name: custom-config-volume
                    configMap:
                      name: coredns-custom
                      optional: true
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: kube-dns
            namespace: kube-system
            annotations:
              prometheus.io/port: "9153"
              prometheus.io/scrape: "true"
            labels:
              k8s-app: vcluster-kube-dns
              kubernetes.io/cluster-service: "true"
              kubernetes.io/name: "CoreDNS"
          spec:
            type: ClusterIP
            selector:
              k8s-app: vcluster-kube-dns
            ports:
              - name: dns
                port: 53
                targetPort: 1053
                protocol: UDP
              - name: dns-tcp
                port: 53
                targetPort: 1053
                protocol: TCP
              - name: metrics
                port: 9153
                protocol: TCP

    # Where olya-0's agents get their credentials. vcluster writes a kubeconfig to the Secret
    # `vc-agent-sandbox` in this namespace, holding a client certificate that is cluster-admin
    # INSIDE the virtual cluster and nothing at all outside it. The default server address is
    # https://localhost:8443, which only works through `vcluster connect`; overriding it with the
    # in-cluster Service FQDN is what makes the Secret usable as-is from another pod.
    #
    # Reading that Secret and reaching that address are both denied to olya today. See "Getting
    # the kubeconfig into olya-0" in README.md for the follow-up that grants them.
    exportKubeConfig:
      context: agent-sandbox
      server: https://agent-sandbox.agent-sandbox-k8s.svc.cluster.local

    # No cluster-scoped rights for the syncer. The chart's `auto` default hands it a ClusterRole
    # with cluster-wide `persistentvolumes` read and `volumesnapshotcontents` create/delete/patch/
    # update, purely because volume-snapshot rules default on -- none of which this sandbox uses:
    # `sync.toHost.persistentVolumes` and `sync.toHost.volumeSnapshotContents` are both off, so the
    # syncer never touches either. PVCs still work; vcluster fabricates the virtual PV from the
    # virtual PVC and never reads a host PV (pkg/controllers/resources/persistentvolumes/
    # fake_syncer.go). What is left is a Role in this namespace and nothing outside it.
    #
    # Turning a sync option back on that needs cluster scope will now fail loudly instead of
    # quietly granting itself the rights. That is the intended trade.
    rbac:
      clusterRole:
        enabled: false
      enableVolumeSnapshotRules:
        enabled: false

    policies:
      # The chart can deploy its own ResourceQuota, LimitRange and NetworkPolicy into this
      # namespace. Ours are in git next to this file, sized for this node and commented; two
      # quotas on one namespace would both be enforced and the tighter one would win invisibly.
      resourceQuota:
        enabled: false
      limitRange:
        enabled: false
      networkPolicy:
        enabled: false

    # A home cluster does not need to report its usage to a vendor.
    telemetry:
      enabled: false
