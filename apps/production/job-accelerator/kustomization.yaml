resources:
  - namespace.yaml
  - db-pv.yaml
  - ../../base/job-accelerator/
  - app-ingress-certificate.yaml
  # /ops/* (kubelet probes) denied at the ingress; the probes reach the app
  # through the Service instead.
  - app-ops-middleware.yaml
  - app-ops-ingress.yaml
  - ../../../infrastructure/prod/configs/ghcr-pull-secret/
patches:
  # ghcr.io/activescott/job-accelerator is private, so the Deployment needs
  # the pull secret.
  - path: patch-app-deployment.yaml
    target:
      kind: Deployment
      name: app
  - path: patch-app-ingress.yaml
    target:
      kind: Ingress
      name: app-ingress
  - path: patch-db-statefulset.yaml
    target:
      kind: StatefulSet
      name: db
namespace: job-accelerator-prod
secretGenerator:
  # db
  - name: db-creds
    envs:
      - .env.secret.db.encrypted
  # app
  - name: app-creds
    envs:
      - .env.secret.app.encrypted
# the images tag: https://kubectl.docs.kubernetes.io/references/kustomize/builtins/#_imagetagtransformer_
images:
  - name: job-accelerator-image-app
    newName: ghcr.io/activescott/job-accelerator/app # {"$imagepolicy": "flux-system:policy-job-accelerator-app:name"}
    newTag: v0.1.0 # {"$imagepolicy": "flux-system:policy-job-accelerator-app:tag"}
