resources:
  - namespace.yaml
  - db-pv.yaml
  - keys-pv.yaml
  - ../../base/job-accelerator/
  - app-ingress-certificate.yaml
  # /ops/* (kubelet probes) denied at the ingress; the probes reach the app
  # through the Service instead.
  - app-ops-middleware.yaml
  - app-ops-ingress.yaml
  - db-networkpolicy.yaml
  - ../../../infrastructure/prod/configs/ghcr-pull-secret/
patches:
  # ghcr.io/activescott/job-accelerator is private, so both Deployments need
  # the pull secret.
  - path: patch-app-deployment.yaml
    target:
      kind: Deployment
      name: app
  - path: patch-worker-deployment.yaml
    target:
      kind: Deployment
      name: worker
  - path: patch-app-from-email.yaml
    target:
      kind: Deployment
      name: app
  - path: patch-app-ingress.yaml
    target:
      kind: Ingress
      name: app-ingress
  - path: patch-db-statefulset.yaml
    target:
      kind: StatefulSet
      name: db
  - path: patch-keys-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: keys
namespace: job-accelerator-prod
secretGenerator:
  # db
  - name: db-creds
    envs:
      - .env.secret.db.encrypted
  # app
  - name: app-creds
    envs:
      - .env.secret.app.encrypted
  # The master key that wraps every client data key in the keystore. Its own
  # Secret so it can be rotated and audited separately from app-creds. The
  # `public-key-encrypted` part of the name marks a secret with no plaintext
  # copy anywhere: it was generated by scripts/create-job-accelerator-master-key.sh
  # and encrypted straight to the age recipient, and only the cluster can read
  # it. Rotation is not a one-line change; see README.md#master-key.
  - name: master-key
    envs:
      - .env.secret.master-key.public-key-encrypted.encrypted
  # The address of the person who owns the client records. Not a credential,
  # but a private person's email, and this repo is public, so it is encrypted
  # for the same reason ALLOWED_EMAILS is. `public-key-encrypted` because it
  # was piped straight into sops against the age recipient and never written
  # to disk in the clear; onepassword-secrets.mts skips it rather than
  # reporting a missing backup. See README.md#client_data_owner_email to
  # change the address.
  - name: client-owner
    envs:
      - .env.secret.client-owner.public-key-encrypted.encrypted
  # Signs the five-minute cookie that binds a WebAuthn ceremony to the browser
  # it started in. Was JWT_SECRET, so one value signed both sessions and
  # challenges (activescott/job-accelerator#106). `public-key-encrypted`
  # because nobody ever saw it: it was piped straight into sops against the
  # age recipient and never written to disk in the clear, so
  # onepassword-secrets.mts skips it rather than reporting a missing backup.
  # Replacing the file only drops the challenges in flight, which live seconds.
  - name: passkey-challenge
    envs:
      - .env.secret.passkey-challenge.public-key-encrypted.encrypted
  # Signs the client's approval links (activescott/job-accelerator#157;
  # docs/design/flows.md, "Signed approval links"). `public-key-encrypted`
  # because nobody ever saw it: it was piped straight into sops against the
  # age recipient and never written to disk in the clear, so
  # onepassword-secrets.mts skips it rather than reporting a missing backup.
  # Replacing the file invalidates any links already sent, forcing the app to
  # resend them.
  - name: approval-link
    envs:
      - .env.secret.approval-link.public-key-encrypted.encrypted
# the images tag: https://kubectl.docs.kubernetes.io/references/kustomize/builtins/#_imagetagtransformer_
# The app and worker Deployments both name job-accelerator-image-app, so one
# image update rolls both.
images:
  - name: job-accelerator-image-app
    newName: ghcr.io/activescott/job-accelerator/app # {"$imagepolicy": "flux-system:policy-job-accelerator-app:name"}
    newTag: v0.29.0 # {"$imagepolicy": "flux-system:policy-job-accelerator-app:tag"}
