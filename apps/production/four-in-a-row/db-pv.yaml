apiVersion: v1
kind: PersistentVolume
metadata:
  name: four-in-a-row-prod-db-pv-data
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  hostPath:
    path: /mnt/thedatapool/app-data/four-in-a-row/prod/db-data
    type: DirectoryOrCreate
