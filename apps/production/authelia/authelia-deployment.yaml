apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: authelia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      # REQUIRED, not a tidiness preference. Kubernetes injects an env var per Service in the
      # namespace, and the Service here is named `authelia`, so the default would set
      # AUTHELIA_PORT=tcp://10.x.x.x:80. Authelia reads AUTHELIA_* as configuration, so that
      # value lands on server.port (or fails validation) and the pod never serves.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        # The image declares no USER and its entrypoint only drops privileges when it starts as
        # root, so the uid is ours to pick. 2000 matches the convention already used by
        # email-stalwart. hostPath volumes are NOT chowned by the kubelet, so
        # /mnt/thedatapool/app-data/authelia/prod/data must already be owned by 2000:2000 --
        # see authelia-pvc.yaml.
        fsGroup: 2000
        runAsUser: 2000
        runAsGroup: 2000
      containers:
        - name: authelia
          image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
          ports:
            - containerPort: 9091
              name: http
          env:
            # Authelia's own docs prefer the _FILE variants, but these are already Kubernetes
            # Secret values rather than anything on disk, so the indirection buys nothing.
            # Lowercase keys because they come from a dotenv file; see kustomization.yaml.
            - name: AUTHELIA_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: session_secret
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: storage_encryption_key
            # Top-level jwt_secret moved under identity_validation in 4.38.
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: jwt_secret
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        # One projected volume rather than two mounts, because Authelia wants configuration.yml
        # and users.yml in the same directory and a plain ConfigMap mount at /config would hide
        # a Secret mounted under it. subPath would work too but freezes the files at pod start.
        - name: config
          projected:
            sources:
              - configMap:
                  name: authelia-config
              - secret:
                  name: authelia-users
                  items:
                    # The Secret key is `users` (no extension) so that Flux decrypts it as an
                    # opaque blob rather than as YAML, which would leave the usernames readable
                    # in the committed ciphertext. See kustomization.yaml. Renamed here to the
                    # path authentication_backend.file.path expects.
                    - key: users
                      path: users.yml
        - name: data
          persistentVolumeClaim:
            claimName: authelia-data
