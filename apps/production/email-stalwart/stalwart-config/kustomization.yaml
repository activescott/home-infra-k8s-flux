apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - apply-cronjob.yaml

# The plan is mounted rather than baked into the image. Leaving the name suffix hash on is
# deliberate: a changed plan produces a new ConfigMap name, which updates the CronJob spec,
# so `kubectl create job --from=cronjob/...` always picks up the current plan.
configMapGenerator:
  - name: stalwart-config-plans
    files:
      - plan.ndjson
  # Stalwart's bootstrap file, mounted at /etc/stalwart in place of a PVC. It only names
  # the data store; everything else lives in that store and is managed by plan.ndjson.
  # It was previously setup-wizard output sitting on a volume, which made it the last
  # piece of configuration not described by git. It contains no secrets — the store is
  # local RocksDB, so there is no connection string or credential in it.
  - name: stalwart-bootstrap-config
    files:
      - config.json
  # Applied only by the bootstrap job against a fresh server, never by the routine apply.
  - name: stalwart-config-accounts
    files:
      - accounts.ndjson

# The Secret (stalwart-cli-creds) is generated by the parent kustomization, because
# kustomize cannot read files above its own root and the encrypted env file lives there
# alongside the other Stalwart secrets.
