apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mail-setup.yaml
configMapGenerator:
  # Generated rather than declared inline so kustomize hashes the content into the ConfigMap
  # names; editing the page or the profile then rolls the mail-setup Deployment.
  - name: mail-setup-content
    files:
      - index.html
      - robots.txt
      - apple-templated.mobileconfig
  - name: mail-setup-nginx
    files:
      - nginx-default.conf
