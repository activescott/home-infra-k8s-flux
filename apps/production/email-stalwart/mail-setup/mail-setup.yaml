# Client setup page for the mailboxes on this server, at https://mail.activescott.com/setup.
#
# Exists because Apple Mail cannot be configured by hand on iOS until the account saves, and it
# will not save against this server: iOS probes submission on 587, gets refused (Stalwart runs
# submission on 465 with implicit TLS and starts no STARTTLS listener), then falls back to 25 --
# the MTA listener, which advertises no AUTH. Mail reports that as "incorrect username or
# password", which is a lie; there is no failed authentication in the server log because it never
# attempted one. The port fields that would fix it are not shown until the account exists.
#
# An Apple configuration profile states the ports as fact, so Mail never probes. The profile and
# the page live alongside this file and are loaded by the configMapGenerator in this directory's
# own kustomization.yaml -- generated, so kustomize hashes them into the ConfigMap names and
# editing any of them rolls this Deployment. Do not convert them to inline ConfigMaps; the
# content would then change under a running pod without restarting it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-setup
  namespace: email-stalwart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail-setup
  template:
    metadata:
      labels:
        app: mail-setup
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx
          # nginx-unprivileged, not nginx: the stock image needs root to bind :80 and to write its
          # pid file. This one listens on 8080 as uid 101 and tolerates a read-only root.
          #
          # ngx_http_sub_module must be present -- it is what substitutes the address into the
          # templated profile. It is compiled into the official images; a switch to a minimal or
          # distroless nginx would silently serve profiles containing the literal __EMAIL__.
          image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # nginx writes to both at runtime and the root filesystem is read-only.
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /setup
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: content
          configMap:
            name: mail-setup-content
        - name: nginx-conf
          configMap:
            name: mail-setup-nginx
            items:
              - key: nginx-default.conf
                path: default.conf
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mail-setup
  namespace: email-stalwart
spec:
  selector:
    app: mail-setup
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Everything served on mail.activescott.com, split between this nginx and Stalwart's own HTTP
# listener. Every path is Exact or a narrow Prefix, never a bare "/".
#
# Phase 8 puts Bulwark webmail on this same hostname at "/". Traefik ranks routers by rule
# specificity, so these all beat PathPrefix(`/`) and coexist with it.
#
# The /dav and /.well-known routes go to Stalwart, not to nginx: CalDAV and CardDAV are how the
# profile delivers calendar and contacts. Apple discovers them by requesting /.well-known/caldav,
# which Stalwart answers with a 307 to /dav/cal (verified 2026-08-28; /dav/cal/ and /dav/card/
# then return 401). Only those paths are routed, so the admin UI stays reachable solely at
# admin.mail.activescott.com -- this hostname exposes the DAV API and nothing else of Stalwart's.
#
# Reuses the stalwart-tls Secret rather than issuing a second certificate for the same name. That
# Secret is owned by stalwart-certificate.yaml and is mounted read-only by the mail server;
# reading it from an Ingress adds no renewal coupling. The reverse is not true -- adding a SAN to
# that certificate WOULD bounce the mail server, which is why admin.mail.activescott.com has its
# own. See stalwart-admin-ingress.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mail-setup-ingress
  namespace: email-stalwart
spec:
  tls:
    - hosts:
        - mail.activescott.com
      secretName: stalwart-tls
  rules:
    - host: mail.activescott.com
      http:
        paths:
          # The page at /setup, the identity-free profile at /setup/apple.mobileconfig, and the
          # templated one at /setup/profiles/<address>/apple.mobileconfig. Prefix rather than
          # three Exact rules: the address is part of the path, and Ingress prefix matching is
          # element-wise, so this matches /setup and /setup/... but never /setupfoo. nginx
          # validates the address shape and redirects anything that fails.
          - path: /setup
            pathType: Prefix
            backend:
              service:
                name: mail-setup
                port:
                  number: 80
          # Root, because that is the only place the standard defines it.
          - path: /robots.txt
            pathType: Exact
            backend:
              service:
                name: mail-setup
                port:
                  number: 80
          - path: /dav
            pathType: Prefix
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080
          - path: /.well-known/caldav
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080
          - path: /.well-known/carddav
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080
