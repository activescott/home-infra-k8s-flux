server {
    listen 8080;
    server_name _;

    # Apple's MIME type for configuration profiles. With application/octet-stream iOS still
    # installs it, but only after a detour through the Files app; with this, tapping the link
    # goes straight to Settings > Profile Downloaded.
    location = /apple.mobileconfig {
        default_type application/x-apple-aspen-config;
        alias /usr/share/nginx/html/apple.mobileconfig;
    }

    location = /setup {
        default_type text/html;
        alias /usr/share/nginx/html/index.html;
    }

    # Nothing else is served. The Ingress only routes those two exact paths here, so this is
    # the second line of defence if that ever widens by accident.
    location / {
        return 404;
    }
}
