# Extracts the address, and optionally the display name, out of
#   /setup/profiles/<address>/apple.mobileconfig
#   /setup/profiles/<address>/name/<display name>/apple.mobileconfig
# so the templated profile can be filled in without the user typing either of them again.
#
# These regexes are the ONLY thing standing between a crafted link and XML injection into a
# configuration profile. The profile is served unauthenticated, so injected markup could hand
# someone an account pointed at an attacker's server. The address class admits no `<`, `>`,
# `&`, `"`, `'`, `%` or whitespace, which is what makes substitution safe -- do not widen it.
# Anything that fails to match yields an empty value and is redirected back to the form rather
# than served a half-substituted file.
#
# Keyed on $uri, not $arg_email: nginx decodes %XX in the path before matching, but does not
# decode query arguments, so `%40` would have to be handled by hand. A path segment sidesteps it.
map $uri $mail_addr {
    default "";
    "~^/setup/profiles/([A-Za-z0-9._+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)/apple\.mobileconfig$" $1;
    "~^/setup/profiles/([A-Za-z0-9._+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)/name/[^/<>&[:cntrl:]]{1,64}/apple\.mobileconfig$" $1;
}

# The display name is a person's name, so unlike the address it must admit spaces, apostrophes
# and accented letters -- an allowlist of ASCII word characters would mangle them. Hence an
# exclusion class instead: the name is substituted into XML *element text*, never into an
# attribute, and element text has exactly two characters that can end it, `<` and `&`. Both are
# excluded, along with `>` for symmetry, `/` so the segment cannot swallow the rest of the path,
# and control characters (which %0A would otherwise decode into). Everything else is inert
# there, which is why quotes are allowed through: O'Brien keeps the apostrophe.
map $uri $mail_name_raw {
    default "";
    "~^/setup/profiles/[A-Za-z0-9._+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+/name/([^/<>&[:cntrl:]]{1,64})/apple\.mobileconfig$" $1;
}

# sub_filter cannot omit a plist key, so __NAME__ always gets *something*. An empty
# EmailAccountName would make Apple Mail send with a blank display name; the address is the
# least-worst stand-in, and is what iOS shows for an account whose name was never set.
map $mail_name_raw $mail_name {
    default $mail_name_raw;
    ""      $mail_addr;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Emit relative Location headers. nginx builds absolute redirects from the address it is
    # listening on, which here is http on :8080 behind Traefik -- so the redirects below would
    # send a browser to http://mail.activescott.com:8080/, which is not reachable.
    absolute_redirect off;

    # Everything user-facing lives under /setup. Only robots.txt sits at the root, because that
    # is the sole location the standard defines.
    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /setup {
        default_type text/html;
        try_files /index.html =404;
    }

    location = /setup/ {
        return 301 /setup;
    }

    # The only profile: mail + calendar + contacts, with the address and display name
    # substituted in.
    #
    # There used to be an identity-free fallback at /setup/apple.mobileconfig, carrying the mail
    # payload alone -- it could not include CalDAV or CardDAV, whose username key is documented
    # as required rather than prompted. It is gone: a profile that silently delivers two of the
    # three services is a worse outcome than being sent back to the form to fix the address.
    location ^~ /setup/profiles/ {
        # Pin both map results to the REQUEST uri, here in the rewrite phase, before anything
        # else in this block runs. try_files performs an internal rewrite and $uri becomes
        # /apple-templated.mobileconfig once it does; map variables are lazy and cached on first
        # read, so a map read only from sub_filter -- which runs after that rewrite -- matches
        # against the file path and yields "". That is not hypothetical: it is exactly what
        # happened to $mail_name, which silently fell back to the address for every request while
        # $mail_addr worked, because the `if` below reads $mail_addr early enough by accident.
        set $profile_email $mail_addr;
        set $profile_name $mail_name;

        if ($profile_email = "") {
            return 302 /setup;
        }
        default_type application/x-apple-aspen-config;
        sub_filter_types *;
        sub_filter_once off;
        sub_filter "__EMAIL__" "$profile_email";
        sub_filter "__NAME__" "$profile_name";
        try_files /apple-templated.mobileconfig =404;
    }

    # Nothing else is served. The Ingress only routes /setup and /robots.txt here, so this is the
    # second line of defence if that ever widens by accident.
    location / {
        return 404;
    }
}
