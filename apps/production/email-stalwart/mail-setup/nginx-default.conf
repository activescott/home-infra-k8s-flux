# Extracts the address out of /setup/profiles/<address>/apple.mobileconfig so the templated
# profile can be filled in without the user typing it three times.
#
# This regex is the ONLY thing standing between a crafted link and XML injection into a
# configuration profile. The profile is served unauthenticated, so injected markup could hand
# someone an account pointed at an attacker's server. The character class admits no `<`, `>`,
# `&`, `"`, `'`, `%` or whitespace, which is what makes substitution safe -- do not widen it.
# Anything that fails to match yields an empty value and is redirected to the identity-free
# profile rather than served a half-substituted file.
#
# Keyed on $uri, not $arg_email: nginx decodes %XX in the path before matching, but does not
# decode query arguments, so `%40` would have to be handled by hand. A path segment sidesteps it.
map $uri $mail_addr {
    default "";
    "~^/setup/profiles/([A-Za-z0-9._+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+)/apple\.mobileconfig$" $1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Emit relative Location headers. nginx builds absolute redirects from the address it is
    # listening on, which here is http on :8080 behind Traefik -- so the redirects below would
    # send a browser to http://mail.activescott.com:8080/, which is not reachable.
    absolute_redirect off;

    # Everything user-facing lives under /setup. Only robots.txt sits at the root, because that
    # is the sole location the standard defines.
    location = /robots.txt {
        try_files /robots.txt =404;
    }

    location = /setup {
        default_type text/html;
        try_files /index.html =404;
    }

    location = /setup/ {
        return 301 /setup;
    }

    # The identity-free profile: mail only, no address, no username. Apple prompts for those.
    # Deliberately carries no CalDAV or CardDAV payload -- their username key is documented as
    # required rather than prompted, so a payload without one may fail to install rather than
    # ask. Calendar and contacts come from the templated profile below, where the address is
    # known. This is the fallback path.
    location = /setup/apple.mobileconfig {
        default_type application/x-apple-aspen-config;
        try_files /apple.mobileconfig =404;
    }

    # The templated profile: mail + calendar + contacts, with the address substituted in.
    location ^~ /setup/profiles/ {
        if ($mail_addr = "") {
            return 302 /setup/apple.mobileconfig;
        }
        default_type application/x-apple-aspen-config;
        sub_filter_types *;
        sub_filter_once off;
        sub_filter "__EMAIL__" "$mail_addr";
        try_files /apple-templated.mobileconfig =404;
    }

    # Nothing else is served. The Ingress only routes /setup and /robots.txt here, so this is the
    # second line of defence if that ever widens by accident.
    location / {
        return 404;
    }
}
