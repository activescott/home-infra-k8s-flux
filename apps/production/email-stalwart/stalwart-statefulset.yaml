apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: email-stalwart
spec:
  replicas: 1
  serviceName: stalwart-headless
  selector:
    matchLabels:
      app: stalwart
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      securityContext:
        # The image runs as uid/gid 2000 (user `stalwart`), not root. fsGroup makes the
        # mounted volumes group-writable by it. hostPath volumes are NOT chowned by the
        # kubelet, so the two directories on the NAS must already be owned by 2000:2000 --
        # see README.md. Getting this wrong shows up as Stalwart failing to open its
        # datastore and falling back into bootstrap mode, which looks like data loss.
        fsGroup: 2000
        runAsUser: 2000
        runAsGroup: 2000
      containers:
        - name: stalwart
          image: stalwartlabs/stalwart:v0.16
          securityContext:
            capabilities:
              add:
                # Every mail port here is below 1024 and the process is not root.
                - NET_BIND_SERVICE
              drop:
                - ALL
          ports:
            - name: smtp
              containerPort: 25
            - name: smtps
              containerPort: 465
            - name: submission
              containerPort: 587
            - name: imaps
              containerPort: 993
            - name: https
              containerPort: 443
            - name: recovery
              containerPort: 8080
          env:
            # Pins the administrator credential instead of accepting the one-time password
            # Stalwart prints to stdout on first boot. Without this the only record of the
            # admin password is a log line from a pod that no longer exists.
            - name: STALWART_RECOVERY_ADMIN
              valueFrom:
                secretKeyRef:
                  name: stalwart-creds
                  key: STALWART_RECOVERY_ADMIN
            # Google app password for the outbound smarthost. The MtaRoute named "google"
            # refers to this variable by name (authSecret -> EnvironmentVariable), so the
            # credential stays in SOPS and never enters the admin UI or the datastore.
            #
            # Two consequences of how Stalwart resolves it, both worth knowing before
            # debugging a delivery failure:
            #
            #   - It is read once when the configuration is built, not per delivery. Rotating
            #     the value in the Secret does nothing until this pod restarts.
            #   - If it cannot be resolved, the route falls back to *unauthenticated* relay
            #     rather than failing. Google then rejects the connection, which reads like a
            #     wrong credential rather than a missing one.
            #
            # Google revokes app passwords whenever the owning account's password changes, so
            # a routine password rotation on that account stops outbound mail for every
            # mailbox on this server. See README.md "Sending".
            - name: STALWART_SMARTHOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-creds
                  key: STALWART_SMARTHOST_PASSWORD
            # Basic-auth password for the Prometheus exporter at
            # /metrics/prometheus. The Metrics singleton refers to this variable by
            # name (authSecret -> EnvironmentVariable), the same indirection the
            # smarthost password uses, so the credential stays in SOPS rather than in
            # the datastore.
            #
            # Auth is not optional here: the exporter shares an HTTP listener with the
            # admin UI, which stalwart-admin-ingress.yaml publishes to the internet.
            # stalwart-metrics-ingress.yaml blocks /metrics at the edge as well; the
            # two layers cover different failure modes and both are deliberate.
            #
            # Prometheus needs the identical value, in a different namespace and so a
            # different Secret:
            # apps/production/monitoring/prometheus/.env.secret.stalwart-metrics.
            # Rotate both together.
            #
            # Resolved once at config-build time. Changing the Secret does nothing
            # until this pod restarts, and an unresolvable value degrades the endpoint
            # to unauthenticated rather than failing loudly -- which is the more
            # dangerous direction here, and the reason the ingress block exists.
            - name: STALWART_METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-creds
                  key: STALWART_METRICS_PASSWORD
            - name: TZ
              value: America/Los_Angeles
          volumeMounts:
            # Both paths are declared VOLUME in the image and both must be backed by real
            # storage -- see the comment in stalwart-pv.yaml for what happens if one is not.
            - name: config
              mountPath: /etc/stalwart
            - name: data
              mountPath: /var/lib/stalwart
            # cert-manager writes tls.crt and tls.key here. Mounted read-only and separately
            # from /etc/stalwart so a certificate rotation never touches persistent storage.
            #
            # Stalwart does NOT notice a rotated file on its own -- it re-reads certificates
            # only when the ReloadTlsCertificates action is invoked. The kubelet refreshes this
            # mount automatically when cert-manager renews, so the files change underneath a
            # running server and nothing picks them up. See the reload CronJob task; without it
            # TLS silently goes stale ~60 days from issuance on internet-facing ports.
            - name: tls
              mountPath: /etc/stalwart-tls
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: stalwart-config
        - name: data
          persistentVolumeClaim:
            claimName: stalwart-data
        # Produced by stalwart-certificate.yaml. Issued 2026-08-28 by letsencrypt-production
        # over HTTP-01, CN=mail.activescott.com, valid to 2026-11-26.
        - name: tls
          secret:
            secretName: stalwart-tls
