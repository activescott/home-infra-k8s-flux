apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bulwark-pv.yaml
  - bulwark-deployment.yaml
  - bulwark-networkpolicy.yaml
  - webmail-ingress.yaml
namespace: email-stalwart
secretGenerator:
  # SESSION_SECRET and ADMIN_PASSWORD. No OAuth client secret exists -- Bulwark is registered
  # as a public client using PKCE, see ../stalwart-config/plan.ndjson.
  #
  # Keep the name-suffix hash (i.e. do not set disableNameSuffixHash here, unlike the Stalwart
  # secrets next door): the Deployment mounts this via envFrom, so the hash is what rolls the
  # pod when the secret changes. Without it, rotating SESSION_SECRET would leave the running
  # pod on the old value until something else happened to restart it.
  #
  # A secretGenerator whose `envs` file is missing does not fail locally -- it fails the whole
  # apps/production build and takes every other app down with it. If this file is ever removed,
  # comment this block and the `- bulwark` line in ../kustomization.yaml in the same change.
  - name: bulwark-creds
    envs:
      - .env.secret.bulwark.encrypted
