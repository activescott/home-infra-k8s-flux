# The routes Phase 8 adds to mail.activescott.com. The rest of that hostname is in
# ../mail-setup/mail-setup.yaml, which carries /setup, /robots.txt, /dav and the two DAV
# .well-known paths; Traefik merges rules across Ingresses for the same host, and ranks routers
# by rule specificity, so every narrow rule there and here beats the "/" catch-all below.
#
# Same TLS Secret as the other Ingress on this host. Two Secrets for one SNI name would be a
# coin toss over which certificate gets served.
#
# WHY BULWARK CAN SAFELY OWN "/"
#
# The published image is built with NEXT_PUBLIC_LOCALE_PREFIX=always -- verified by running it,
# not by reading the source, where the default is "never". Every page is therefore under a
# locale segment: "/" redirects to "/en", and the login page is "/en/login", NOT "/login".
# That is what leaves "/login" free for Stalwart's OAuth authorization endpoint. If a future
# image is ever built with a different prefix mode, that collision comes back and the symptom
# will be a login loop.
#
# Not locale-prefixed, and so genuinely at the root: /api/**, /_next/**, /sw.js. None of them
# collide with anything Stalwart serves here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webmail-ingress
  namespace: email-stalwart
spec:
  tls:
    - hosts:
        - mail.activescott.com
      secretName: stalwart-tls
  rules:
    - host: mail.activescott.com
      http:
        paths:
          # --- Stalwart: JMAP. The browser speaks it directly; this app has no JMAP proxy.
          # Covers /jmap/session, /jmap/ws, /jmap/eventsource, /jmap/upload/... and
          # /jmap/download/...
          - path: /jmap
            pathType: Prefix
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080
          - path: /.well-known/jmap
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080

          # --- Stalwart: OpenID Connect discovery.
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080
          - path: /.well-known/oauth-authorization-server
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080

          # --- Stalwart: the OAuth authorization endpoint, which is where the user actually
          # authenticates. This is the one path whose ownership is not obvious; see the note
          # about the locale prefix above.
          - path: /login
            pathType: Prefix
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080

          # --- Stalwart: token exchange, userinfo and signing keys.
          #
          # Exact, deliberately, rather than a /auth prefix: Bulwark serves its own OAuth
          # callback under /auth/callback (which 307s to /en/auth/callback), and a prefix rule
          # would swallow it. Exact rules also leave /auth/register and /auth/device pointing at
          # Bulwark, i.e. NOT reachable on Stalwart -- a second layer behind
          # requireClientRegistration, which is already true.
          - path: /auth/token
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080
          - path: /auth/userinfo
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080
          - path: /auth/jwks.json
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080

          # --- Stalwart: what its login page itself calls.
          #
          # /login is server-rendered but not static -- its inline JS does fetch("/api/auth")
          # to submit the credentials, and it loads /logo. Both were landing on Bulwark, so the
          # page rendered, accepted a password, and then failed with "Temporary server failure"
          # and an http 404 in the console. The page working is not evidence its backend is
          # routed.
          #
          # EXACT, not a prefix, and the distinction is load-bearing: Bulwark's own API lives at
          # /api/auth/sso/start, /api/auth/token, /api/auth/session and so on. It has no route
          # at bare /api/auth -- everything under app/api/auth is a subdirectory -- so exactly
          # one path can be handed to Stalwart without shadowing any of Bulwark's. A prefix rule
          # here would take the whole OAuth client half of the flow with it.
          - path: /api/auth
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080
          - path: /logo
            pathType: Exact
            backend:
              service:
                name: stalwart-admin
                port:
                  number: 8080

---
# Bulwark's catch-all, deliberately in its own Ingress so it can carry an explicit priority.
#
# Traefik's DEFAULT router priority is the LENGTH OF THE RULE STRING, not how specific the path
# is. That makes the obvious mental model wrong:
#
#   Path(`/api/auth`)  = 17  beats  PathPrefix(`/`) = 15   <- works
#   Path(`/logo`)      = 13  loses to PathPrefix(`/`)      <- silently served by Bulwark
#
# Which is exactly what happened: every route above worked except /logo, and it failed by being
# quietly answered by the wrong backend rather than by erroring. Relying on rule length means any
# future path shorter than "PathPrefix(`/`)" is a latent bug.
#
# An explicit priority of 1 puts this router below every other rule on this host regardless of
# length. It is on a separate Ingress because the annotation applies to every router an Ingress
# produces -- putting it on the file above would demote the Stalwart routes too, which is the
# opposite of the intent.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webmail-catchall-ingress
  namespace: email-stalwart
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  tls:
    - hosts:
        - mail.activescott.com
      secretName: stalwart-tls
  rules:
    - host: mail.activescott.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bulwark
                port:
                  number: 80
