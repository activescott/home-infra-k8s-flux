# Bulwark shares a namespace with the mail server (see the note in bulwark-deployment.yaml for
# why), so the namespace boundary is doing none of the isolation work here. These two policies
# are what replaces it.
#
# Egress is the one that matters. Bulwark is a five-month-old third-party app reachable from the
# internet; if it is ever compromised, the interesting next move is reaching something else --
# the other services in this namespace, the rest of the cluster, or an arbitrary host on the
# internet. It genuinely needs exactly two destinations: DNS, and Traefik, for the server-side
# half of the OAuth flow (discovery and token exchange). Everything else is denied.
#
# Traefik rather than Stalwart directly, because the pod resolves mail.activescott.com to
# Traefik's ClusterIP -- see the hostAliases block in bulwark-deployment.yaml for why that name
# has to be preserved rather than swapped for an internal URL. Reaching Stalwart's own ports is
# therefore NOT permitted: not 8080, and not 25, 465, 587, 993 or 4190 on that same pod.
#
# The first version of this file allowed only DNS and Stalwart:8080, which broke SSO outright --
# the pod could not fetch its own discovery document and the login page reported "SSO is enabled
# but the identity provider could not be reached".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bulwark-egress
  namespace: email-stalwart
spec:
  podSelector:
    matchLabels:
      app: bulwark
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Traefik, for OIDC discovery and token exchange against https://mail.activescott.com.
    #
    # 8443, NOT 443. A NetworkPolicy port is the port on the destination POD, and the traefik
    # Service maps 443 -> targetPort `websecure`, which is 8443 in the container. Service DNAT
    # happens before the policy is evaluated, so a rule written for 443 never matches anything.
    # The symptom is not a timeout, which is what a dropped packet usually looks like -- it is
    # an immediate "connection refused", which reads like nothing is listening.
    #
    # Re-derive after any Traefik upgrade that changes its container ports:
    #   kubectl --context nas -n kube-system get endpoints traefik \
    #     -o jsonpath='{range .subsets[*].ports[*]}{.name}:{.port}{"\n"}{end}'
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8443
          protocol: TCP
---
# Only Traefik may reach it. Nothing in the cluster has any business calling this app, and
# leaving the port open to the whole namespace would let a compromise elsewhere use it as a
# confused deputy against the mail server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bulwark-ingress
  namespace: email-stalwart
spec:
  podSelector:
    matchLabels:
      app: bulwark
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 3000
          protocol: TCP
