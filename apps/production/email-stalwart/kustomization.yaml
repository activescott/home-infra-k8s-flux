apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - stalwart-pv.yaml
  - stalwart-pvc.yaml
  - stalwart-certificate.yaml
  - stalwart-admin-ingress.yaml
  - stalwart-metrics-ingress.yaml
  - stalwart-tls-reload.yaml
  - stalwart-statefulset.yaml
  - stalwart-service.yaml
  # ManageSieve, cluster-internal only; used by the sieve-reconcile job.
  - stalwart-sieve-service.yaml
  # Self-contained: its own kustomization carries the manifests and the configMapGenerator for
  # the served content.
  - mail-setup
  # Declarative Stalwart configuration applied by stalwart-cli. Suspended CronJobs, run on
  # demand via ./scripts/stalwart-apply. See docs/specs/stalwart-config-as-code/plan.md.
  - stalwart-config
namespace: email-stalwart
secretGenerator:
  - name: stalwart-creds
    envs:
      - .env.secret.stalwart.encrypted
  # Management API key for stalwart-cli. Separate from stalwart-creds so the CLI Job mounts
  # only what it needs and never sees the recovery admin or the smarthost password.
  - name: stalwart-cli-creds
    envs:
      - .env.secret.stalwart-cli.encrypted
    options:
      # Stable name, unlike stalwart-creds. `./scripts/stalwart-apply query` builds a
      # one-off pod outside kustomize, so it cannot resolve a generated name suffix. Safe
      # here because nothing long-running mounts this Secret — each run is a fresh Job that
      # reads whatever the Secret holds at pod start, so a rotated token is picked up
      # without needing a spec change to trigger it.
      disableNameSuffixHash: true
  # Recovery-admin credentials, split into user and password, used ONLY by the bootstrap
  # job against a fresh server that has no account to hang an API key on. Same value as
  # STALWART_RECOVERY_ADMIN in stalwart-creds; kept separate so the routine apply job never
  # mounts a credential that can log in over mail protocols.
  #
  # These two files hold the same credential and MUST be rotated together. If they drift,
  # nothing breaks until the next rebuild, which then fails at its very first step.
  - name: stalwart-bootstrap-creds
    envs:
      - .env.secret.stalwart-bootstrap.encrypted
    options:
      disableNameSuffixHash: true
  # The automation principal, used only by stalwart-sieve-reconcile. Separate from the API
  # key because per-account Sieve needs a credential that CAN log in over a mail protocol,
  # which an API key deliberately cannot.
  - name: stalwart-automation-creds
    envs:
      - .env.secret.stalwart-automation.encrypted
    options:
      disableNameSuffixHash: true
