apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - stalwart-pv.yaml
  - stalwart-pvc.yaml
  - stalwart-certificate.yaml
  - stalwart-admin-ingress.yaml
  - stalwart-tls-reload.yaml
  - stalwart-statefulset.yaml
  - stalwart-service.yaml
  - mail-setup.yaml
namespace: email-stalwart
configMapGenerator:
  # Generated rather than declared inline so kustomize hashes the content into the ConfigMap
  # names; editing the page or the profile then rolls the mail-setup Deployment.
  - name: mail-setup-content
    files:
      - mail-setup/index.html
      - mail-setup/apple.mobileconfig
  - name: mail-setup-nginx
    files:
      - mail-setup/nginx-default.conf
secretGenerator:
  - name: stalwart-creds
    envs:
      - .env.secret.stalwart.encrypted
