apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - agents-jump-pvc.yaml
  - agents-jump-deployment.yaml
  - agents-jump-service.yaml
  - agents-jump-networkpolicy.yaml
namespace: agents-jump
configMapGenerator:
  - name: agents-jump-config
    files:
      - sshd_config
  # Edited by hand when a key is added or rotated. The name hash changes with the content, so
  # the pod restarts onto the new list, and a key deleted here stops working.
  - name: agents-jump-authorized-keys
    files:
      - authorized_keys
