# The sshd host key, generated on first start. local-path, like ../jumpbox: the key is not
# worth backing up, and losing it costs everyone one known_hosts update rather than any data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agents-jump-hostkeys
  namespace: agents-jump
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 16Mi
