# Full read-only cluster access for a session here, equivalent to the built-in `view` role,
# minus ConfigMaps (ping-poet/dreamwright#123).
#
# `view` already excludes Secrets. ConfigMaps are the remaining gap: they routinely hold values
# that are credential-adjacent or otherwise not meant to be read casually. Removing them keeps
# that class of data out of reach entirely rather than relying on whoever is in the session not
# to look.
#
# RBAC has no deny rules, so "`view` minus ConfigMaps" cannot be expressed as a modification of
# `view`. It has to be built by re-doing what `view` does.
#
# `view` is an AGGREGATED role: it ships with an empty authored rules list and an aggregationRule
# selecting `rbac.authorization.k8s.io/aggregate-to-view: "true"`, and the controller-manager
# unions every labeled ClusterRole's rules into it. Two kinds of role feed it:
#
#   - `system:aggregate-to-view`, labeled `kubernetes.io/bootstrapping: rbac-defaults`. A literal
#     list compiled into Kubernetes covering core, apps, batch, autoscaling, policy,
#     networking.k8s.io, discovery.k8s.io and extensions. `configmaps` is in it. No wildcards,
#     and it knows nothing about CRDs.
#   - Third-party roles shipped by operators: `cert-manager-view`, `flux-view-flux-system`,
#     `system:aggregated-metrics-reader` today. This is the ONLY reason `kubectl get kustomization`
#     or `get certificate` works under `view`, and it is why a fully hand-rolled ClusterRole is
#     the wrong answer: it would lose all CRD coverage and never pick up the next operator.
#
# So jumpbox-view aggregates the same way, excluding only the bootstrap role, and
# jumpbox-view-core below replaces that role's rules with the same list minus configmaps.
#
# Checking what this actually resolves to, after Flux applies it:
#   kubectl --context nas get clusterrole jumpbox-view -o yaml
#   kubectl --context nas auth can-i --as=system:serviceaccount:jumpbox:jumpbox get configmaps -A
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jumpbox
  namespace: jumpbox
---
# `rules` is deliberately absent: the controller-manager owns that field on an aggregated role
# and fills it in. Do not add rules here, or they will fight the aggregation controller. Put
# rules in jumpbox-view-core instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jumpbox-view
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
      matchExpressions:
        - key: kubernetes.io/bootstrapping
          operator: NotIn
          values: ["rbac-defaults"]
    - matchLabels:
        rbac.activescott.com/aggregate-to-jumpbox-view: "true"
---
# `system:aggregate-to-view` verbatim, with `configmaps` removed from the first rule.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jumpbox-view-core
  labels:
    rbac.activescott.com/aggregate-to-jumpbox-view: "true"
rules:
  - apiGroups: [""]
    # configmaps omitted. Secrets were never in `view` to begin with.
    resources:
      - endpoints
      - persistentvolumeclaims
      - persistentvolumeclaims/status
      - pods
      - replicationcontrollers
      - replicationcontrollers/scale
      - serviceaccounts
      - services
      - services/status
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - bindings
      - events
      - limitranges
      - namespaces/status
      - pods/log
      - pods/status
      - replicationcontrollers/status
      - resourcequotas
      - resourcequotas/status
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - controllerrevisions
      - daemonsets
      - daemonsets/status
      - deployments
      - deployments/scale
      - deployments/status
      - replicasets
      - replicasets/scale
      - replicasets/status
      - statefulsets
      - statefulsets/scale
      - statefulsets/status
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers", "horizontalpodautoscalers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "cronjobs/status", "jobs", "jobs/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources:
      - daemonsets
      - daemonsets/status
      - deployments
      - deployments/scale
      - deployments/status
      - ingresses
      - ingresses/status
      - networkpolicies
      - replicasets
      - replicasets/scale
      - replicasets/status
      - replicationcontrollers/scale
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets", "poddisruptionbudgets/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingresses/status", "networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jumpbox-view
subjects:
  - kind: ServiceAccount
    name: jumpbox
    namespace: jumpbox
roleRef:
  kind: ClusterRole
  name: jumpbox-view
  apiGroup: rbac.authorization.k8s.io
---
# Read-only on the Cloudflare Email Routing resources in the `cloudflare` namespace, as a
# ClusterRole because this kustomization rewrites namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jumpbox-email-routing
rules:
  - apiGroups: ["email.cloudflare.m.cloudflare.com"]
    resources:
      - emailroutingaddresses
      - emailroutingcatchalls
      - emailroutingrules
      - emailroutingsettings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["email.activescott.com"]
    resources: ["rolemailboxes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jumpbox-email-routing
subjects:
  - kind: ServiceAccount
    name: jumpbox
    namespace: jumpbox
roleRef:
  kind: ClusterRole
  name: jumpbox-email-routing
  apiGroup: rbac.authorization.k8s.io
