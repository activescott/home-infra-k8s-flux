apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: ramblefeed-image-app
          ports:
            - containerPort: 3200
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: DATABASE_URL
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: NODE_ENV
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: JWT_SECRET
            - name: JWT_MAGIC_LINK_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: JWT_MAGIC_LINK_SECRET
            - name: E2E_MAGIC_LINK_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: E2E_MAGIC_LINK_SECRET
            - name: SNAPSHOT_STORAGE_DIR
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SNAPSHOT_STORAGE_DIR
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: EMAIL_FROM
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_PORT
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_SECURE
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_PASS
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: APP_URL
            - name: POSTHOG_KEY
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: POSTHOG_KEY
            - name: GITHUB_RELEASE_NOTES_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: GITHUB_RELEASE_NOTES_TOKEN
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: TURNSTILE_SITE_KEY
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: TURNSTILE_SECRET_KEY
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "0.1"
              memory: "256Mi"
          # Boot waits for Postgres, runs Prisma migrations, and seeds
          # release notes over the GitHub API before binding :3200. That has
          # taken anywhere from ~20s to 30s+ depending on the GitHub API
          # response time, which can exceed the liveness probe's old
          # initialDelaySeconds(10)+3*periodSeconds(10)=40s budget and get
          # the container SIGTERM'd mid-boot before it ever binds the port
          # (seen in prod on pod app-6db5474b8f-mqfpz, 2026-08-07). The
          # startupProbe gives boot its own budget (30 x 5s = 150s) and
          # suspends liveness/readiness until it succeeds, so they only ever
          # judge an app that has already come up.
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 3200
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 3200
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 3200
            periodSeconds: 10
