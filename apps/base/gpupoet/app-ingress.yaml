# NOTE: We use ingress here rather than a simple service so we can route traffic
#   based on hostname and not only IP. Ingress also has the advantage of being
#   able to serve TLS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpupoet-app-ingress
spec:
  # patched in kustomize for TLS in production
  rules:
    - host: gpupoet.com
      http:
        paths:
          # The rest of /ops is denied in production by app-ops-ingress.yaml in
          # the overlay. /ops/metrics stays public because Prometheus scrapes it
          # at gpupoet.com (job gpupoet_cache_metrics). Traefik ranks rules by
          # length, so this Exact rule outranks that Ingress's /ops Prefix.
          - path: /ops/metrics
            pathType: Exact
            backend:
              service:
                name: app
                port:
                  name: web-ui

          # Allow all other traffic to the app
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                # port of the referenced service. A port name or port number is required for a IngressServiceBackend.
                port:
                  name: web-ui
