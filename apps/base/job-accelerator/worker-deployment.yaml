# The task worker (activescott/job-accelerator#36): claims rows from the
# `task` table and, for now, polls the watched ATS boards hourly. Same image
# as the app, started with its own command, so the two always run the same
# release. Setting `command` bypasses docker-entrypoint.sh, so the worker
# never runs migrations; the app pod does.
#
# No ports, no ingress, no probes: the process listens on nothing, and
# Kubernetes restarting it when it exits is the whole liveness story.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # One worker, and never two at once, not even during a rollout: the
  # stale-claim sweep treats any claim older than 30 minutes as a dead pod's.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        app.activescott.com/component: worker
    spec:
      # worker.ts aborts its loop on SIGTERM and lets the task in flight
      # finish, so its row is not left claimed.
      terminationGracePeriodSeconds: 60
      # The image runs as uid 1000 (activescott/job-accelerator#101); the keys
      # dataset must be chowned to 1000:1000 first, see
      # apps/production/job-accelerator/README.md#keystore-dataset.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: job-accelerator-image-app
          command: ["node", "--enable-source-maps", "build/worker/worker.js"]
          # Same uid as the app, which writes the key files 0600: this has to read
          # them. See app-deployment.yaml for why that is still root. It never runs
          # the entrypoint, so nothing here writes to the image; /tmp is there in
          # case a library reaches for os.tmpdir().
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # The whole secret rather than the app's per-key list. The worker
          # reads DATABASE_URL, JWT_SECRET, SMTP_USER and SMTP_PASS (the env
          # schema requires the last two in production), OPENROUTER_API_KEY,
          # and LOG_LEVEL if set.
          #
          # parse_profile reads and writes client data, so the worker needs
          # the same models, keystore and master key as the app. The keys
          # PVC is ReadWriteOnce, which binds it to one node, not one pod;
          # on this single-node cluster both pods mount it.
          envFrom:
            - secretRef:
                name: app-creds
            - configMapRef:
                name: models
          env:
            - name: NODE_ENV
              value: production
            # Must match the app's; see app-deployment.yaml.
            - name: KEYSTORE_DIR
              value: /keys
            - name: MASTER_KEY_ACTIVE
              value: "1"
            - name: MASTER_KEY_1
              valueFrom:
                secretKeyRef:
                  name: master-key
                  key: MASTER_KEY_1
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: "0.5"
              memory: "512Mi"
            requests:
              cpu: "0.02"
              memory: "128Mi"
      volumes:
        - name: keys
          persistentVolumeClaim:
            claimName: keys
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
