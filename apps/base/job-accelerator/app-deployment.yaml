apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        app.activescott.com/component: app
    spec:
      containers:
        - name: app
          image: job-accelerator-image-app
          ports:
            - containerPort: 3300
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: JWT_SECRET
            # The only addresses that can sign in. Kept in the encrypted
            # secret rather than here because this repo is public.
            - name: ALLOWED_EMAILS
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: ALLOWED_EMAILS
            # The one address that may read client records. ALLOWED_EMAILS
            # admits Scott and Olya too; they sign in and get a 403 on
            # anything client-owned (Scott, 2026-09-17,
            # activescott/activeassistant#132). Unset admits nobody, so
            # dropping this hides client data rather than exposing it. Its
            # own Secret because the address belongs to a private person and
            # this repo is public.
            - name: CLIENT_DATA_OWNER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: client-owner
                  key: CLIENT_DATA_OWNER_EMAIL
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: FROM_EMAIL
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_PORT
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_SECURE
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_PASS
            # optional: the logger falls back to its own default level.
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: LOG_LEVEL
                  optional: true
            # Envelope encryption, docs/design/encryption.md in the app repo.
            # Every client's data key lives in a file under KEYSTORE_DIR,
            # wrapped under MASTER_KEY_<MASTER_KEY_ACTIVE>. The app unwraps a
            # check value at startup and refuses to serve if the key does not
            # match the keystore.
            - name: KEYSTORE_DIR
              value: /keys
            - name: MASTER_KEY_ACTIVE
              value: "1"
            # Its own Secret, so it can be audited and rotated without
            # touching app-creds. Rotation is not a one-line change: see
            # apps/production/job-accelerator/README.md#master-key.
            - name: MASTER_KEY_1
              valueFrom:
                secretKeyRef:
                  name: master-key
                  key: MASTER_KEY_1
            # The retention timer in docs/design/flows.md: prompt Oksana once
            # a client has gone this long unviewed, then delete this many days
            # after an unanswered prompt (Scott's A = 90, B = 14). Set ahead of
            # the sweep task that reads them; the env schema ignores unknown
            # names, so they are inert until it lands.
            - name: RETENTION_PROMPT_DAYS
              value: "90"
            - name: RETENTION_DELETE_DAYS
              value: "14"
          volumeMounts:
            - name: keys
              mountPath: /keys
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "0.05"
              memory: "128Mi"
          # Boot runs Prisma migrations before binding :3300, which can exceed
          # a liveness probe's budget; the startupProbe gives boot its own
          # 150s (30 x 5s) and suspends the other two until it passes. Same
          # reasoning as fernfiles' app-deployment.yaml.
          startupProbe:
            httpGet:
              path: /ops/health/readiness
              port: 3300
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ops/health/readiness
              port: 3300
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ops/health/liveness
              port: 3300
            periodSeconds: 10
      volumes:
        - name: keys
          persistentVolumeClaim:
            claimName: keys
