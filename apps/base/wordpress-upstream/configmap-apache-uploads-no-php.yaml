apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-apache-uploads-no-php
data:
  # Mounted into /etc/apache2/conf-enabled/, which apache2.conf includes.
  #
  # Nothing under uploads is ever meant to run. `engine off` is a
  # php_admin_ setting, so a planted .htaccess cannot turn PHP back on. With
  # the engine off, mod_php would serve a .php file's source instead, so the
  # LocationMatch refuses those names outright, with or without a trailing
  # PATH_INFO like x.php/anything. Location is merged after
  # <Directory>, <Files> and .htaccess, so nothing in uploads can override it.
  #
  # php_admin_flag is not wrapped in <IfModule>: if mod_php is ever missing
  # from the image, Apache should refuse to start rather than drop the rule.
  uploads-no-php.conf: |
    <Directory "/var/www/html/wp-content/uploads">
        php_admin_flag engine off
    </Directory>
    <LocationMatch "(?i)^/+wp-content/uploads/.*\.(php[0-9s]?|pht|phtml|phar)(/|$)">
        Require all denied
    </LocationMatch>
