apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
    role: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
      role: web
  # RWO PVC + 1 replica → use Recreate so the new pod can mount
  # the PVC after the old pod releases (RollingUpdate would deadlock
  # on the volume handoff).
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wordpress
        role: web
    spec:
      # Official wordpress image runs Apache as www-data (uid:gid 33:33).
      securityContext:
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      # WordPress never calls the Kubernetes API.
      automountServiceAccountToken: false
      initContainers:
        # Core lives in the image, not on a volume, and the running container
        # cannot change it: /var/www/html is mounted read-only below. The
        # running version is always the image tag, and a core update is an
        # image bump and nothing else.
        #
        # The image's entrypoint copies /usr/src/wordpress into
        # /var/www/html and writes wp-config.php when index.php is missing.
        # `docker-ensure-installed.sh` is the same script
        # (docker-library/wordpress#969): it does that work and then execs
        # its arguments, here `true`, instead of starting Apache. It needs
        # one WORDPRESS_* variable to decide to write wp-config.php; the
        # file reads everything else from the environment at request time,
        # so the secrets stay on the main container.
        #
        # wp-content is mounted so the copy skips it the same way it did
        # before, adding only bundled themes and plugins that are missing.
        # This is the only place anything writes to wp-content outside
        # uploads/. The script then creates uploads/ if it is missing, so
        # the kubelet finds it for the subPath mount below instead of
        # creating it owned by root, which WordPress could not write.
        #
        # As uid 33 the entrypoint extracts with --no-overwrite-dir and as
        # its own user, so it needs the emptyDir (0777) and a wp-content
        # owned by 33:33, which the tenant README already requires.
        - name: install-core
          image: wordpress:7.1.2-php8.3-apache@sha256:4abf7a450ee477dde967584f8174d7e03221d224c4971a0c38d84e7254426e64
          command: ["docker-ensure-installed.sh"]
          args: ["mkdir", "-p", "wp-content/uploads"]
          workingDir: /var/www/html
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /var/www/html
              name: wordpress-core
            - mountPath: /var/www/html/wp-content
              name: wp-content
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "50m"
      containers:
        - name: wordpress
          # Tags: https://hub.docker.com/_/wordpress/tags
          # Keep in step with install-core above; Renovate bumps both.
          image: wordpress:7.1.2-php8.3-apache@sha256:4abf7a450ee477dde967584f8174d7e03221d224c4971a0c38d84e7254426e64
          env:
            # In-namespace DNS name of the mariadb Service.
            - name: WORDPRESS_DB_HOST
              value: mariadb
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-db-user
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-db-password
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-db-name
            - name: WORDPRESS_TABLE_PREFIX
              value: wp_
            # WP secret keys + salts. Passing these as env vars
            # makes the official image's wp-config.php template
            # bake the same values that the prior install used,
            # so logged-in user sessions and password reset tokens
            # survive the migration.
            - name: WORDPRESS_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-auth-key
            - name: WORDPRESS_SECURE_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-secure-auth-key
            - name: WORDPRESS_LOGGED_IN_KEY
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-logged-in-key
            - name: WORDPRESS_NONCE_KEY
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-nonce-key
            - name: WORDPRESS_AUTH_SALT
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-auth-salt
            - name: WORDPRESS_SECURE_AUTH_SALT
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-secure-auth-salt
            - name: WORDPRESS_LOGGED_IN_SALT
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-logged-in-salt
            - name: WORDPRESS_NONCE_SALT
              valueFrom:
                secretKeyRef:
                  name: wordpress-creds
                  key: wordpress-nonce-salt
          ports:
            - name: http
              containerPort: 80
          # Apache's master starts as root to bind :80 and then runs its
          # children as www-data. SETUID and SETGID are for that switch,
          # NET_BIND_SERVICE for :80, and KILL because the master signals
          # its children on shutdown, and without KILL root cannot signal a
          # process that belongs to another user. Nothing chowns at start:
          # the entrypoint skips its copy and wp-config steps because
          # install-core already did them, and Apache listens on one port,
          # so it creates no accept mutex file.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID", "NET_BIND_SERVICE", "KILL"]
          volumeMounts:
            - mountPath: /var/www/html
              name: wordpress-core
              readOnly: true
            # Only uploads/ is writable. WordPress includes PHP from the rest
            # of wp-content on every request (plugins, themes, drop-ins like
            # db.php and object-cache.php, languages/*.l10n.php), so none of
            # it may be writable. With DISALLOW_FILE_MODS and auto-updates
            # off, core writes nowhere else: upgrade/ and languages/ are
            # written only by the upgrader, debug.log only with
            # WP_DEBUG_LOG, and the Font Library writes to uploads/fonts.
            # Temporary files go to /tmp. PHP does not run from uploads/
            # (see configmap-apache-wp-content-no-php.yaml).
            - mountPath: /var/www/html/wp-content
              name: wp-content
              readOnly: true
            - mountPath: /var/www/html/wp-content/uploads
              subPath: uploads
              name: wp-content
            # PHP uploads, sessions and image processing.
            - mountPath: /tmp
              name: tmp
            # APACHE_RUN_DIR and APACHE_LOCK_DIR from /etc/apache2/envvars:
            # the pid file and the mutexes. Logs are symlinks to
            # stdout/stderr and need nothing.
            - mountPath: /var/run/apache2
              name: apache-run
            - mountPath: /var/lock/apache2
              name: apache-lock
            - mountPath: /usr/local/etc/php/conf.d/uploads.ini
              subPath: uploads.ini
              name: php-uploads
            - mountPath: /usr/local/etc/php/conf.d/zz-request-guard.ini
              subPath: request-guard.ini
              name: php-request-guard
            - mountPath: /usr/local/etc/php/request-guard.php
              subPath: request-guard.php
              name: php-request-guard
            - mountPath: /etc/apache2/conf-enabled/zz-wp-content-no-php.conf
              subPath: wp-content-no-php.conf
              name: apache-wp-content-no-php
          resources:
            limits:
              memory: "1Gi"
              cpu: "1"
            requests:
              memory: "256Mi"
              cpu: "100m"
          # curl from inside the pod, so the request arrives from 127.0.0.1,
          # the one non-LAN address configmap-php-request-guard.yaml lets
          # into wp-login.php. An httpGet probe comes from the node, and
          # letting that address in would also let in anything else that
          # arrives as the node. `/` is no substitute: the probe's Host is the
          # pod IP, so WordPress answers with a redirect to WP_HOME, which the
          # kubelet records as a warning event on every probe.
          readinessProbe:
            exec:
              command:
                ["curl", "-fsS", "-o", "/dev/null", "--max-time", "5", "http://127.0.0.1/wp-login.php"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                ["curl", "-fsS", "-o", "/dev/null", "--max-time", "10", "http://127.0.0.1/wp-login.php"]
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wordpress-wp-content
        - name: wordpress-core
          emptyDir:
            sizeLimit: 512Mi
        # Sized for upload_max_filesize in configmap-php-uploads.yaml.
        - name: tmp
          emptyDir:
            sizeLimit: 3Gi
        - name: apache-run
          emptyDir:
            sizeLimit: 16Mi
        - name: apache-lock
          emptyDir:
            sizeLimit: 16Mi
        - name: php-uploads
          configMap:
            name: wordpress-php-uploads
        - name: php-request-guard
          configMap:
            name: wordpress-php-request-guard
        - name: apache-wp-content-no-php
          configMap:
            name: wordpress-apache-wp-content-no-php
