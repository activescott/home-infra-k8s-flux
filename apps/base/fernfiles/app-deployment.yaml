apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        app.activescott.com/component: app
    spec:
      containers:
        - name: app
          image: fernfiles-image-app
          ports:
            - containerPort: 3200
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: NODE_ENV
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: APP_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: DATABASE_URL
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: FROM_EMAIL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: JWT_SECRET
            - name: E2E_MAGIC_LINK_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: E2E_MAGIC_LINK_SECRET
            # The next three are set in dev/e2e env files only; the production
            # secret omits the keys so they fall back to code defaults there
            # (E2E_TEST_MODE must never be true in production).
            - name: E2E_TEST_MODE
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: E2E_TEST_MODE
                  optional: true
            - name: ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: ADMIN_EMAILS
                  optional: true
            - name: AUTO_APPROVE_EMAILS
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: AUTO_APPROVE_EMAILS
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_PORT
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_SECURE
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: SMTP_PASS
            # optional: the Turnstile bot check is disabled when the keys are
            # absent (dev/e2e); prod deploys both keys.
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: TURNSTILE_SITE_KEY
                  optional: true
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: TURNSTILE_SECRET_KEY
                  optional: true
            # optional: dev/e2e send no real SMS (the sms provider uses the
            # console/capture transport there); prod app-creds has all three
            # and the app refuses to start in production without them.
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: TWILIO_ACCOUNT_SID
                  optional: true
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: TWILIO_AUTH_TOKEN
                  optional: true
            - name: TWILIO_VERIFY_SERVICE_SID
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: TWILIO_VERIFY_SERVICE_SID
                  optional: true
            # optional: the logger falls back to its own default level.
            - name: LOG_LEVEL
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: LOG_LEVEL
                  optional: true
            # optional: the code default (/data/storage) matches the app-data
            # volume mount below, so prod needs no secret entry.
            - name: STORAGE_DIR
              valueFrom:
                secretKeyRef:
                  name: app-creds
                  key: STORAGE_DIR
                  optional: true
          volumeMounts:
            - name: app-data
              mountPath: /data/storage
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "0.1"
              memory: "256Mi"
          # Boot work before binding :3200 (Phase 3 adds waiting for Postgres
          # and running Prisma migrations) can exceed a liveness probe's
          # initialDelaySeconds(10)+3*periodSeconds(10)=40s budget and get
          # the container SIGTERM'd mid-boot before it ever binds the port
          # (seen in ramblefeed prod on pod app-6db5474b8f-mqfpz,
          # 2026-08-07). The startupProbe gives boot its own budget
          # (30 x 5s = 150s) and suspends liveness/readiness until it
          # succeeds, so they only ever judge an app that has already come
          # up.
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 3200
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 3200
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 3200
            periodSeconds: 10
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data
