apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    # The app owns every body limit with friendly errors: busboy caps for
    # multipart uploads (10 GiB/file default) and a 4 MiB app-level guard on
    # urlencoded posts (the bound this annotation used to enforce for editor
    # saves). "0" disables nginx's check so no request dies here as a bare
    # 413.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # Required at multi-GiB sizes: default-on buffering would spool the
    # entire request body to the ingress controller's disk before
    # forwarding, risking controller ephemeral-storage eviction. Off streams
    # the body straight through to the app, which streams it to its own
    # disk atomically.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  rules:
    - host: fernfiles.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 3300
