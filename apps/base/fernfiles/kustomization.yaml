apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app-deployment.yaml
  - app-service.yaml
  - app-ingress.yaml
  - app-data-pvc.yaml
  - db-statefulset.yaml
  - db-service.yaml
  # Transcode worker (activescott/fernfiles issue #140). Runs ffmpeg for the
