apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  rules:
    - host: browser-chaperone.local
      http:
        paths:
          # /ops is denied in production by app-ops-ingress.yaml in the overlay. Everything
          # else under / is public, including /requests and POST /slack/interactions
          # (browser-chaperone#54); /internal/* is reachable but refuses any call without
          # INTERNAL_API_TOKEN.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 3400
