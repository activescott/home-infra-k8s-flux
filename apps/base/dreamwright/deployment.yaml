apiVersion: apps/v1
kind: Deployment
metadata:
  name: dreamwright
spec:
  # Sign-in challenges are held in memory, so a second replica would reject codes the
  # first one issued.
  replicas: 1
  selector:
    matchLabels:
      app: dreamwright
  template:
    metadata:
      labels:
        app: dreamwright
    spec:
      imagePullSecrets:
        - name: github-container-registry-secret
      initContainers:
        # Applies Prisma migrations from the same image before the app starts. The image
        # carries the engines, so this runs with a read-only root filesystem.
        - name: migrate
          image: dreamwright-image
          command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: app-creds

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "0.05"
              memory: "128Mi"
      containers:
        - name: dreamwright
          # NOTE: this image is replaced with an images transformer in the overlay: https://kubectl.docs.kubernetes.io/references/kustomize/builtins/#_imagetagtransformer
          image: dreamwright-image

          envFrom:
            - secretRef:
                name: app-creds
          env:
            # One key per customer's Slack tokens. Kept off the database's volume so that
            # deleting a key makes that customer's tokens in a database backup unreadable.
            - name: TOKEN_KEY_DIR
              value: /token-keys

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: token-keys
              mountPath: /token-keys

          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "0.05"
              memory: "128Mi"

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: token-keys
          persistentVolumeClaim:
            claimName: token-keys
