apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
spec:
  # Exposes the Service on a cluster-internal IP. Choosing this value makes the Service only reachable from within the cluster
  # We expose it externally via an Ingress so that we can match requested domain/url to map here.
  type: ClusterIP
  selector:
    app: notification-controller
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 9292
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webhook-receiver
spec:
  tls:
    - hosts:
        - flux-webhook.activescott.com
      # There must a a Certificate resource created that saves to this secret name
      secretName: flux-webhook-activescott-com-tls

  rules:
    - host: flux-webhook.activescott.com
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: webhook-receiver
                # port of the referenced service. A port name or port number is required for a IngressServiceBackend.
                port:
                  number: 80
---
# policy that permits the traffic from into the challenge pod per https://fluxcd.io/flux/guides/webhook-receivers/
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-cert-manager-resolver
  namespace: "flux-system"
spec:
  ingress:
    # This empty rule allows all sources
    - from:
        - namespaceSelector: {}
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
---
# ⚠️  IMPORTANT: When adding new ImageRepository resources, they must be added here too!
# This Receiver tells Flux which ImageRepositories to reconcile when GitHub webhooks arrive.
#
# To verify all ImageRepositories are registered, run: scripts/validate-webhook-receiver.sh
# The git commit hook also checks this automatically.
#
# See also: scripts/update-flux-image-scanning-webhooks/manage-webhooks.ts for managing
# GitHub webhook configuration.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: webhook-receiver-image
spec:
  type: github
  # NOTE: events field empty because: "If left empty, no filtering is applied and any (valid) payload is handled." – https://fluxcd.io/flux/components/notification/receivers/#events
  #events:
  #  - "ping"
  #  - "package"
  secretRef:
    name: webhook-token
  resources:
    # repo-tayle-app / repo-tayle-worker removed 2026-08-26 alongside ./tayle in
    # apps/production/kustomization.yaml — see the comment there for why. Restoring
    # tayle means re-adding both here and there.
    - kind: ImageRepository
      name: repo-scott-willeke-com
      namespace: scott-willeke-com-prod
    - kind: ImageRepository
      name: repo-gpupoet-app
      namespace: gpupoet-prod
    - kind: ImageRepository
      name: repo-ramblefeed-app
      namespace: ramblefeed-prod
    - kind: ImageRepository
      name: repo-tinkerbell-app
      namespace: tinkerbell-prod
    - kind: ImageRepository
      name: repo-tinkerbell-mcp-gateway
      namespace: tinkerbell-prod
    - kind: ImageRepository
      name: repo-amazon-searcher
      namespace: gpupoet-prod
    - kind: ImageRepository
      name: repo-indexnow-notifier
      namespace: gpupoet-prod
    - kind: ImageRepository
      name: repo-gpu-poet-collector
      namespace: gpupoet-prod
    - kind: ImageRepository
      name: repo-fernfiles-app
      namespace: fernfiles-prod
    # The worker needs its own entry: build.yaml tags both fernfiles images
    # v<version> from one release, but a Receiver only reconciles the
    # ImageRepositories it lists, so without this the worker deploys on the 5h
    # fallback scan while the app deploys immediately. Missed when the worker
    # was split out (activescott/fernfiles #140) — it left v0.43.0's worker on
    # the previous tag until the scan was forced by hand, hours after the app
    # had rolled. Same shape as repo-tayle-worker above.
    - kind: ImageRepository
      name: repo-fernfiles-worker
      namespace: fernfiles-prod
    # Same reason as the worker: build.yaml tags app, worker, and
    # inference-service v<version> from one release, so this needs its own
    # Receiver entry to roll with the others. Missed when the inference
    # service was added (8424fde) — validate-webhook-receiver.sh catches it
    # on every commit but the missing entry was never filed. See the
    # comment in apps/production/fernfiles/image-scanning/inference-service-image-scanning.yaml.
    - kind: ImageRepository
      name: repo-fernfiles-inference-service
      namespace: fernfiles-prod
    # ARC (Actions Runner Controller) — public images on ghcr.io/actions/*
    # GitHub does not send webhooks for these (they live in another user's repo),
    # so the receiver entry is only here to satisfy the validate-webhook-receiver
    # check. Updates rely on the periodic ImageRepository scan interval.
    - kind: ImageRepository
      name: repo-arc-controller
      namespace: arc-systems
    - kind: ImageRepository
      name: repo-actions-runner
      namespace: arc-runners
