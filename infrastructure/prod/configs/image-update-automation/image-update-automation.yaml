# Repo-wide ImageUpdateAutomation — the ONLY one in this repo. With
# update.path ./ it rewrites every $imagepolicy marker in the repo, serving
# all ImageRepository/ImagePolicy pairs (every image-scanning*/ dir). Do not
# add a second one: parallel automations race and misattribute commits.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: update-images
spec:
  interval: 4h
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      # messageTemplate from https://fluxcd.io/flux/guides/image-update/#configure-image-updates
      messageTemplate: "automated image update(s) by {{ .AutomationObject }}: {{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}"
    push:
      branch: main
  update:
    path: ./
