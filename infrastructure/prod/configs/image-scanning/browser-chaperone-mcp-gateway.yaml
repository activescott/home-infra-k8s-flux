apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: repo-browser-chaperone-mcp-gateway
  annotations:
    activescott.com/source-repo: activescott/browser-chaperone
spec:
  image: ghcr.io/activescott/browser-chaperone/mcp-gateway
  interval: 5h
  secretRef:
    name: github-container-registry-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: policy-browser-chaperone-mcp-gateway
spec:
  imageRepositoryRef:
    name: repo-browser-chaperone-mcp-gateway
  policy:
    semver:
      range: ">=0.0.0"
