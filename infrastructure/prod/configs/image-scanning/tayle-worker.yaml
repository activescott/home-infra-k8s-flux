apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: repo-tayle-worker
spec:
  image: ghcr.io/tayle-co/tayle/worker
  interval: 5h
  secretRef:
    name: github-container-registry-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: policy-tayle-worker
spec:
  imageRepositoryRef:
    name: repo-tayle-worker
  policy:
    semver:
      range: "1.x"
