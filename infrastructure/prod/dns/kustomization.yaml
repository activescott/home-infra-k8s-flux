# Cloudflare DNS as managed resources, one directory per zone.
#
# Every record carries its zone's ID in `spec.forProvider.zoneId`. Once Phase 3
# adopts the real zones, prefer adopting a `Zone` managed resource per zone and
# pointing records at it with `zoneIdRef`, so each zone ID appears once per zone
# rather than once per record.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - productpoet.com
