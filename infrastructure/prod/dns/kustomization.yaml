# Cloudflare DNS: one file per zone under zones/, each a DNSZone listing that
# zone's records. The DNSZone API is defined in
# ../controllers/crossplane-config/dnszone/ -- read its README before editing a
# zone file, particularly the part about `key` being load-bearing.
#
# Kustomize does not expand globs, so each zone file is listed explicitly. That is
# a feature here: adding a zone to DNS is a visible line in a diff, not a
# side effect of creating a file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - zones/activescott.com.yaml
  - zones/coinpoet.com.yaml
  - zones/datamanifest.com.yaml
  - zones/fernfiles.com.yaml
  - zones/gpupoet.com.yaml
  - zones/pingpoet.com.yaml
  - zones/productpoet.com.yaml
  - zones/ramblefeed.com.yaml
  - zones/tinkerbellbot.com.yaml
  # Email Routing rules, one file per zone. Kept out of zones/ because these are ordinary
  # managed resources, not records fanned out through the DNSZone composition.
  #
  # pingpoet.com and productpoet.com are absent on purpose. Email Routing is `unconfigured`
  # on both, and Cloudflare still returns a placeholder disabled catch-all for a zone that
  # has never enabled the feature. Adopting that would declare configuration that does not
  # exist. Add a file here if either zone ever turns routing on.
  - email-routing/activescott.com.yaml
  - email-routing/coinpoet.com.yaml
  - email-routing/datamanifest.com.yaml
  - email-routing/fernfiles.com.yaml
  - email-routing/gpupoet.com.yaml
  - email-routing/ramblefeed.com.yaml
  - email-routing/tinkerbellbot.com.yaml
