# Throwaway record used to prove the git -> Flux -> Crossplane -> Cloudflare path
# end to end before Phase 3 adopts the real zones. productpoet.com is a parked
# domain with a single apex TXT, so nothing depends on this name resolving.
#
# Delete this file once Phase 3 is underway.
apiVersion: dns.cloudflare.m.cloudflare.com/v1alpha1
kind: DNSRecord
metadata:
  name: flux-probe
  namespace: cloudflare
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    # productpoet.com. Cloudflare zone IDs are not credentials -- they appear in
    # dashboard URLs and grant nothing without an API token -- but see the note in
    # kustomization.yaml about where these should live once real zones are adopted.
    zoneId: 467a5ad3fda60cfde71636fd7447e733
    name: flux-probe.productpoet.com
    type: TXT
    content: delivered by flux 2026-08-27
    ttl: 300
    comment: Phase 2 git->Flux delivery probe; safe to delete
