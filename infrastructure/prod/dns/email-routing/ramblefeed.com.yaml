# Email Routing rules for ramblefeed.com. See fernfiles.com.yaml in this directory for
# why routing is declarative here while Email Sending onboarding is not.
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingRule
metadata:
  name: ramblefeed-com-dmarc
  namespace: cloudflare
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    zoneId: e520413f6aef57eb975b6a1304132116
    # Destination for the rua= address in _dmarc.ramblefeed.com. Without a rule, aggregate
    # reports bounce and the p=none monitoring period observes nothing.
    name: dmarc-reports
    enabled: true
    priority: 10
    matchers:
      - type: literal
        field: to
        value: dmarc@ramblefeed.com
    actions:
      - type: forward
        value:
          - scott@willeke.com
