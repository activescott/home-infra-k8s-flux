# Email Routing rules for tinkerbellbot.com. See fernfiles.com.yaml in this directory for
# why routing is declarative here while Email Sending onboarding is not.
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingRule
metadata:
  name: tinkerbellbot-com-dmarc
  namespace: cloudflare
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    zoneId: de97633dfb5edea4c5d5e63d13fd6a84
    # Destination for the rua= address in _dmarc.tinkerbellbot.com. Without a rule,
    # aggregate reports bounce and the p=none monitoring period observes nothing.
    name: dmarc-reports
    enabled: true
    priority: 10
    matchers:
      - type: literal
        field: to
        value: dmarc@tinkerbellbot.com
    actions:
      - type: forward
        value:
          - scott@willeke.com
