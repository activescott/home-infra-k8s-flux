# Email Routing rules for tinkerbellbot.com. See fernfiles.com.yaml in this directory for
# why routing is declarative here while Email Sending onboarding is not.
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingRule
metadata:
  name: tinkerbellbot-com-dmarc
  namespace: cloudflare
  annotations:
    # Created by Crossplane on 2026-08-28, then pinned. See fernfiles.com.yaml for why.
    crossplane.io/external-name: 839b01eab8c64f619e320be0b5f31669
spec:
  # Everything except Delete: Crossplane may observe, create and update these rules but never
  # remove them from Cloudflare. Adoption transfers ownership, not lifecycle -- several of these
  # predate Crossplane by years -- and with `prune: true` on both cluster Kustomizations a
  # kustomize path typo would otherwise delete real mail routing.
  #
  # This is the v2 spelling. `deletionPolicy: Orphan` does NOT exist on namespaced managed
  # resources (`*.m.cloudflare.com`); setting it fails the Flux dry-run with
  # ".spec.deletionPolicy: field not declared in schema" and blocks the whole kustomization.
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    zoneId: de97633dfb5edea4c5d5e63d13fd6a84
    # Destination for the rua= address in _dmarc.tinkerbellbot.com. Without a rule,
    # aggregate reports bounce and the p=none monitoring period observes nothing.
    name: dmarc-reports
    enabled: true
    priority: 10
    matchers:
      - type: literal
        field: to
        value: dmarc@tinkerbellbot.com
    actions:
      - type: forward
        value:
          - scott@willeke.com
---
# Predates Crossplane, created through the dashboard on 2026-02-23. Adopted by its existing
# rule id so ownership transfers without the rule changing. The name is Cloudflare's
# auto-generated label, reproduced verbatim -- see ramblefeed.com.yaml.
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingRule
metadata:
  name: tinkerbellbot-com-scott
  namespace: cloudflare
