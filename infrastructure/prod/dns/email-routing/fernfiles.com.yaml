# Email Routing rules for fernfiles.com. Unlike Email Sending, routing is fully
# declarative -- the provider serves EmailRoutingRule directly, so these are ordinary
# managed resources rather than composed ones.
#
# Routing is already enabled on this zone (status: ready) with the apex MX, SPF and
# cf2024-1 DKIM records adopted in zones/fernfiles.com.yaml. Those records are Cloudflare's,
# but unlike the Email Sending ones they can be unlocked, which is why they are fully
# managed there and the cf-bounce ones are not.
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingRule
metadata:
  name: fernfiles-com-dmarc
  namespace: cloudflare
  annotations:
    # Created by Crossplane on 2026-08-28, then pinned here. See the note at the bottom of
    # this file for why the id is written back into git rather than left to the controller.
    crossplane.io/external-name: 28e88c59e5c5488697277d99598a7b32
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    zoneId: dad431388d3f4e6e76b5bcbeac28d56a
    # Destination for the rua= address in _dmarc.fernfiles.com. Without a rule, aggregate
    # reports bounce and the p=none monitoring period observes nothing.
    name: dmarc-reports
    enabled: true
    priority: 10
    matchers:
      - type: literal
        field: to
        value: dmarc@fernfiles.com
    actions:
      - type: forward
        value:
          - scott@willeke.com
---
# The two addresses the shipped policy pages already publish. Until these existed, both pages
# pointed users at addresses that hit the dropping catch-all below, so a privacy request or a
# support mail was accepted by Cloudflare and silently discarded.
#
# Created by Crossplane rather than adopted -- no external-name annotation -- so Cloudflare
# assigns the rule id and writes it back. Priority is deliberately the same 10 as the DMARC
# rule: literal matchers cannot overlap, so relative order between them never decides delivery.
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingRule
metadata:
  name: fernfiles-com-privacy
  namespace: cloudflare
  annotations:
    crossplane.io/external-name: fabc55828afc432184868f9ad0ffede4
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    zoneId: dad431388d3f4e6e76b5bcbeac28d56a
    name: privacy
    enabled: true
    priority: 10
    matchers:
      - type: literal
        field: to
        value: privacy@fernfiles.com
    actions:
      - type: forward
        value:
          - scott@willeke.com
---
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingRule
metadata:
  name: fernfiles-com-support
  namespace: cloudflare
  annotations:
    crossplane.io/external-name: 24bb47ac27064ec7a258be8fc1cd33df
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    zoneId: dad431388d3f4e6e76b5bcbeac28d56a
    name: support
    enabled: true
    priority: 10
    matchers:
      - type: literal
        field: to
        value: support@fernfiles.com
    actions:
      - type: forward
        value:
          - scott@willeke.com
---
# Disabled, dropping catch-all. See ramblefeed.com.yaml for why this is EmailRoutingCatchAll
# rather than a second EmailRoutingRule.
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingCatchAll
metadata:
  name: fernfiles-com-catch-all
  namespace: cloudflare
  annotations:
    crossplane.io/external-name: 1e2a6ca9c98d4e85a6890d6f0b108fd4
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    zoneId: dad431388d3f4e6e76b5bcbeac28d56a
    enabled: false
    matchers:
      - type: all
    actions:
      - type: drop
#
# Why every rule in this directory carries an external-name, including the ones Crossplane
# created itself.
#
# When these five rules were first applied without one, the creates succeeded -- Cloudflare
# made each rule exactly once -- but the Observe that runs immediately afterwards, which is
# what reads the assigned id back out and writes it into the external-name annotation, was
# rejected with 429 Too Many Requests. Cloudflare rate-limits the Email Routing endpoints far
# more tightly than DNS, and seventeen resources reconciling at once cleared that limit.
#
# The result is a resource that is created but has no external name. Crossplane records
# `crossplane.io/external-create-succeeded` for exactly this case and then refuses to act,
# which is what stopped it creating a second copy of every rule on the next pass -- the failure
# this whole adoption strategy is built to avoid. It is safe, but it is stuck, and it does not
# resolve on its own: with no external name there is nothing for a later Observe to look up.
#
# Pinning the id here is the durable repair. It converts a create into an adoption, which is
# idempotent, breaks the error loop that was sustaining the 429, and survives the managed
# resource being deleted and recreated. An in-cluster `kubectl annotate` would have fixed the
# symptom until the next time something reapplied from git.
