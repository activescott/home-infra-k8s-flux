# Email Routing rules for fernfiles.com. Unlike Email Sending, routing is fully
# declarative -- the provider serves EmailRoutingRule directly, so these are ordinary
# managed resources rather than composed ones.
#
# Routing is already enabled on this zone (status: ready) with the apex MX, SPF and
# cf2024-1 DKIM records adopted in zones/fernfiles.com.yaml. Those records are Cloudflare's,
# but unlike the Email Sending ones they can be unlocked, which is why they are fully
# managed there and the cf-bounce ones are not.
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingRule
metadata:
  name: fernfiles-com-dmarc
  namespace: cloudflare
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    zoneId: dad431388d3f4e6e76b5bcbeac28d56a
    # Destination for the rua= address in _dmarc.fernfiles.com. Without a rule, aggregate
    # reports bounce and the p=none monitoring period observes nothing.
    name: dmarc-reports
    enabled: true
    priority: 10
    matchers:
      - type: literal
        field: to
        value: dmarc@fernfiles.com
    actions:
      - type: forward
        value:
          - scott@willeke.com
