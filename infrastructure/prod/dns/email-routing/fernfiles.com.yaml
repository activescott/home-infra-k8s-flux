# Email Routing for fernfiles.com. Unlike Email Sending, routing is fully declarative -- the
# provider serves EmailRoutingRule and EmailRoutingCatchAll directly, so nothing here needs the
# onboarding dance Email Sending does.
#
# Routing is already enabled on this zone (status: ready) with the apex MX, SPF and
# cf2024-1 DKIM records adopted in zones/fernfiles.com.yaml. Those records are Cloudflare's,
# but unlike the Email Sending ones they can be unlocked, which is why they are fully
# managed there and the cf-bounce ones are not.
#
# Every forwarding rule on this zone is composed from the RoleMailboxes below, so the
# destination address appears in no manifest. Only the catch-all is an ordinary managed
# resource: it forwards nothing, so it needs nothing from the Secret.
#
# Disabled, dropping catch-all. See ramblefeed.com.yaml for why this is EmailRoutingCatchAll
# rather than a second EmailRoutingRule.
apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
kind: EmailRoutingCatchAll
metadata:
  name: fernfiles-com-catch-all
  namespace: cloudflare
  annotations:
    crossplane.io/external-name: 1e2a6ca9c98d4e85a6890d6f0b108fd4
spec:
  # Everything except Delete: Crossplane may observe, create and update these rules but never
  # remove them from Cloudflare. Adoption transfers ownership, not lifecycle -- several of these
  # predate Crossplane by years -- and with `prune: true` on both cluster Kustomizations a
  # kustomize path typo would otherwise delete real mail routing.
  #
  # This is the v2 spelling. `deletionPolicy: Orphan` does NOT exist on namespaced managed
  # resources (`*.m.cloudflare.com`); setting it fails the Flux dry-run with
  # ".spec.deletionPolicy: field not declared in schema" and blocks the whole kustomization.
  managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
  # The Email Routing token, not the DNS one -- Cloudflare rate-limits per token, and these
  # resources need a budget the 114 DNS records cannot exhaust. See
  # infrastructure/prod/controllers/crossplane-config/providerconfig.yaml.
  providerConfigRef:
    kind: ProviderConfig
    name: email-routing
  forProvider:
    zoneId: dad431388d3f4e6e76b5bcbeac28d56a
    enabled: false
    matchers:
      - type: all
    actions:
      - type: drop
#
# Why every routing resource in this directory carries a pinned Cloudflare rule id -- as an
# external-name annotation here, or as a `spec.adopt` entry on a RoleMailboxes -- including the
# ones Crossplane created itself.
#
# When the first five rules were applied without one, the creates succeeded -- Cloudflare made
# each rule exactly once -- but the Observe that runs immediately afterwards, which is what
# reads the assigned id back out and writes it into the external-name annotation, was rejected
# with 429 Too Many Requests. Cloudflare rate-limits the Email Routing endpoints far more
# tightly than DNS, and seventeen resources reconciling at once cleared that limit.
#
# The result is a resource that is created but has no external name. Crossplane records
# `crossplane.io/external-create-succeeded` for exactly this case and then refuses to act,
# which is what stopped it creating a second copy of every rule on the next pass -- the failure
# this whole adoption strategy is built to avoid. It is safe, but it is stuck, and it does not
# resolve on its own: with no external name there is nothing for a later Observe to look up.
#
# Pinning the id in git is the durable repair. It converts a create into an adoption, which is
# idempotent, breaks the error loop that was sustaining the 429, and survives the managed
# resource being deleted and recreated. An in-cluster `kubectl annotate` would have fixed the
# symptom until the next time something reapplied from git.

---
# RFC 2142 §5.2 role mailboxes for fernfiles.com, plus this zone's own aliases. One
# RoleMailboxes composite fans out into one EmailRoutingRule per entry -- abuse, noc, security,
# postmaster, hostmaster, webmaster, and everything under `aliases` -- each forwarding to the
# destination held in the SOPS-encrypted Secret cloudflare/email-routing-destination.
#
# The mailbox list and the destination both live in the Composition rather than
# here, so every zone provably gets the identical set and the address appears in
# no manifest. See
# infrastructure/prod/controllers/crossplane-config/rolemailboxes/xrd.yaml.
apiVersion: email.activescott.com/v1alpha1
kind: RoleMailboxes
metadata:
  name: fernfiles-com-rfc2142
  namespace: cloudflare
spec:
  zoneId: dad431388d3f4e6e76b5bcbeac28d56a
  zoneName: fernfiles.com
  aliases:
    # Destination for the rua= address in _dmarc.fernfiles.com. Without a rule, aggregate
    # reports bounce and the p=none monitoring period observes nothing. Created by Crossplane
    # on 2026-08-28 as a hand-written EmailRoutingRule; moved here so its forward address
    # comes from the Secret instead of sitting in git.
    - localPart: dmarc
      ruleName: dmarc-reports
      priority: 10
    # The two addresses the shipped policy pages already publish. Until these existed, both
    # pages pointed users at addresses that hit the dropping catch-all above, so a privacy
    # request or a support mail was accepted by Cloudflare and silently discarded.
    #
    # Priority is deliberately the same 10 as the DMARC rule: literal matchers cannot overlap,
    # so relative order between them never decides delivery.
    - localPart: privacy
      priority: 10
    - localPart: support
      priority: 10
    # Personal alias, same as the "scott" alias on coinpoet/tinkerbellbot/gpupoet/ramblefeed --
    # see xrd.yaml. New rule on this zone, so no adopt entry: ruleName defaults to "scott" and
    # priority defaults to 10.
    - localPart: scott
      priority: 10
  # Cloudflare rule ids, so each composed resource adopts its existing rule rather than
  # creating a second one. See the `adopt` description in the XRD, and the note above, for why
  # these stay here permanently instead of being removed once adopted.
  adopt:
    abuse: 90e92ffded8b4b2f87c136615d6355ae
    noc: abd4c6d4518745c08213497445f93e69
    security: 2cefad93d34b483fb0f0792b2f094ce0
    postmaster: 2941a05568c04556a5eec33c7f5406b4
    hostmaster: 19524c56a1ec463890f6d7ebdab514d0
    webmaster: 81f483aa706c46e79033859ca6ac9840
    dmarc: 28e88c59e5c5488697277d99598a7b32
    privacy: fabc55828afc432184868f9ad0ffede4
    support: 24bb47ac27064ec7a258be8fc1cd33df
