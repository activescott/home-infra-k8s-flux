# productpoet.com is a parked domain, used to prove the tooling before it touches a
# zone anything depends on.
#
# The apex TXT is a real Sedo verification record that predates Crossplane. It is
# adopted here by its existing Cloudflare record ID rather than recreated, so its ID
# and value survive unchanged.
apiVersion: dns.activescott.com/v1alpha1
kind: DNSZone
metadata:
  name: productpoet-com
  namespace: cloudflare
spec:
  zoneId: 467a5ad3fda60cfde71636fd7447e733
  defaults:
    ttl: 300
    proxied: false
  records:
    - key: apex-sedo-verification
      name: productpoet.com
      type: TXT
      content: a0bc85eaa82517101cbd12886f579defe9c11ed6
      # ttl 1 is Cloudflare's "automatic". Matches the live record exactly, so
      # adoption is a no-op rather than an immediate update.
      ttl: 1
      comment: for sedo.com
      adopt: ed29a28dd4103a5304cd9c9736e33b36
    # Created before this zone is onboarded to Email Sending, deliberately. Onboarding makes
    # Cloudflare write its own _dmarc record at p=reject, and the records Email Service
    # manages are locked; only Email Routing's root-domain records can ever be unlocked
    # (developers.cloudflare.com/email-service/configuration/domains/). Whether an existing
    # DMARC record survives onboarding decides who can own this record on the real sending
    # domains, so it is established here first and re-read afterwards.
    - key: dmarc-txt
      name: _dmarc.productpoet.com
      type: TXT
      content: v=DMARC1; p=none; rua=mailto:dmarc@productpoet.com
      comment: probe -- does Email Sending onboarding overwrite an existing DMARC record?
