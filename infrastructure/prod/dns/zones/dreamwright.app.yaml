# dreamwright.app sends and receives no mail: SPF that authorizes nothing and DMARC at
# p=reject. There is no rua= address, so no Email Routing rule for dmarc@ exists for this
# zone, and enabling routing would write apex MX records.
#
# No null MX (RFC 7505): the composition renders priority with `with`, which skips 0, so
# a `priority: 0` MX would reach Cloudflare without a priority.
apiVersion: dns.activescott.com/v1alpha1
kind: DNSZone
metadata:
  name: dreamwright-app
  namespace: cloudflare
spec:
  zoneId: d4d737894905e3ced0bc6861642492e5
  defaults:
    ttl: 300
    proxied: false
  records:
    - key: apex-cname
      name: dreamwright.app
      type: CNAME
      ttl: 1
      content: k8s.activescott.com
    - key: www-cname
      name: www.dreamwright.app
      type: CNAME
      ttl: 1
      content: k8s.activescott.com
    - key: apex-spf-txt
      name: dreamwright.app
      type: TXT
      content: v=spf1 -all
    - key: dmarc-txt
      name: _dmarc.dreamwright.app
      type: TXT
      content: v=DMARC1; p=reject
