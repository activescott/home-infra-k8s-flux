# getdreamwright.ai is the company's domain: email on a new Google Workspace and the
# marketing site. The app stays on dreamwright.app (see dreamwright.app.yaml).
# Registered at the Cloudflare Registrar, which requires Cloudflare DNS, so the zone
# already exists; this file adopts it into git with no records yet.
#
# The Google Workspace MX, SPF, DKIM and DMARC records and the verification TXT come in
# later PRs, as the signup reaches each step (ping-poet/dreamwright#1886).
apiVersion: dns.activescott.com/v1alpha1
kind: DNSZone
metadata:
  name: getdreamwright-ai
  namespace: cloudflare
spec:
  zoneId: 4c21fdefd750946aa765fa3e48c18254
  defaults:
    ttl: 300
    proxied: false
  records:
    # Google Workspace domain ownership check (ping-poet/dreamwright#1886).
    - key: apex-google-site-verification-txt
      name: getdreamwright.ai
      type: TXT
      content: google-site-verification=DDCxI8aYTepIAEkqNkX0jFyvLOoQaiNZNBWP8IHzcSs
    # Google Workspace mail (ping-poet/dreamwright#1886): Google's current single MX
    # host, SPF, the DKIM key generated in the Workspace admin console, and DMARC.
    - key: apex-mx-google
      name: getdreamwright.ai
      type: MX
      priority: 1
      content: smtp.google.com
    - key: apex-spf-txt
      name: getdreamwright.ai
      type: TXT
      content: v=spf1 include:_spf.google.com ~all
    - key: google-dkim-txt
      name: google._domainkey.getdreamwright.ai
      type: TXT
      content: v=DKIM1;k=rsa;
    - key: dmarc-txt
      name: _dmarc.getdreamwright.ai
      type: TXT
      content: v=DMARC1; p=quarantine
    # Google Workspace custom service URLs (ping-poet/dreamwright#1886).
    - key: calendar-google-cname
      name: calendar.getdreamwright.ai
      type: CNAME
      content: ghs.googlehosted.com
    - key: drive-google-cname
      name: drive.getdreamwright.ai
      type: CNAME
      content: ghs.googlehosted.com
    - key: mail-google-cname
      name: mail.getdreamwright.ai
      type: CNAME
      content: ghs.googlehosted.com
    - key: groups-google-cname
      name: groups.getdreamwright.ai
      type: CNAME
      content: ghs.googlehosted.com
    # Redirect to https://dreamwright.app (ping-poet/dreamwright#2149). Cloudflare only
    # runs redirect rules on proxied traffic, so the apex and www are proxied records
    # pointing at 192.0.2.1, a documentation-range address that is never contacted: the
    # redirect in ../redirects/getdreamwright.ai.yaml answers at the edge.
    - key: apex-redirect-a
      name: getdreamwright.ai
      type: A
      ttl: 1
      proxied: true
      content: 192.0.2.1
    - key: www-redirect-a
      name: www.getdreamwright.ai
      type: A
      ttl: 1
      proxied: true
      content: 192.0.2.1
