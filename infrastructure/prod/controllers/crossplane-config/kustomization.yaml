apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./providerconfig.yaml
  # The DNSZone API -- see ./dnszone/README.md. Crossplane creates its CRD from the
  # XRD, so DNSZone instances belong one stage later, in crossplane-dns.
  - ./dnszone

secretGenerator:
  # Fixed name (no hash suffix): providerconfig.yaml references it by name, and a hash suffix
  # would break that reference on every rotation.
  #
  # The generator KEY selects the SOPS format kustomize-controller uses to decrypt --
  # "credentials.json" -> json. Do not rename the key without regenerating the .encrypted file
  # accordingly; see scripts/create-cloudflare-credentials.sh.
  - name: cloudflare-credentials
    namespace: cloudflare
    files:
      - credentials.json=cloudflare-credentials.json.encrypted
    options:
      disableNameSuffixHash: true
  # The Email Routing token, consumed by the `email-routing` ProviderConfig. Separate from the
  # one above because Cloudflare's rate limit is per token -- see providerconfig.yaml for the
  # measurement that forced the split. Same fixed-name and generator-key constraints apply.
  - name: cloudflare-email-credentials
    namespace: cloudflare
    files:
      - credentials.json=cloudflare-email-credentials.json.encrypted
    options:
      disableNameSuffixHash: true

buildMetadata: [originAnnotations, transformerAnnotations]
