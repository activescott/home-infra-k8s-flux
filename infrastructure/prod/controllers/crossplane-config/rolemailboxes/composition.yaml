# Composition for RoleMailboxes -- see ./xrd.yaml. One go-templating step ranges
# over the RFC 2142 §5.2 mailbox list plus the XR's aliases and emits one
# EmailRoutingRule per entry, then function-auto-ready rolls their readiness up to
# the XR.
#
# Why go-templating rather than patch-and-transform: this needs iteration (six or
# more managed resources from one XR) and it needs to read a Secret. P&T does
# neither -- it has no loop, and its patch types are a closed set with no way to
# source a value from a Secret. Both functions used here are already installed for
# DNSZone.
#
# The destination address is read at compose time from the SOPS-encrypted Secret
# cloudflare/email-routing-destination (key `destination`), via ExtraResources.
# It is not in any manifest in this repo.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: rolemailboxes-cloudflare
spec:
  compositeTypeRef:
    apiVersion: email.activescott.com/v1alpha1
    kind: RoleMailboxes
  mode: Pipeline
  pipeline:
    - step: render-rules
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- /*
              RFC 2142 §5.2, in section order. Fixed here rather than in the XR
              spec so every zone provably gets the same set. §5.2 group (b)
              (usenet/news, ftp, uucp) is conditional on running those services
              and none of these zones do; §5.3 CERT is only recommended and is
              out of scope. Adding a name here adds it to all seven zones.
            */ -}}
            {{- $mailboxes := list "abuse" "noc" "security" "postmaster" "hostmaster" "webmaster" -}}
            {{- /*
              Flatten the mandatory six and the per-zone aliases into one list of
              {localPart, ruleName, priority} so the rule body below is written
              once. The six are all ruleName == localPart at priority 10.
            */ -}}
            {{- $entries := list -}}
            {{- range $mailbox := $mailboxes -}}
            {{- $entries = append $entries (dict "localPart" $mailbox "ruleName" $mailbox "priority" 10) -}}
            {{- end -}}
            {{- range $alias := ($xr.spec.aliases | default list) -}}
            {{- if has $alias.localPart $mailboxes -}}
            {{- fail (printf "alias localPart %q is already an RFC 2142 mailbox; it would collide on composition-resource-name" $alias.localPart) -}}
            {{- end -}}
            {{- /*
              hasKey, not `default 10`: sprig's `default` treats 0 as empty, and
              priority 0 is the real value on every dashboard-era adopted rule.
              `default` would silently rewrite them to 10 -- a live Cloudflare
              change with no diff in this repo to explain it.
            */ -}}
            {{- $priority := 10 -}}
            {{- if hasKey $alias "priority" -}}{{- $priority = $alias.priority -}}{{- end -}}
            {{- $entries = append $entries (dict "localPart" $alias.localPart "ruleName" ($alias.ruleName | default $alias.localPart) "priority" $priority) -}}
            {{- end -}}
            {{- $adopt := $xr.spec.adopt | default dict -}}
            ---
            # Ask Crossplane for the destination Secret. This makes the pipeline
            # two-pass: the first call returns only this requirement with
            # .extraResources empty, and Crossplane calls back with the Secret
            # populated. The `if` below is what makes the first pass a no-op
            # instead of rendering six rules with an empty forward address.
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              destination-secret:
                apiVersion: v1
                kind: Secret
                matchName: email-routing-destination
                # The XR's own namespace, never a literal. A namespaced XR may
                # only reach resources in its own namespace, so this is the only
                # correct value -- and deriving it keeps the Composition from
                # hardcoding where its instances live.
                namespace: {{ $xr.metadata.namespace }}
            {{- /*
              Every step defaults, because on the first pass .extraResources is
              absent entirely -- not an empty map, nil -- and `index` on nil is a
              fatal template error, not an empty result.
            */ -}}
            {{- $found := index (.extraResources | default dict) "destination-secret" | default dict }}
            {{- $items := index $found "items" | default list }}
            {{- if $items }}
            {{- $destination := index (index $items 0).resource.data "destination" | b64dec | trim }}
            {{- range $entry := $entries }}
            ---
            apiVersion: email.cloudflare.m.cloudflare.com/v1alpha1
            kind: EmailRoutingRule
            metadata:
              annotations:
                # Identity of this composed resource, keyed by mailbox name rather
                # than loop index: an index shifts for every name inserted above
                # it, which Crossplane reads as "these resources were replaced"
                # and acts on by deleting and recreating the live Cloudflare
                # rules. Same rationale as dnszone/composition.yaml.
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $entry.localPart }}
                {{- $id := index $adopt $entry.localPart | default "" }}
                {{- if $id }}
                # Pinned Cloudflare rule id from spec.adopt, so this reconciles as
                # an adoption rather than a create. Without it, deleting and
                # recreating this managed resource makes a SECOND Cloudflare rule
                # for the same address: the id Crossplane records in this
                # annotation at create time lives only on the object being
                # deleted. Also the durable repair for the 2026-08-28 case where
                # Cloudflare 429'd the post-create Observe and left rules with no
                # external name and no way to recover one.
                crossplane.io/external-name: {{ $id | quote }}
                {{- end }}
            spec:
              providerConfigRef:
                kind: ProviderConfig
                name: {{ $xr.spec.providerConfigName | default "email-routing" | quote }}
              # Everything except Delete. Removing a rule from this Composition
              # stops Crossplane managing it; it does not delete it from
              # Cloudflare. deletionPolicy: Orphan is rejected on namespaced
              # m.cloudflare.com resources, so the policy list is how that intent
              # is expressed.
              managementPolicies: ["Observe", "Create", "Update", "LateInitialize"]
              forProvider:
                zoneId: {{ $xr.spec.zoneId | quote }}
                name: {{ $entry.ruleName | quote }}
                enabled: true
                # 10 for the RFC 2142 six and for the GitOps-created aliases
                # (dmarc-reports, privacy, support); 0 for dashboard-era rules
                # adopted at that value and kept there. Literal matchers cannot
                # overlap, so relative order never decides delivery -- the number
                # matters only because changing it writes to Cloudflare. The
                # catch-all is a separate resource kind that Cloudflare always
                # evaluates last, so it cannot shadow these regardless.
                priority: {{ $entry.priority }}
                matchers:
                  - type: literal
                    field: to
                    value: {{ printf "%s@%s" $entry.localPart $xr.spec.zoneName | quote }}
                actions:
                  - type: forward
                    value:
                      - {{ $destination | quote }}
            {{- end }}
            {{- end }}
    - step: auto-ready
      functionRef:
        name: function-auto-ready
