# The default config, used by everything except the Email Routing resources: DNS records, zone
# settings, and the DNSZone composites. Its token carries DNS: Edit and Zone: Read, and after
# the 2026-08-28 rotation it no longer carries Email Routing Rules -- the `email-routing` config
# below owns that surface, on a separate token and therefore a separate rate-limit budget.
apiVersion: cloudflare.m.cloudflare.com/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: cloudflare
spec:
  credentials:
    source: Secret
    secretRef:
      name: cloudflare-credentials
      namespace: cloudflare
      # Key is "credentials.json", not "credentials". kustomize-controller derives the SOPS
      # input format from the generator KEY rather than the filename, so the .json suffix is
      # what makes Flux decrypt this as JSON. Same constraint as apps/production/zot.
      key: credentials.json
---
# Cluster-scoped equivalent, so managed resources outside the `cloudflare` namespace can share
# the same credential without duplicating the Secret. Both point at the one Secret; whichever a
# resource references, it is the same token.
#
# Note the group is `cloudflare.m.cloudflare.com`, NOT `cloudflare.m.crossplane.io`. The
# provider repo's own examples/ say the latter and are wrong -- see
# apis/namespaced/v1beta1/register.go:12. Managed resources follow the same pattern
# (dns.cloudflare.m.cloudflare.com, email.cloudflare.m.cloudflare.com, ...). The cluster-scoped
# ProviderConfig is different again, `cloudflare.cloudflare.com`, while cluster-scoped managed
# resources are `<sub>.cloudflare.crossplane.io`. Verify with `kubectl get crd | grep cloudflare`
# rather than trusting the examples.
apiVersion: cloudflare.m.cloudflare.com/v1beta1
kind: ClusterProviderConfig
metadata:
  name: cloudflare
spec:
  credentials:
    source: Secret
    secretRef:
      name: cloudflare-credentials
      namespace: cloudflare
      key: credentials.json
---
# A second token, holding ONLY the Email Routing resources -- the 17 objects under
# infrastructure/prod/dns/email-routing/.
#
# Cloudflare rate-limits per token: 1,200 requests per 5 minutes, and going over 429s every
# call for the next 5 minutes rather than only the offending one. An upjet Observe costs ~9
# Cloudflare API calls per managed resource, and a fresh provider pod observes every resource
# it owns at once, so with all 131 resources on one token a cold sweep cost ~1,186 calls --
# measured at ~380/minute on 2026-08-28, exhausting the budget in about three minutes. Email
# Routing comes late in that sweep, so it absorbed the rejections and its 17 objects never
# reached Synced while the 114 DNS records reconciled normally. It looked like an Email Routing
# or credential fault for hours and was neither.
#
# No provider flag fixes it. --max-reconcile-rate is a rate per SECOND, so even at 1 the sweep
# runs ~9 calls/sec = 2,700 per 5 minutes, still over budget; at 2 it starved the Email Routing
# controllers of workers entirely (see provider-cloudflare-runtimeconfig.yaml). --poll only
# controls drift detection and does nothing about the startup burst, which is the actual cost.
#
# Two tokens means two budgets, which is the only lever that changes the arithmetic:
#   default        114 DNS records            ~1,026 calls/sweep, alone in its budget
#   email-routing   17 Email Routing objects    ~153 calls/sweep, 13% of its budget
#
# Namespaced only -- every Email Routing resource lives in the `cloudflare` namespace, so there
# is no cluster-scoped equivalent here. Add one only if a resource outside that namespace ever
# needs this token.
apiVersion: cloudflare.m.cloudflare.com/v1beta1
kind: ProviderConfig
metadata:
  name: email-routing
  namespace: cloudflare
spec:
  credentials:
    source: Secret
    secretRef:
      name: cloudflare-email-credentials
      namespace: cloudflare
      key: credentials.json
