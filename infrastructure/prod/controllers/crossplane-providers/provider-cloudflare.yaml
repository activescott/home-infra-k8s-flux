apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-upjet-cloudflare
spec:
  # Generated from the Cloudflare Terraform provider via upjet. The package itself is young
  # (v0.1.0), but the resource handling underneath is the mature Terraform provider.
  #
  # Ships 247 CRDs. Relevant here: dnsrecords, zones, zonesettings, and the full email routing
  # set (emailroutingrules / -addresses / -catchalls / -settings / -dnses).
  #
  # NOT covered: Cloudflare Email *Sending*. There is no CRD for it, because the upstream
  # Terraform provider has no resource for it -- so onboarding a sending domain stays a manual
  # dashboard step. Verified by enumerating the package; details in the private repo's
  # docs/specs/email-infrastructure/.
  # Built and published from activescott/provider-upjet-cloudflare, a fork of
  # crossplane-contrib/provider-upjet-cloudflare. Upstream has never cut a release: it has no
  # tags, its Publish Provider Package workflow has never run, and nothing is pushed to any
  # registry -- xpkg.crossplane.io and ghcr.io/crossplane-contrib both deny the pull. The
  # source is healthy (CI green on main, e2e green), it was simply never published.
  #
  # The fork carries two fixes, both offered back upstream:
  #
  # 1. Publishing. The default GITHUB_TOKEN is read-only, and registry_org was hardcoded to
  #    crossplane-contrib, so no fork could ever push a package.
  #
  # 2. Nothing could be created. Upstream generates Terraform-CLI controllers for every
  #    resource, but terraform-provider-cloudflare v5 is pure plugin-framework: upjet writes an
  #    empty "id" into tfstate before the first create, refreshes, and the Cloudflare Read
  #    answers with an error diagnostic instead of empty state -- so observe fails and create
  #    never runs. That is upstream issue #31. The DNS record, the five email routing kinds and
  #    the zone setting are now served through upjet's plugin framework runtime, which is the
  #    only one exposing IsNotFoundDiagnosticFn. The other resources keep their CLI
  #    controllers, so no CRD schema changed. Hosting the framework provider in-process needs
  #    an exported constructor, which Cloudflare does not ship (implementation is under
  #    internal/), so the fork also depends on activescott/terraform-provider-cloudflare via a
  #    replace directive. Two dependencies the CLI runtime never used had to be supplied for
  #    the framework runtime: controller.Options.OperationTrackerStore (nil-dereference panic
  #    without it) and terraform.Setup.FrameworkProvider ("cannot retrieve framework
  #    provider").
  #
  #    v0.4.0 widens that fix. IsNotFoundDiagnosticFn matched only identifier arguments
  #    ending in "_id", so EmailRoutingRule (rule_identifier) and EmailRoutingAddress
  #    (destination_address_identifier) still could not be created -- the same failure, for a
  #    second spelling of the argument name.
  #
  # Verified end to end against the live Cloudflare API on 2026-08-27: a DNSRecord with no
  # external-name reconciles to Synced=True/Ready=True, Cloudflare assigns the record id and it
  # is written back as the external name, and deleting the managed resource removes the record.
  #
  # Rebuild only when an input changes -- a new Cloudflare Terraform provider release (pinned
  # as TERRAFORM_PROVIDER_VERSION, currently 5.15.0), a new upjet/crossplane-runtime, or a
  # dependency CVE. Cloudflare API changes alone do not require one; they arrive here only via
  # a Terraform provider release. Publishing is a manual workflow_dispatch, documented in the
  # fork's README.
  package: ghcr.io/activescott/provider-upjet-cloudflare:v0.4.0
  # Polling cadence lives in provider-cloudflare-runtimeconfig.yaml. The default 1m puts this
  # many managed resources over Cloudflare's 1,200-per-5-minute token limit, which then blocks
  # every call for 5 minutes and re-trips as polling continues. Read that file before changing
  # it -- and do not add --max-reconcile-rate, which silently stops controllers.
  runtimeConfigRef:
    name: provider-upjet-cloudflare
