# Slows the Cloudflare provider's polling down to something Cloudflare's Email Routing
# endpoints will actually tolerate.
#
# The default is --poll=1m, so every managed resource is re-read once a minute. With 131 of
# them that is ~131 requests a minute steady-state, which DNS absorbed without complaint for a
# day. The Email Routing endpoints did not: adding 17 routing resources produced a sustained
#
#   429 Too Many Requests {"code":971,"message":"Please wait and consider throttling your
#   request speed"}
#
# and it did not clear on its own, because a failed reconcile retries on its own backoff rather
# than waiting for the next poll -- so seventeen erroring resources generate far more traffic
# than seventeen healthy ones, and the throttle sustains itself. 25 minutes at Synced=False
# with no progress.
#
# 15m is not a compromise. These resources are DNS records and mail routing rules: they change
# when someone changes them in git, and the poll exists only to catch drift made outside git,
# which for this account should be nothing. Detecting such drift in 15 minutes rather than 1 is
# not a meaningful loss, and it takes the steady-state load to ~9 requests a minute.
#
# max-reconcile-rate caps how many reconciles run at once. Lowering it from the default 10
# flattens the burst when many resources are applied together -- which is exactly the shape
# that triggered this, 17 rules arriving in one Flux apply.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-upjet-cloudflare
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            # Must be `package-runtime`; that is the name Crossplane gives the provider
            # container, and the patch is matched by name rather than position.
            - name: package-runtime
              args:
                - --poll=15m
                - --max-reconcile-rate=2
