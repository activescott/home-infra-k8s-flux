# Crossplane gets its own Kustomization chain rather than being folded into infra-configs,
# for two reasons:
#
#  1. Ordering. Each stage installs CRDs the next stage needs (core -> Provider -> ProviderConfig).
#     A single Kustomization would fail its first apply with "no matches for kind".
#  2. Timeouts. infra-configs and apps both use `wait: true, timeout: 5m0s`. Pulling the
#     Crossplane provider image on a single-node home connection can exceed that, and a slow
#     provider pull should not mark the whole of infra-configs unhealthy.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infra-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/prod/controllers/crossplane
  prune: true
  wait: true
  timeout: 15m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-providers
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: crossplane
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/prod/controllers/crossplane-providers
  prune: true
  wait: true
  # Provider images are large and this stage also waits for the ProviderRevision to install
  # 251 CRDs.
  timeout: 15m0s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-config
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: crossplane-providers
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/prod/controllers/crossplane-config
  prune: true
  wait: true
  timeout: 5m0s
  # https://fluxcd.io/flux/components/kustomize/api/v1/#kustomize.toolkit.fluxcd.io/v1.Decryption
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Cloudflare DNS, as DNSZone composite resources. Separate from crossplane-config so
# a DNS change never waits on, or is blocked by, the provider/credential stage.
#
# `prune: true` is deliberate and load-bearing: removing a record from a DNSZone --
# or removing the DNSZone itself -- is how a record gets deleted from Cloudflare.
# Git history is the recovery path. Verified end to end 2026-08-27 on productpoet.com.
#
# `wait: true` is meaningful here, unlike the Provider resource in the stage above
# whose Installed/Healthy conditions kstatus cannot read and reports green
# regardless. A DNSZone carries a standard `Ready` condition, which the
# Composition's function-auto-ready step flips once every composed record is Ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-dns
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: crossplane-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/prod/dns
  prune: true
  wait: true
  timeout: 5m0s
