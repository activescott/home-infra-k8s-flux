name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  kustomize-build:
    # Fork PRs stay on GitHub-hosted runners: this repo is public and the
    # self-hosted runner is a privileged dind pod on the cluster's only node.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'home-infra-k8s-flux-runners' }}
    steps:
      - uses: actions/checkout@v7

      # Pinned to match the cluster's Flux controllers:
      #   kustomize-controller v1.9.5 embeds kustomize API v0.21.1 (= CLI v5.8.1)
      #   helm-controller v1.6.4 embeds Helm v4.2.4
      # Source: clusters/nas1/flux-system/gotk-components.yaml
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.8.1
          sudo mv kustomize /usr/local/bin/

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Build apps/production
        run: |
          output=$(kustomize build apps/production --enable-helm)
          lines=$(echo "$output" | wc -l)
          echo "apps/production line count: $lines"
          [ "$lines" -gt 0 ]

      - name: Build infrastructure/prod/configs
        run: |
          output=$(kustomize build infrastructure/prod/configs --enable-helm)
          lines=$(echo "$output" | wc -l)
          echo "infrastructure/prod/configs line count: $lines"
          [ "$lines" -gt 0 ]

      - name: Build infrastructure/prod/dns
        run: |
          output=$(kustomize build infrastructure/prod/dns --enable-helm)
          lines=$(echo "$output" | wc -l)
          echo "infrastructure/prod/dns line count: $lines"
          [ "$lines" -gt 0 ]

      # The stock self-hosted runner image does not ship yq.
      - name: Install yq
        run: |
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      # vcluster only delivers a changed Corefile under a new ConfigMap name; see the coredns
      # comment in the HelmRelease for why.
      - name: vcluster Corefile ConfigMap name matches its content
        run: |
          f=apps/production/agent-sandbox-k8s/helmrelease.yaml
          manifests=$(yq '.spec.values.controlPlane.coredns.overwriteManifests' "$f")
          name=$(echo "$manifests" | yq 'select(.kind == "ConfigMap" and .metadata.name == "coredns-corefile-*") | .metadata.name')
          hash=$(echo "$manifests" | yq 'select(.kind == "ConfigMap" and .metadata.name == "coredns-corefile-*") | .data.Corefile' | sha256sum | cut -c1-10)
          mounted=$(echo "$manifests" | yq 'select(.kind == "Deployment" and .metadata.name == "coredns") | .spec.template.spec.volumes[].projected.sources[]?.configMap.name | select(. == "coredns-corefile-*")')
          if [ "$name" != "coredns-corefile-$hash" ] || [ "$mounted" != "coredns-corefile-$hash" ]; then
            echo "FAIL: ConfigMap is '$name' and the Deployment mounts '$mounted', expected coredns-corefile-$hash"
            echo "Fix: sed -i 's/$name/coredns-corefile-$hash/g' $f"
            exit 1
          fi
