name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  kustomize-build:
    # Fork PRs stay on GitHub-hosted runners: this repo is public and the
    # self-hosted runner is a privileged dind pod on the cluster's only node.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'home-infra-k8s-flux-runners' }}
    steps:
      - uses: actions/checkout@v7

      # Pinned to match the cluster's Flux controllers:
      #   kustomize-controller v1.9.5 embeds kustomize API v0.21.1 (= CLI v5.8.1)
      #   helm-controller v1.6.4 embeds Helm v4.2.4
      # Source: clusters/nas1/flux-system/gotk-components.yaml
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.8.1
          sudo mv kustomize /usr/local/bin/

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: scripts/.nvmrc

      # GitHub-hosted runners ship yq; the stock self-hosted runner image does not.
      - name: Install yq
        run: |
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Build apps/production
        run: |
          kustomize build apps/production --enable-helm > /tmp/apps-production.yaml
          lines=$(wc -l < /tmp/apps-production.yaml)
          echo "apps/production line count: $lines"
          [ "$lines" -gt 0 ]

      - name: Build infrastructure/prod/configs
        run: |
          kustomize build infrastructure/prod/configs --enable-helm > /tmp/infra-configs.yaml
          lines=$(wc -l < /tmp/infra-configs.yaml)
          echo "infrastructure/prod/configs line count: $lines"
          [ "$lines" -gt 0 ]

      - name: Build infrastructure/prod/dns
        run: |
          kustomize build infrastructure/prod/dns --enable-helm > /tmp/infra-dns.yaml
          lines=$(wc -l < /tmp/infra-dns.yaml)
          echo "infrastructure/prod/dns line count: $lines"
          [ "$lines" -gt 0 ]

      # kustomize build emits a volume referencing a ConfigMap/Secret the build
      # never defines without complaint (#335), so this checks the built output.
      - name: Check volume references resolve (apps/production)
        run: yq -o=json ea '[.]' /tmp/apps-production.yaml | ./scripts/check-volume-refs.mts

      - name: Check volume references resolve (infrastructure/prod/configs)
        run: yq -o=json ea '[.]' /tmp/infra-configs.yaml | ./scripts/check-volume-refs.mts

      - name: Check volume references resolve (infrastructure/prod/dns)
        run: yq -o=json ea '[.]' /tmp/infra-dns.yaml | ./scripts/check-volume-refs.mts
