name: install-plugins

on:
  pull_request:
    branches: [main]
    paths:
      - apps/production/olya/**
      - .github/workflows/install-plugins.yml
      - .github/scripts/test-install-plugins.sh
  push:
    branches: [main]
    paths:
      - apps/production/olya/**
      - .github/workflows/install-plugins.yml
      - .github/scripts/test-install-plugins.sh

permissions:
  contents: read
  packages: read

jobs:
  install-plugins:
    # The olya image is private, so fork PRs can't pull it and don't run this at all.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: home-infra-k8s-flux-runners
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The stock self-hosted runner image does not ship yq.
      - name: Install yq
        run: |
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      # Image and memory limit come from the manifests, so an image bump or a limit change is
      # tested as it will deploy.
      - name: Read image and memory limit
        id: target
        run: |
          tag=$(yq '.images[] | select(.name == "olya-image") | .newTag' apps/production/olya/kustomization.yaml)
          limit=$(yq '.spec.template.spec.initContainers[] | select(.name == "install-plugins") | .resources.limits.memory' apps/production/olya/olya-statefulset.yaml)
          case "$limit" in
            *Gi) mem=${limit%Gi}g ;;
            *Mi) mem=${limit%Mi}m ;;
            *) echo "::error::unhandled memory limit '$limit'"; exit 1 ;;
          esac
          echo "image=ghcr.io/activescott/olya:$tag" >> "$GITHUB_OUTPUT"
          echo "mem=$mem" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/activescott/olya:$tag, install-plugins limit $limit (--memory $mem)"

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${{ steps.target.outputs.image }}"

      - name: Run install-plugins against each volume state
        run: .github/scripts/test-install-plugins.sh "${{ steps.target.outputs.image }}" "${{ steps.target.outputs.mem }}"
